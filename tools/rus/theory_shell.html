<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Теория 9–15 · орфография</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f2f7; --card: #ffffff; --ink: #1c1c1e; --muted: #6c6c70; --line: #e5e5ea; --soft: #f2f2f7; --hit: #fff3b0;
    --r: 16px; --ease: cubic-bezier(.2, .8, .2, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --card: #1c1c1e; --ink: #f2f2f7; --muted: #98989f; --line: #38383a; --soft: #2c2c2e; --hit: #4a4220; }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 64px; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 16px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%;
         -webkit-tap-highlight-color: transparent; overflow-wrap: break-word; }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
  a { color: inherit; }
  b { font-weight: 800; }
  p { margin: 0 0 10px; }

  .page { max-width: 760px; margin: 0 auto; padding: 0 16px 40px; padding-bottom: max(48px, env(safe-area-inset-bottom)); }

  /* Верхняя полоса: номера заданий + поиск */
  .bar { position: sticky; top: 0; z-index: 10; margin: 0 -16px; padding: 8px 12px 8px 16px; background: var(--bg);
         display: flex; align-items: center; gap: 8px; }
  .bar.shadow { box-shadow: 0 1px 0 var(--line); }
  .chips { flex: 1; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; min-width: 40px; height: 34px; padding: 0 11px; border-radius: 17px; background: var(--card);
          display: grid; place-items: center; text-decoration: none; font-weight: 600; font-size: 15px;
          transition: background-color .2s var(--ease), color .2s var(--ease); }
  .chip.on { background: var(--ink); color: var(--bg); }
  .ib { flex: none; width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center; background: var(--card); }
  .ib svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; }
  .find { flex: 1; min-width: 0; display: none; align-items: center; gap: 6px; }
  .bar.searching .chips, .bar.searching #open-find { display: none; }
  .bar.searching .find { display: flex; }
  .find input { flex: 1; min-width: 0; height: 36px; border: 0; border-radius: 10px; padding: 0 12px; background: var(--card);
                font-size: 16px; outline: none; -webkit-appearance: none; }
  .find .cnt { flex: none; font-size: 13px; color: var(--muted); min-width: 38px; text-align: center; font-variant-numeric: tabular-nums; }

  .head { margin: 14px 2px 12px; }
  .kicker { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 28px; line-height: 1.15; margin: 4px 0 6px; font-weight: 800; letter-spacing: -.01em; }
  .meta { font-size: 15px; color: var(--muted); }

  .part { margin-top: 22px; }
  .th { margin: 0 2px 10px; }
  .th h2 { font-size: 24px; line-height: 1.2; margin: 2px 0 0; font-weight: 800; letter-spacing: -.01em; }
  .card { background: var(--card); border-radius: var(--r); padding: 14px; }

  .toc { display: flex; flex-direction: column; margin: -4px 0 14px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .toc a { display: flex; gap: 10px; padding: 7px 0; text-decoration: none; font-size: 15px; line-height: 1.3; }
  .toc .num { flex: none; min-width: 34px; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }

  dl.info { margin: 0 0 14px; font-size: 15px; }
  dl.info > div { padding: 6px 0; border-bottom: 1px solid var(--line); }
  dl.info > div:last-child { border-bottom: 0; }
  dl.info dt { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 1px; }
  dl.info dd { margin: 0; }

  h3.sec { display: flex; gap: 10px; align-items: baseline; font-size: 19px; line-height: 1.25; font-weight: 800;
           margin: 26px 0 10px; padding-top: 14px; border-top: 2px solid var(--ink); }
  .toc + h3.sec, dl.info + h3.sec { margin-top: 8px; }
  h3.sec .num { flex: none; }
  h4.sub { font-size: 16px; font-weight: 700; margin: 18px 0 8px; }

  /* Суть правила — черта слева, как в PDF */
  .rule { border-left: 4px solid var(--ink); padding: 2px 0 2px 12px; margin: 4px 0 12px; font-weight: 700; font-size: 16.5px; line-height: 1.4; }

  /* ВЫУЧИТЬ — рамка, как в PDF */
  .lh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; font-size: 13px; font-weight: 700;
        letter-spacing: .03em; line-height: 1.3; margin: 16px 0 8px; }
  .tag { flex: none; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
         background: var(--ink); color: var(--card); border-radius: 6px; padding: 3px 7px; }
  .box { border: 2px solid var(--ink); border-radius: 14px; padding: 10px 12px 2px; margin: 12px 0 14px; }
  .box .lh { margin: 0 0 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .box p { font-size: 15.5px; }

  ul { margin: 0 0 10px; padding-left: 20px; }
  li { margin-bottom: 4px; }

  .pairs { margin: 0 0 8px; }
  .pr { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 1.35; }
  .pr:last-child { border-bottom: 0; }
  .pr > div:nth-child(2) { border-left: 1px solid var(--line); padding-left: 12px; }

  .words { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0 16px; font-size: 15px; line-height: 1.35; margin: 0 0 10px; }
  .w { display: block; padding: 4px 0 4px 10px; text-indent: -10px; border-bottom: 1px solid var(--line); }

  /* Таблицы */
  .tbl { margin: 0 0 14px; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; line-height: 1.38; }
  th, td { text-align: left; vertical-align: top; padding: 8px 8px 8px 0; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid var(--ink); }
  td:last-child, th:last-child { padding-right: 0; }
  .tbl.titled td:first-child { font-weight: 700; }

  /* Узкий экран: длинная таблица — карточками, по строке на карточку */
  @media screen and (max-width: 620px) {
    .tbl.stack table, .tbl.stack tbody, .tbl.stack tr, .tbl.stack td { display: block; width: auto; }
    .tbl.stack colgroup, .tbl.stack thead { display: none; }
    .tbl.stack tr { border-bottom: 1px solid var(--line); padding: 10px 0; }
    .tbl.stack tr:first-child { border-top: 2px solid var(--ink); }
    .tbl.stack td { border: 0; padding: 3px 0; }
    .tbl.stack td::before { content: attr(data-l); display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .05em;
                            text-transform: uppercase; color: var(--muted); margin-bottom: 1px; }
    .tbl.stack.titled td:first-child { font-size: 16px; padding-bottom: 4px; }
    .tbl.stack.titled td:first-child::before { display: none; }
    .tbl.keep table { font-size: 14.5px; }
  }

  details.src { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; font-size: 14px; color: var(--muted); }
  details.src summary { cursor: pointer; font-weight: 700; color: var(--ink); font-size: 15px; }
  details.src ul { margin-top: 8px; }

  .hit { background: var(--hit); border-radius: 6px; box-shadow: 0 0 0 4px var(--hit); }
  .hit.cur { outline: 2px solid var(--ink); outline-offset: 3px; }

  .end { text-align: center; color: var(--muted); font-size: 13px; margin-top: 22px; }

  @media print {
    :root { --bg: #fff; --card: #fff; --ink: #000; --muted: #000; --line: #000; --soft: #fff; }
    .bar { display: none; }
    .card { padding: 0; }
    .tag { background: none; color: #000; border: 1px solid #000; }
  }
</style>
</head>
<body>
<main class="page" id="page">
<div class="bar" id="bar">
  <nav class="chips" id="chips">__CHIPS__</nav>
  <button type="button" class="ib" id="open-find" aria-label="Найти слово"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>
  <div class="find">
    <input id="q" type="search" placeholder="Найти слово или правило" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
    <span class="cnt" id="cnt"></span>
    <button type="button" class="ib" id="next" aria-label="Следующее"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <button type="button" class="ib" id="close-find" aria-label="Закрыть поиск"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
</div>
__BODY__
<div class="end">Конец теории · задания 9–15</div>
</main>
<script>
(function () {
  var KEY = 'rus_teoriya_9_15_v1';   // где остановился: прокрутка страницы
  var bar = document.getElementById('bar');
  var chips = [].slice.call(document.querySelectorAll('.chip'));
  var parts = [].slice.call(document.querySelectorAll('.part'));

  function store(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} }
  function load() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }

  // Подсветка текущего задания в полосе сверху
  var curChip = null;
  function onScroll() {
    var y = window.scrollY + 140, id = parts[0].id;
    for (var i = 0; i < parts.length; i++) if (parts[i].offsetTop <= y) id = parts[i].id;
    if (id !== curChip) {
      curChip = id;
      chips.forEach(function (c) {
        var on = c.getAttribute('data-s') === id;
        c.classList.toggle('on', on);
        if (on && c.scrollIntoView) {
          var box = c.parentNode, l = c.offsetLeft - box.offsetLeft;
          if (l < box.scrollLeft || l + c.offsetWidth > box.scrollLeft + box.clientWidth) box.scrollLeft = l - 8;
        }
      });
    }
    bar.classList.toggle('shadow', window.scrollY > 4);
  }
  var saveT = null;
  window.addEventListener('scroll', function () {
    onScroll();
    clearTimeout(saveT);
    saveT = setTimeout(function () { store({ y: Math.round(window.scrollY) }); }, 300);
  }, { passive: true });

  // Переходы по оглавлению — плавно, без записи в историю (иначе «назад» в оболочке листает якоря)
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a) return;
    var el = document.getElementById(a.getAttribute('href').slice(1));
    if (!el) return;
    e.preventDefault();
    window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - (el.classList.contains('part') ? 52 : 60), behavior: 'smooth' });
  });

  // Поиск: ударения и ё не мешают; подсвечивается строка, абзац или слово из списка
  var units = [].slice.call(document.querySelectorAll('.u'));
  var norm = function (s) { return s.toLowerCase().replace(/́/g, '').replace(/ё/g, 'е').replace(/\s+/g, ' '); };
  var texts = null, hits = [], at = -1;
  var q = document.getElementById('q'), cnt = document.getElementById('cnt');
  function clear() {
    hits.forEach(function (h) { h.classList.remove('hit', 'cur'); });
    hits = []; at = -1; cnt.textContent = '';
  }
  function go(i) {
    if (!hits.length) return;
    if (at >= 0) hits[at].classList.remove('cur');
    at = (i + hits.length) % hits.length;
    var h = hits[at];
    h.classList.add('cur');
    var r = h.getBoundingClientRect();
    window.scrollTo({ top: r.top + window.scrollY - Math.max(70, (window.innerHeight - r.height) / 3), behavior: 'smooth' });
    cnt.textContent = (at + 1) + '/' + hits.length;
  }
  var findT = null;
  function find() {
    clear();
    var s = norm(q.value.trim());
    if (s.length < 2) return;
    if (!texts) texts = units.map(function (u) { return norm(u.textContent); });
    for (var i = 0; i < units.length; i++) if (texts[i].indexOf(s) >= 0) { units[i].classList.add('hit'); hits.push(units[i]); }
    if (hits.length) go(0); else cnt.textContent = '0';
  }
  q.addEventListener('input', function () { clearTimeout(findT); findT = setTimeout(find, 250); });
  q.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); q.blur(); if (hits.length) go(at + 1); else find(); } });
  document.getElementById('next').addEventListener('click', function () { go(at + 1); });
  document.getElementById('open-find').addEventListener('click', function () { bar.classList.add('searching'); q.focus(); });
  document.getElementById('close-find').addEventListener('click', function () { bar.classList.remove('searching'); q.value = ''; clear(); });

  // Вернуться туда, где остановился
  var st = load();
  if (st && st.y > 0 && !location.hash) window.scrollTo(0, st.y);
  onScroll();
})();
</script>
</body>
</html>
