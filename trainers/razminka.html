<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Разминка по чертежу</title>
<style>
*,::before,::after{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<style>
/* Same family as «Первый ход»: one column up to 660px, sticky tab strip, the figure sits on a squared
   exercise-book sheet, given values in blue ink, mistakes marked in teacher's red. */
:root{
  --bg:#f1f3f8; --surface:#ffffff; --ink:#162032; --muted:#5a6680; --line:#d5dae6; --grid:#e3e8f2;
  --accent:#2341ab; --accent-soft:#e5eafa; --on-accent:#ffffff;
  --ok:#17784a; --ok-soft:#e1f1e8; --bad:#c12b25; --bad-soft:#f9e4e3; --on-bad:#ffffff;
  --exc:#8a5000; --exc-soft:#fbeed6;
  --heat1:#d3dbf5; --heat2:#a9b8ec; --heat3:#6f86d9; --heat4:#2341ab;
  --f-ui:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-word:"Literata", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f131b; --surface:#171c27; --ink:#e5e8f0; --muted:#98a2b8; --line:#2a3142; --grid:#1f2533;
    --accent:#8fa4ff; --accent-soft:#1e2846; --on-accent:#0c111e;
    --ok:#5cc28d; --ok-soft:#14301f; --bad:#ff7b72; --bad-soft:#3b1a19; --on-bad:#2a0c0a;
    --exc:#efb25a; --exc-soft:#352710;
    --heat1:#1e2846; --heat2:#2c3d72; --heat3:#4d65b8; --heat4:#8fa4ff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f131b; --surface:#171c27; --ink:#e5e8f0; --muted:#98a2b8; --line:#2a3142; --grid:#1f2533;
  --accent:#8fa4ff; --accent-soft:#1e2846; --on-accent:#0c111e;
  --ok:#5cc28d; --ok-soft:#14301f; --bad:#ff7b72; --bad-soft:#3b1a19; --on-bad:#2a0c0a;
  --exc:#efb25a; --exc-soft:#352710;
  --heat1:#1e2846; --heat2:#2c3d72; --heat3:#4d65b8; --heat4:#8fa4ff; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-ui);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.wrap{max-width:660px;margin:0 auto;padding-inline:16px;padding-block:14px 64px}

.hd{display:flex;gap:14px;align-items:center;padding-block:4px 12px}
.hd-ico{width:50px;height:50px;flex:none;display:grid;place-items:center;border:2px solid var(--ink);border-radius:6px}
.hd-ico svg{width:40px;height:40px;display:block}
.hd-ico .tr{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.hd-ico .ml{stroke:var(--accent);stroke-width:2.4;stroke-linecap:round}
.hd-ico .gr{stroke:var(--grid);stroke-width:1}
.hd h1{margin:0;font:700 1.3rem/1.15 var(--f-ui);text-wrap:balance}
.hd p{margin:3px 0 0;color:var(--muted);font-size:.88rem}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:2px;
  overflow-x:auto;scrollbar-width:none;padding-block:6px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;border-radius:8px;padding:10px 10px;cursor:pointer;
  font-weight:600;font-size:.9rem;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.cnt{display:inline-block;min-width:1.5em;margin-left:5px;padding:2px 6px;border-radius:999px;font-size:.72rem;
  line-height:1.3;text-align:center;background:var(--bad);color:var(--on-bad);font-variant-numeric:tabular-nums}
.cnt[data-zero]{background:var(--grid);color:var(--muted)}

.lbl{font:600 .68rem/1.2 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.lead{margin:0 0 12px;color:var(--muted)}
.note{margin:0;color:var(--muted);font-size:.92rem}
.note a{color:var(--accent);font-weight:600}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 17px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{padding:8px 12px;font-size:.9rem}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:18px 16px;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px 8px;margin-bottom:14px}
.sec-h{margin:18px 0 8px;font:700 1rem/1.25 var(--f-ui)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- start ---------- */
.today{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:11px;margin-bottom:12px}
.trow2{display:flex;justify-content:space-between;gap:6px 14px;align-items:baseline;flex-wrap:wrap}
.trow2 b{font-variant-numeric:tabular-nums}
.goalbar{height:8px;background:var(--grid);border-radius:4px;overflow:hidden}
.goalbar i{display:block;height:100%;background:var(--accent)}
.goalbar i.full{background:var(--ok)}
.week{display:flex;gap:5px;flex-wrap:wrap}
.week span{width:26px;height:26px;border-radius:6px;background:var(--grid);display:grid;place-items:center;font-size:.7rem;color:var(--muted)}
.week span.on{background:var(--accent);color:var(--on-accent)}
.week span.now{box-shadow:0 0 0 1.5px var(--surface),0 0 0 3px var(--accent)}
.queue{color:var(--muted);font-size:.92rem}
.queue b{color:var(--ink);font-variant-numeric:tabular-nums}
.startbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:10px 12px;cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seglbl{color:var(--muted);font-size:.9rem}
.lenpick{display:inline-flex;gap:8px;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px 7px 9px;font-weight:600;font-size:.9rem;cursor:pointer;
  display:inline-flex;gap:7px;align-items:center;color:var(--muted)}
.chip .bx{width:16px;height:16px;border:2px solid var(--muted);border-radius:4px;display:grid;place-items:center}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--ink)}
.chip[aria-pressed="true"] .bx{background:var(--accent);border-color:var(--accent)}
.chip[aria-pressed="true"] .bx::after{content:"";width:7px;height:4px;border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:translate(0,-1px) rotate(-45deg)}
details.algo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 16px;margin-bottom:12px}
details.algo summary{cursor:pointer;padding:13px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.algo summary::-webkit-details-marker{display:none}
details.algo summary::after{content:"+";color:var(--muted);font-weight:500}
details.algo[open] summary::after{content:"−"}
details.algo ol{margin:0 0 14px;padding-left:1.3em;display:grid;gap:8px}
details.algo li b{font-weight:600}

/* ---------- card ---------- */
.bar{display:flex;justify-content:space-between;gap:12px;font-size:.88rem;color:var(--muted);margin-bottom:6px}
.bar span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:4px;background:var(--grid);border-radius:2px;overflow:hidden;margin-bottom:12px}
.track i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s ease}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kind{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.kind .tm{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.kind .hardtag{font:700 .62rem/1 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--exc);border:1.5px solid var(--exc);border-radius:4px;padding:3px 5px;margin-left:8px;vertical-align:1px}
.sheet{padding:10px 8px;border-bottom:1px solid var(--line);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;background-position:-1px -1px}
.sheet svg{display:block;margin:0 auto;max-width:100%;height:auto}
.qt{padding:14px 16px 2px;font:400 1.06rem/1.55 var(--f-word);overflow-wrap:anywhere}
.qt i,.opt i,.why i,.hintline i,.sol i,.mlist i,.fbox i,.fact i,.tapnote i{font-family:var(--f-word);font-style:italic}
sub{font-size:.72em;line-height:0}
sup{font-size:.72em;line-height:0}
.zone{padding:12px 16px 16px;display:grid;gap:10px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--line);
  background:var(--surface);border-radius:10px;padding:11px 13px;cursor:pointer;line-height:1.38;overflow-wrap:anywhere}
.opt .k{font:600 .78rem/1.75 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.opt.formula span:last-child{font-family:var(--f-word);font-size:1.04rem}
.tapnote{font-size:.95rem;color:var(--muted);border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px}
.verdict{font-weight:700;font-size:1.05rem}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)} .verdict.slow{color:var(--exc)}
.why{margin:0}
.ansrow{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.ansrow input{width:9em;max-width:100%;font:600 1.1rem/1.1 var(--f-ui);padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.ansrow input.badv{border-color:var(--bad)}
.nfb{font-weight:600}
.nfb.bad{color:var(--bad)}
.hintline{font-size:.97rem;padding:8px 12px;border-left:3px solid var(--exc);background:var(--exc-soft);border-radius:0 8px 8px 0}
.sol{font-size:.97rem;padding:9px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
.fbox{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.fbox .ft{font-weight:600}
.fbox .ff{font:600 1.02rem/1.4 var(--f-word)}
.fbox .fm{font-size:.82rem;color:var(--muted)}
.next{justify-self:start}

.done{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 16px;display:grid;gap:12px}
.done h2{margin:0;font:700 1.6rem/1.1 var(--f-ui);font-variant-numeric:tabular-nums}
.done p{margin:0;color:var(--muted)}
.cmp{font-variant-numeric:tabular-nums}
.cmp b{color:var(--ink)}
.cmp .up{color:var(--ok);font-weight:600} .cmp .down{color:var(--bad);font-weight:600}
.mlist{list-style:none;margin:0;padding:0;display:grid}
.mlist li{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.mlist li:first-child{border-top:0}
.mlist .k2{font:600 .66rem/1.2 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.mlist .s{line-height:1.4;overflow-wrap:anywhere;font-family:var(--f-word)}
.mlist .m{font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.mlist .m b{color:var(--bad);font-weight:600}
.mlist .m .gd{color:var(--ok);font-weight:600}
.mini{max-width:100%}
.mini svg{display:block;max-width:100%;height:auto}

/* ---------- theory ---------- */
.topic{border-top:1px solid var(--line)}
.topic:first-child{border-top:0}
.topic > button{display:grid;grid-template-columns:34px 1fr auto;gap:3px 10px;align-items:start;width:100%;background:none;border:0;
  padding:12px 0;text-align:left;cursor:pointer}
.topic .no{font:700 .9rem/1.5 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.topic .nm{font-weight:600;line-height:1.3;min-width:0}
.topic .nm small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.topic .pc{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.topic.soon{color:var(--muted)}
.soonlist{display:grid;grid-template-columns:34px 1fr;gap:4px 10px;font-size:.9rem;color:var(--muted);padding:8px 0}
.meter{grid-column:2/-1;height:6px;background:var(--grid);border-radius:3px;overflow:hidden;display:flex}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.low{background:var(--bad)}
.meter i.good{background:var(--ok)}
.thead{display:grid;gap:8px;margin-bottom:14px}
.thead h2{margin:0;font:700 1.15rem/1.25 var(--f-ui);text-wrap:balance}
.facts{display:grid;gap:12px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fact .fh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line)}
.fact .fh b{font-weight:700;line-height:1.3}
.fact .tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.tag{font:700 .6rem/1 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;border-radius:4px;padding:3px 5px;white-space:nowrap;border:1.5px solid currentColor}
.tag.m{color:var(--muted)} .tag.add{color:var(--accent)} .tag.hard{color:var(--exc)}
.fact .fb{padding:10px 14px 12px;display:grid;gap:6px}
.fact .ff{font:600 1.08rem/1.45 var(--f-word)}
.fact p{margin:0;font-size:.95rem}
.fact p b{font-weight:600}

/* ---------- stats ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.tile b{display:block;font:700 1.35rem/1.1 var(--f-ui);font-variant-numeric:tabular-nums}
.tile b small{font-size:.6em;color:var(--muted);font-weight:600}
.tile span{font-size:.8rem;color:var(--muted)}
.srow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .t{font-weight:600;line-height:1.3;min-width:0}
.srow .t small{display:block;font-weight:400;color:var(--muted);font-size:.84rem}
.srow .pct{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.srow .meter{grid-column:1/-1}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.chart svg{display:block;width:100%;height:auto}
.chart p{margin:6px 0 0;font-size:.86rem;color:var(--muted)}
.heatwrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:grid;gap:8px}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,30px));gap:4px}
.heat span{aspect-ratio:1;border-radius:5px;background:var(--grid)}
.heat span.h1{background:var(--heat1)} .heat span.h2{background:var(--heat2)} .heat span.h3{background:var(--heat3)} .heat span.h4{background:var(--heat4)}
.heat span.fut{background:none;border:1px dashed var(--line)}
.heat .dn{font-size:.68rem;color:var(--muted);text-align:center;aspect-ratio:auto;background:none}
.setrow{display:flex;justify-content:space-between;gap:8px 12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.sync{color:var(--muted);font-size:.86rem;margin:12px 0}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.confirm p{margin:0;width:100%;font-size:.92rem}

/* ---------- figure ---------- */
.fg text{pointer-events:none}
.fg .ln{stroke:var(--ink);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fg .cr{stroke:var(--ink);stroke-width:1.35;fill:none}
.fg .dsh{stroke:var(--muted);stroke-width:1.4;fill:none;stroke-dasharray:5 4;stroke-linecap:round}
.fg .thk{stroke:var(--accent);stroke-width:3;fill:none;stroke-linecap:round}
.fg .okseg{stroke:var(--ok);stroke-width:4.2;fill:none;stroke-linecap:round}
.fg .badseg{stroke:var(--bad);stroke-width:4.2;fill:none;stroke-linecap:round}
.fg .mk{stroke:var(--ink);stroke-width:1.2;fill:none}
.fg .dot{fill:var(--ink)}
.fg .pl{fill:var(--ink);font:italic 600 15px var(--f-word)}
.fg .vl{fill:var(--accent);font:500 13.5px var(--f-word)}
.fg .vl .it,.fg .pl .it{font-style:italic}
.fg .hitg{cursor:pointer;outline:none}
.fg .hit{stroke:transparent;stroke-width:22;stroke-linecap:round;pointer-events:stroke}
.fg .ldr{stroke:var(--accent);stroke-width:1;opacity:.7}
.fg .dim,.fg .dimx{stroke:var(--accent);stroke-width:1;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fg .dimx{opacity:.55}
.fg .dimt{paint-order:stroke;stroke:var(--surface);stroke-width:6px;stroke-linejoin:round}
.fg .hv{stroke:transparent;stroke-width:4;stroke-linecap:round}
.fg .hitg:hover .hv,.fg .hitg:focus-visible .hv{stroke:var(--accent);opacity:.5}
@media (max-width:420px){ .tiles{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>

<div class="wrap">
  <header class="hd">
    <div class="hd-ico" aria-hidden="true"><svg viewBox="0 0 50 50"><path class="tr" d="M5 42L16 10L34 10L45 42Z"/><path class="ml" d="M10.5 26L39.5 26"/></svg></div>
    <div><h1>Разминка по чертежу</h1><p id="hdSub">Планиметрия · по методичке Профиматики</p></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Разделы">
    <button role="tab" id="t-ser" data-tab="ser" aria-selected="true">Разминка</button>
    <button role="tab" id="t-th" data-tab="th" aria-selected="false">Теория</button>
    <button role="tab" id="t-errs" data-tab="errs" aria-selected="false">Ошибки<span class="cnt" id="errCnt" data-zero>0</span></button>
    <button role="tab" id="t-stats" data-tab="stats" aria-selected="false">Итоги</button>
  </nav>

  <main>
    <section id="p-ser" role="tabpanel" aria-labelledby="t-ser">
      <div id="serStart"></div>
      <div id="serRun" hidden>
        <div class="bar"><span id="sTitle"></span><span id="sProg"></span></div>
        <div class="track"><i id="sTrack"></i></div>
        <div id="sCard"></div>
      </div>
      <div class="done" id="serDone" hidden></div>
    </section>
    <section id="p-th" role="tabpanel" aria-labelledby="t-th" hidden><div id="thBody"></div></section>
    <section id="p-errs" role="tabpanel" aria-labelledby="t-errs" hidden><div id="errsBody"></div></section>
    <section id="p-stats" role="tabpanel" aria-labelledby="t-stats" hidden>
      <div id="statsBody"></div>
      <p class="sync" id="sync"></p>
      <div id="resetBox"><button class="btn small danger" id="reset">Сбросить прогресс</button></div>
    </section>
  </main>
</div>

<script>
const DATA = {"order":["6","14","22"],"topics":{"6":{"name":"Высота треугольника и трапеции","full":"Вычисление высоты треугольника и трапеции","booklet":26,"facts":[{"id":"6.1","title":"Высота через площадь","fig":{"pts":{"A":[2.686,4.453],"B":[0.0,0.0],"C":[7.0,0.0],"H":[2.686,0.0]},"seg":[["A","B"],["B","C"],["C","A"]],"dash":[["A","H"]],"ra":[["C","H","A"]],"val":[["B","C","a"],["A","H","h"]],"lp":{"H":"s"}},"f":"S = ah/2, значит h = 2S/a","why":"Площадь треугольника — половина произведения стороны на высоту к ней. У тупоугольного треугольника высота из острого угла падает на продолжение стороны — формула та же.","use":"Площадь известна или легко считается (по Герону, через синус) → любая высота: h = 2S/a.","lvl":"base","src":"m"},{"id":"6.2","title":"Высота прямоугольного треугольника к гипотенузе","fig":{"pts":{"A":[0.0,6.0],"B":[8.0,0.0],"C":[0.0,0.0],"H":[2.88,3.84]},"seg":[["A","B"],["B","C"],["C","A"],["C","H"]],"ra":[["A","C","B"],["C","H","B"]],"val":[["C","B","a"],["C","A","b"],["C","H","h"],["A","H","c_b"],["H","B","c_a"]],"lp":{"H":"ne"}},"f":"h = ab/c,  h² = c_a·c_b,  a² = c·c_a,  b² = c·c_b","why":"h = ab/c — площадь двумя способами: ½ab = ½ch. Остальные — из подобия трёх треугольников ABC, ACH и CBH.","use":"Прямой угол и высота к гипотенузе → катеты дают h = ab/c, а отрезки гипотенузы — h² = c_a·c_b.","lvl":"base","src":"m"},{"id":"6.3","title":"Высота равнобедренного треугольника к основанию","fig":{"pts":{"A":[0.0,0.0],"B":[6.0,8.0],"C":[12.0,0.0],"H":[6.0,0.0]},"seg":[["A","B"],["B","C"],["C","A"],["B","H"]],"ra":[["C","H","B"]],"tick":[["A","B",1],["B","C",1],["A","H",2],["H","C",2]],"val":[["A","B","a"],["A","H","b/2"],["H","C","b/2"],["B","H","h"]],"lp":{"H":"s"}},"f":"h = √(a² − b²/4)","why":"Высота к основанию — ещё и медиана: Пифагор в половинке треугольника: a² = h² + (b/2)².","use":"Равнобедренный треугольник → сначала высота к основанию, через неё — площадь и остальные высоты.","lvl":"base","src":"add"},{"id":"6.4","title":"Высоты обратно пропорциональны сторонам","fig":{"pts":{"A":[5.333,5.963],"B":[0.0,0.0],"C":[9.0,0.0],"H":[5.333,0.0],"K":[6.531,4.016]},"seg":[["A","B"],["B","C"],["C","A"]],"dash":[["A","H"],["B","K"]],"ra":[["C","H","A"],["C","K","B"]],"val":[["B","C","a"],["C","A","b"],["A","H","h_a"],["B","K","h_b"]],"lp":{"H":"s"}},"f":"a·h_a = b·h_b = c·h_c = 2S;  h_b = a·h_a/b","why":"Площадь одна, а считать её можно через любую сторону. Отсюда: к самой короткой стороне — самая длинная высота.","use":"Дана одна высота, нужна другая; нужна наибольшая или наименьшая высота.","lvl":"base","src":"add"},{"id":"6.5","title":"Высота по трём сторонам","fig":{"pts":{"A":[6.0,8.0],"B":[0.0,0.0],"C":[21.0,0.0],"H":[6.0,0.0]},"seg":[["A","B"],["B","C"],["C","A"]],"dash":[["A","H"]],"ra":[["C","H","A"]],"val":[["B","C","21"],["C","A","17"],["A","B","10"]],"lp":{"H":"s"}},"f":"S = √(p(p − a)(p − b)(p − c)),  h = 2S/a","why":"Сначала площадь по Герону, потом h = 2S/a. Высота из вершины наибольшего угла падает на наибольшую сторону и лежит внутри треугольника.","use":"Даны три стороны → Герон. Тройки, которые полезно помнить: 13, 14, 15 (S = 84); 10, 17, 21 (S = 84); 7, 15, 20 (S = 42).","lvl":"hard","src":"add"},{"id":"6.6","title":"Высота через сторону и угол","fig":{"pts":{"A":[4.2,4.2],"B":[9.0,0.0],"C":[0.0,0.0],"H":[4.2,0.0]},"seg":[["A","B"],["B","C"],["C","A"]],"dash":[["A","H"]],"ra":[["B","H","A"]],"ang":[["B","C","A",1]],"val":[["C","A","b"],["A","H","h"]],"lp":{"H":"s"}},"f":"h = b·sin C","why":"Высота AH — катет прямоугольного треугольника AHC с гипотенузой b против угла C.","use":"Известны сторона и прилежащий к ней угол.","lvl":"base","src":"add"},{"id":"6.7","title":"Высота равнобедренной трапеции","fig":{"pts":{"A":[0.0,0.0],"B":[3.0,4.0],"C":[7.0,4.0],"D":[10.0,0.0],"H":[7.0,0.0]},"seg":[["A","B"],["B","C"],["C","D"],["D","A"],["C","H"]],"ra":[["D","H","C"]],"tick":[["A","B",1],["C","D",1]],"val":[["B","C","a"],["C","D","c"],["H","D","(b − a)/2"],["C","H","h"]],"lp":{"H":"s"}},"f":"h 7","title":"Средняя линия делит пополам любой отрезок между основаниями","fig":{"pts":{"A":[0.0,0.0],"B":[2.4,4.6],"C":[6.4,4.6],"D":[10.0,0.0],"M":[1.2,2.3],"N":[8.2,2.3],"H":[2.4,0.0],"Q":[2.4,2.3]},"seg":[["A","B"],["B","C"],["C","D"],["D","A"],["M","N"]],"dash":[["B","H"]],"ra":[["A","H","B"]],"tick":[["B","Q",1],["Q","H",1]],"lp":{"H":"s","Q":"ne"}},"f":"BQ = QH, расстояние от MN до каждого основания — h/2","why":"Параллельные прямые AD, MN, BC отсекают на AB равные отрезки, значит (по теореме Фалеса) и на любом другом отрезке между основаниями.","use":"Нужна высота треугольника, отсечённого средней линией, → половина высоты трапеции.","lvl":"base","src":"add"},{"id":"22.8","title":"Равнобедренная трапеция с перпендикулярными диагоналями","fig":{"pts":{"A":[0.0,0.0],"B":[3.0,7.0],"C":[7.0,7.0],"D":[10.0,0.0],"O":[5.0,5.0]},"seg":[["A","B"],["B","C"],["C","D"],["D","A"],["A","C"],["B","D"]],"ra":[["C","O","D"]],"tick":[["A","B",1],["C","D",1]],"val":[["B","C","a"],["A","D","b"]],"lp":{"O":"e"}},"f":"h = (a + b)/2, S = h²","why":"△BOC и △AOD — равнобедренные прямоугольные (углы при основаниях по 45°). Высота такого треугольника равна половине гипотенузы: h = a/2 + b/2.","use":"Задача 5 из методички: диагонали равнобедренной трапеции перпендикулярны → высота равна средней линии.","lvl":"hard","src":"add"},{"id":"22.9","title":"Отрезок через точку пересечения диагоналей","fig":{"pts":{"A":[0.0,0.0],"B":[2.0,5.0],"C":[5.0,5.0],"D":[9.0,0.0],"O":[3.75,3.75],"P":[1.5,3.75],"Q":[6.0,3.75]},"seg":[["A","B"],["B","C"],["C","D"],["D","A"],["A","C"],["B","D"]],"thick":[["P","Q"]],"tick":[["P","O",1],["O","Q",1]],"val":[["B","C","a"],["A","D","b"]],"lp":{"O":"n"}},"f":"PQ = 2ab/(a + b), PO = OQ = ab/(a + b)","why":"△BOC ~ △DOA с k = a/b, поэтому AO : AC = b : (a + b). Из △APO ~ △ABC: PO = a·b/(a + b). Так же OQ = ab/(a + b).","use":"Прямая через точку пересечения диагоналей параллельно основаниям.","lvl":"hard","src":"add"},{"id":"22.10","title":"Отрезки, делящие трапецию на подобные и на равновеликие части","fig":{"pts":{"A":[0.0,0.0],"B":[2.0,6.0],"C":[6.0,6.0],"D":[9.0,0.0],"X":[1.2,3.6],"Y":[7.2,3.6]},"seg":[["A","B"],["B","C"],["C","D"],["D","A"]],"thick":[["X","Y"]],"val":[["B","C","a"],["A","D","b"],["X","Y","√(ab)"]]},"f":"на две подобные: √(ab); на две равновеликие: √((a² + b²)/2)","why":"Подобные трапеции: a/x = x/b, отсюда x² = ab. Равновеликие: продли боковые стороны — площади треугольников с основаниями a, x, b относятся как a² : x² : b², и x² − a² = b² − x².","use":"Отрезок параллелен основаниям и задано условие на подобие или площади.","lvl":"hard","src":"add"},{"id":"22.11","title":"Замечательное свойство трапеции","fig":{"pts":{"A":[0.0,0.0],"B":[2.3,5.0],"C":[6.3,5.0],"D":[10.0,0.0],"E":[3.833,8.333],"O":[4.5,3.571],"X":[4.3,5.0],"Y":[5.0,0.0]},"seg":[["A","B"],["B","C"],["C","D"],["D","A"],["A","C"],["B","D"]],"dash":[["B","E"],["C","E"],["E","Y"]],"tick":[["B","X",1],["X","C",1],["A","Y",2],["Y","D",2]],"lp":{"O":"e","Y":"s","X":"ne"}},"f":"E, середина BC, O и середина AD лежат на одной прямой","why":"Гомотетия с центром E переводит BC в AD и середину BC — в середину AD. То же делает гомотетия с центром O.","use":"№18: доказать, что точки на одной прямой, или найти отношение отрезков на этой прямой.","lvl":"hard","src":"add"}],"skills":[{"id":"n22-ah2","kind":"num","facts":["22.2","22.3"],"lvl":"base","t":45,"v":[{"q":"В равнобедренной трапеции ABCD основание BC равно 4. BH — высота трапеции, причём HD = 10. Найдите AH.","fig":{"pts":{"A":[0.0,0.0],"B":[6.0,6.72],"C":[10.0,6.72],"D":[16.0,0.0],"H":[6.0,0.0]},"seg":[["A","B"],["B","C"],["C","D"],["D","A"],["B","H"]],"thick":[["A","H"]],"ra":[["A","H","B"]],"tick":[["A","B",1],["C","D",1]],"val":[["B","C","4"],["H","D","10"],["A","H","?"]],"lp":{"H":"s"}},"ans":6.0,"hint":"HD — проекция диагонали, она равна средней линии: HD = (a + b)/2. Найди AD, потом AH = (b − a)/2.","sol":"HD = (a + b)/2 = 10, значит AD = 20 − 4 = 16. AH = (16 − 4)/2 = 6. Короче: AH = HD − BC."," /* ================= spaced repetition, per skill ================= */
const st = id => S.sk[id] || [0, 0, 0, 0, 0, -1]; // [box, due, seen, clean, last, lastVariant]

function pruneDays(){ const keys = Object.keys(S.days).sort(); while (keys.length > 120) delete S.days[keys.shift()]; }
function bumpDay(clean, sec){
  const k = dayKey(Date.now()), d = S.days[k] || (S.days[k] = [0, 0, 0]);
  d[0]++; if (clean) d[1]++; d[2] += sec; S.tot.sec += sec; pruneDays();

/* res: {ok, help, sec, retry, vi, chosen}. Clean = right, no hint, first try. Fast = within the skill's time. */
function record(sk, res){
  const now = Date.now();
  let [box, , seen, okc] = st(sk.id);
  const first = seen === 0, clean = res.ok && !res.help && !res.retry, fast = res.sec <= sk.t;
  seen++; if (clean) okc++;
  if (clean && fast) box = first ? 2 : Math.min(box + 1, 5);
  else if (clean) box = Math.max(1, Math.min(box, 2));
  else if (res.ok) box = 1;
  else box = 0;
  S.sk[sk.id] = [box, now + INTERVALS[box], seen, okc, now, res.vi];
  const e = S.errs[sk.id];
  if (!res.ok) S.errs[sk.id] = [(e ? e[0] : 0) + 1, 0, res.vi, now, res.chosen === undefined ? null : res.chosen];
  else if (e && !res.retry) { if (clean) { e[1]++; if (e[1] >= 2) delete S.errs[sk.id]; } else e[1] = 0; }
  if (!res.retry) {
    S.tot.ans++; if (clean) S.tot.ok++; if (clean && !fast) S.tot.slow++; if (res.ok && res.help) S.tot.help++;
    const a = S.top[sk.t0] || (S.top[sk.t0] = [0, 0]); a[0]++; if (clean) a[1]++;
    const k = S.kind[sk.kind] || (S.kind[sk.kind] = [0, 0]); k[0]++; if (clean) k[1]++;

const auto = id => st(id)[0] >= 3;
/* new cards: about half are number tasks (the warm-up itself), the rest — formulas, reasons, taps */
const SHARE = { num: 0.5, eq: 0.2, why: 0.15, tap: 0.15 };
function pickFresh(fresh, n){
  const pool = shuffle(fresh.slice()), out = [], usedT = {}, usedK = {};
  const baseSeen = t => { const b = skillsOf(t).filter(s => s.lvl === 'base'); return b.length ? b.filter(s => st(s.id)[2] > 0).length / b.length : 1; };
  while (out.length < n && pool.length) {
    let bi = 0, bs = Infinity;
    pool.forEach((s, j) => {
      const sc = (usedT[s.t0] || 0) * 2 + (usedK[s.kind] || 0) / SHARE[s.kind] * 0.5 + (s.lvl === 'hard' ? (baseSeen(s.t0) < 0.5 ? 2.5 : 1) : 0) + Math.random() * 1.5;
      if (sc < bs) { bs = sc; bi = j; }
    });
    const s = pool.splice(bi, 1)[0]; out.push(s); usedT[s.t0] = (usedT[s.t0] || 0) + 1; usedK[s.kind] = (usedK[s.kind] || 0) + 1;
  }

}
function interleave(list){
  const rest = list.slice(), out = [];
  while (rest.length) {
    const a = out[out.length - 1], b = out[out.length - 2];
    let bi = 0, bs = Infinity;
    rest.forEach((s, j) => {
      let sc = Math.random() * 0.6;
      if (a && a.t0 === s.t0) sc += 1.5;
      if (a && a.kind === s.kind) sc += 1;
      if (a && b && a.kind === s.kind && b.kind === s.kind) sc += 3;
      if (sc < bs) { bs = sc; bi = j; }
    });
    out.push(rest.splice(bi, 1)[0]);
  }
  return out;
}
function buildSession(len, opt){
  const now = Date.now();
  let pool;
  if (opt.errs) pool = Object.keys(S.errs).map(id => SK[id]).filter(Boolean);
  else if (opt.topic) pool = skillsOf(opt.topic).slice();
  else pool = activeTopics().flatMap(skillsOf);
  if (opt.errs || opt.topic) {
    const pr = s => S.errs[s.id] ? 0 : st(s.id)[2] > 0 && st(s.id)[1] <= now ? 1 : st(s.id)[2] === 0 ? 2 : 3;
    const sorted = shuffle(pool.slice()).sort((x, y) => pr(x) - pr(y) || st(x.id)[0] - st(y.id)[0] || (x.lvl === 'hard') - (y.lvl === 'hard'));
    return interleave(sorted.slice(0, len));

  const seen = pool.filter(s => st(s.id)[2] > 0), fresh = pool.filter(s => st(s.id)[2] === 0);
  const due = seen.filter(s => st(s.id)[1] <= now).sort((x, y) => st(x.id)[0] - st(y.id)[0] || st(x.id)[1] - st(y.id)[1]);

    const later = seen.filter(s => !out.includes(s)).sort((x, y) => st(x.id)[1] - st(y.id)[1]);
    for (const s of later) { if (out.length >= len) break; out.push(s); }
  }

}

    auto: pool.filter(s => auto(s.id)).length, total: pool.length };
}
function pickVariant(sk, avoid){

}

function streak(){

  if (!on(0)) k = -1;

/* ================= one card ================= */
const C = { s: null, v: null, vi: 0, phase: '', order: [], chosen: null, ok: null, help: false, idk: false, retry: false, tries: 0, hint: false, wrongIn: '', sec: 0, recorded: false, tapped: null };

function renderCard(){

function drawCard(){

  }

    `<span class="tm">${done ? `ответ за ${fmtSec(C.sec)} с` : `цель — до ${s.t} с`}</span></div>` +
    `<div class="sheet" id="sheet">${renderFig(figObj, figOpt)}</div>` +
    `<div class="qt">${fmt(v.q)}</div><div class="zone" id="zone">${zoneHTML()}</div></div>`;
}
/* figure width that fits the container 1:1 (phone ≈ 340 px, desktop up to 460 px) */
const figW = el => Math.max(260, Math.min(460, ((el && el.clientWidth) || 358) - 20));
const fmtSec = x => x < 10 ? String(Math.round(x * 10) / 10).replace('.', ',') : String(Math.round(x));
const nextBtn = () => `<button class="btn primary next" data-act="next">${SE.i + 1 >= SE.list.length ? 'Итог разминки' : 'Дальше'}</button>`;
function factBox(){
  return C.s.facts.map(fid => {
    const f = FACT[fid];
    return `<div class="fbox"><span class="ft">${fmt(f.title)}</span><span class="ff">${fmt(f.f)}</span>` +
      `<span class="fm">${tName(f.topic)} · ${f.src === 'm' ? 'есть в методичке' : f.src === 'add' ? 'дополнение к методичке' : 'теория'}</span></div>`;
  }).join('');
}
function verdictHTML(){
  if (C.ok && !C.help && C.sec > C.s.t) return `<div class="verdict slow">Правильно, но долго: ${fmtSec(C.sec)} с при цели ${C.s.t} с</div>`;
  if (C.ok && C.help) return `<div class="verdict slow">Правильно, ${C.hint ? 'с подсказкой' : 'не с первой попытки'}</div>`;
  if (C.ok) return `<div class="verdict ok">Правильно</div>`;
  return `<div class="verdict bad">${C.idk ? 'Запомни ответ' : 'Ошибка'}</div>`;
}
function afterHTML(){
  const v = C.v;

    else h += `<div class="sol">${fmt(v.sol)}</div>`;
  } else if (v.why) h += `<p class="why">${fmt(v.why)}</p>`;
  return h + factBox() + nextBtn();
}
const idkBtn = () => `<button class="linkbtn" data-act="idk">Не знаю</button>`;
function zoneHTML(){
  const s = C.s, v = C.v, done = C.phase === 'done';
  if (s.kind === 'num') {
    if (done) return afterHTML();
    let h = `<div class="ansrow"><input id="ansIn" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="ответ" aria-label="Ответ">` +
      `<button class="btn primary" data-act="check">Проверить</button></div><div class="nfb bad" id="nfb" hidden></div>`;
    if (C.hint) h += `<div class="hintline"><b>Подсказка.</b> ${fmt(v.hint)}</div>`;
    return h + `<div class="actions">${C.hint ? '' : '<button class="btn small" data-act="hint">Подсказка</button>'}${idkBtn()}</div>`;
  }
  if (s.kind === 'tap') {

  }

    return `<button class="${cls}" data-oi="${oi}"${done ? ' disabled' : ''}><span class="k">${j + 1}</span><span>${fmt(v.opts[oi])}</span></button>`;
  }).join('') + `</div>`;
  return done ? h + afterHTML() : h + `<div class="actions">${idkBtn()}</div>`;
}
function answer(res){
  if (C.phase === 'done' || !C.s) return;
  const s = C.s, sec = clockStop();
  C.ok = res.ok; C.help = !!res.help; C.sec = sec; C.phase = 'done';
  record(s, { ok: res.ok, help: res.help, sec, retry: C.retry, vi: C.vi, chosen: res.chosen });
  C.recorded = true;
  SE.res.push({ id: s.id, vi: C.vi, ok: res.ok, clean: res.ok && !res.help, fast: sec <= s.t, sec, retry: C.retry });
  if (!res.ok && !C.retry && !SE.retried.has(s.id)) {

function chooseOpt(oi){ if (C.phase !== 'ask' || oi === undefined || !(C.s.kind === 'eq' || C.s.kind === 'why')) return; C.chosen = oi; answer({ ok: oi === 0, chosen: oi }); }
function tapSeg(a, b){

function checkNum(){

function dontKnow(){ if (!C.s || C.phase === 'done') return; C.idk = true; C.chosen = null; answer({ ok: false, chosen: 'idk' }); }
$('sCard').addEventListener('click', e => {

  else if (act === 'next') nextCard();
});
$('sCard').addEventListener('keydown', e => {

  const g = e.target.closest && e.target.closest('[data-seg]');

function nextCard(){

document.addEventListener('keydown', e => {

    `<div class="box"><ul class="mlist">${ids.map(id => {
      const s = SK[id], e = S.errs[id], v = s.v[Math.min(e[2] || 0, s.v.length - 1)];
      const ya = e[4] === 'idk' ? 'не знаю' : s.kind === 'num' ? '' : s.kind === 'tap' ? (e[4] ? fmt(String(e[4])) : '') : (Number.isInteger(e[4]) && v.opts[e[4]] !== undefined ? fmt(v.opts[e[4]]) : '');
      return `<li><span class="k2">${KIND[s.kind]} · ${tName(s.t0)} · ошибок: ${e[0]}${e[1] ? ` · правильно подряд: ${e[1]} из 2` : ''}</span>` +
        `<div class="mini">${renderFig(v.figA || v.fig, { maxw: figW($('errsBody')), maxh: 260, label: 'Чертёж' })}</div>` +
        `<span class="s">${fmt(v.q)}</span>` + (ya ? `<span class="m"><b>Ты ответил:</b> ${ya}</span>` : '') +
        `<span class="m"><span class="gd">Правильно:</span> ${fmt(answerText(s, v))}</span>` +
        `<span class="m">${s.facts.map(fid => fmt(FACT[fid].f)).join(' · ')}</span></li>`;
    }).join('')}</ul></div>`;
}
$('errsBody').addEventListener('click', e => { if (e.target.closest('#errTrain')) startSession({ errs: true }, 'Работа над ошибками'); });

/* ================= stats ================= */
function renderStats(){
  const all = ORDER.flatMap(skillsOf), tot = S.tot, acc = tot.ans ? Math.round(tot.ok / tot.ans * 100) : null, mins = Math.round(tot.sec / 60);
  const au = all.filter(s => auto(s.id)).length, seenN = all.filter(s => st(s.id)[2] > 0).length;
  let h = `<div class="tiles">` +
    `<div class="tile"><b>${tot.ans}</b><span>${plural(tot.ans, 'ответ', 'ответа', 'ответов')}</span></div>` +
    `<div class="tile"><b>${acc === null ? '—' : acc + '%'}</b><span>правильно с первого раза</span></div>` +
    `<div class="tile"><b>${au}<small>/${all.length}</small></b><span>карточек на автомате</span></div>` +
    `<div class="tile"><b>${seenN}<small>/${all.length}</small></b><span>карточек встречалось</span></div>` +
    `<div class="tile"><b>${mins}</b><span>${plural(mins, 'минута', 'минуты', 'минут')} разминки</span></div>` +
    `<div class="tile"><b>${streak()}<small> / ${bestStreak()}</small></b><span>серия дней / лучшая</span></div></div>`;
  const ss = S.sess.filter(x => x[3] != null).slice(-15);
  h += `<h3 class="sec-h">Время на карточку</h3><div class="chart">`;
  if (ss.length >= 2) {
    const vals = ss.map(x => x[3]), mx = Math.max(...vals, 1) * 1.15, Wc = 320, Hc = 110, pl = 30, pr = 8, pt = 10, pb = 18;
    const xp = i => pl + (Wc - pl - pr) * (i / (ss.length - 1)), yp = v => pt + (Hc - pt - pb) * (1 - v / mx);
    const pts = vals.map((v, i) => `${xp(i).toFixed(1)},${yp(v).toFixed(1)}`).join(' ');
    const tickV = [...new Set([0, Math.round(mx / 2), Math.round(mx)])];
    h += `<svg viewBox="0 0 ${Wc} ${Hc}" role="img" aria-label="Среднее время на карточку по последним разминкам">` +
      tickV.map(v => `<line x1="${pl}" x2="${Wc - pr}" y1="${yp(v).toFixed(1)}" y2="${yp(v).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>` +
        `<text x="${pl - 6}" y="${yp(v).toFixed(1)}" text-anchor="end" dominant-baseline="central" font-size="10" fill="var(--muted)">${v} с</text>`).join('') +
      `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` +
      vals.map((v, i) => `<circle cx="${xp(i).toFixed(1)}" cy="${yp(v).toFixed(1)}" r="2.6" fill="var(--accent)"/>`).join('') +
      `<text x="${xp(vals.length - 1).toFixed(1)}" y="${(yp(vals[vals.length - 1]) - 9).toFixed(1)}" text-anchor="end" font-size="11" font-weight="600" fill="var(--ink)">${fmtSec(vals[vals.length - 1])} с</text>` +
      `<text x="${pl}" y="${Hc - 3}" font-size="10" fill="var(--muted)">раньше</text><text x="${Wc - pr}" y="${Hc - 3}" text-anchor="end" font-size="10" fill="var(--muted)">последняя</text></svg>` +
      `<p>Среднее время на карточку в каждой разминке. Чем ниже линия, тем быстрее ты видишь, что делать.</p>`;
  } else h += `<p>График появится после двух разминок.</p>`;
  h += `</div>`;
  const start = dayShift(-((new Date().getDay() + 6) % 7) - 28);
  let cells = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].map(d => `<span class="dn">${d}</span>`).join('');
  const todayKey = dayKey(Date.now());
  for (let k = 0; k < 35; k++) {
    const d = new Date(start); d.setDate(start.getDate() + k);
    const key = dayKey(d.getTime()), r = S.days[key], n = r ? r[0] : 0, fut = key > todayKey;
    const lv = fut ? 'fut' : n === 0 ? '' : n < ACTIVE_DAY ? 'h1' : n < S.set.goal ? 'h2' : n < S.set.goal * 2 ? 'h3' : 'h4';
    cells += `<span class="${lv}" title="${key}: ${n}"></span>`;
  }
  h += `<h3 class="sec-h">Активность за 5 недель</h3><div class="heatwrap"><div class="heat">${cells}</div><p class="note">Чем темнее клетка, тем больше карточек в этот день. День засчитывается в серию с ${ACTIVE_DAY} ответов.</p></div>`;
  h += `<h3 class="sec-h">По темам</h3><div class="box">${ORDER.map(t => { const v = S.top[t] || [0, 0], p = v[0] ? Math.round(v[1] / v[0] * 100) : null, m = Math.round(mastery(t) * 100);
    return `<div class="srow"><span class="t">${t}. ${esc(TOPICS[t].name)}<small>${v[0]} ${plural(v[0], 'ответ', 'ответа', 'ответов')} · правильно ${p === null ? '—' : p + '%'} · освоено ${m}%</small></span>` +
      `<span class="pct"><button class="btn small" data-ttrain="${t}">Разминка</button></span><span class="meter"><i class="${m >= 67 ? 'good' : ''}" style="width:${m}%"></i></span></div>`; }).join('')}</div>`;
  h += `<h3 class="sec-h">По видам карточек</h3><div class="box">${KSTAT.map(([k, name]) => { const v = S.kind[k] || [0, 0], p = v[0] ? Math.round(v[1] / v[0] * 100) : null;
    return `<div class="srow"><span class="t">${name}<small>${v[0]} ${plural(v[0], 'ответ', 'ответа', 'ответов')}</small></span><span class="pct">${p === null ? '—' : p + '%'}</span>` +
      `<span class="meter"><i class="${p !== null && p < 60 ? 'low' : ''}" style="width:${p || 0}%"></i></span></div>`; }).join('')}` +
    `<div class="srow"><span class="t">Верно, но дольше цели<small>такие карточки возвращаются раньше</small></span><span class="pct">${tot.slow}</span></div></div>`;
  h += `<h3 class="sec-h">Настройки</h3><div class="box">` +
    `<div class="setrow"><span>Цель на день</span><span class="seg" role="group" aria-label="Цель на день">${GOALS.map(n => `<button data-goal="${n}" aria-pressed="${S.set.goal === n}">${n}</button>`).join('')}</span></div>` +
    `<div class="setrow"><span>В тренажёре</span><span class="note">${ORDER.length} ${plural(ORDER.length, 'тема', 'темы', 'тем')} · ${all.length} карточек · ${all.reduce((a, s) => a + s.v.length, 0)} вариантов с разными числами</span></div></div>` +
    `<p class="note">Задачи на выбор хода — в файле «Планиметрия_Первый_ход_офлайн». Нашёл ошибку в карточке — напиши Claude.</p>`;
  $('statsBody').innerHTML = h;
  setSync();
}
$('statsBody').addEventListener('click', e => {
  const g = e.target.closest('[data-goal]'); if (g) { S.set.goal = +g.dataset.goal; commit(); renderStats(); return; }
  const tr = e.target.closest('[data-ttrain]'); if (tr) { const t = tr.dataset.ttrain; startSession({ topic: t }, `Тема ${t}`); }
});
$('resetBox').addEventListener('click', e => {
  if (e.target.closest('#reset')) {
    $('resetBox').innerHTML = `<div class="confirm"><p>Удалить всю статистику, повторения и список ошибок?</p>` +
      `<button class="btn small danger" id="resetYes">Да, сбросить</button><button class="btn small" id="resetNo">Отмена</button></div>`;
  } else if (e.target.closest('#resetYes')) { const keep = S.set; S = blank(); S.set = keep; commit(); renderStats(); restoreReset(); }
  else if (e.target.closest('#resetNo')) restoreReset();
});
function restoreReset(){ $('resetBox').innerHTML = '<button class="btn small danger" id="reset">Сбросить прогресс</button>'; }

/* ================= boot ================= */
renderHeader(); renderBadges(); setSync(); renderStart();
try { const t = localStorage.getItem(LS_KEY + '-tab'); if (t && t !== 'ser' && TABS.includes(t)) showTab(t); } catch (e) {}
initCloud();
</script>

</body>
</html>
