<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Тренажёр первого хода</title>
<style>
/* Same family as the orthography trainers: one column up to 660px, sticky tab strip,
   the figure sits on a squared exercise-book sheet, given values are written in blue ink,
   mistakes are corrected in teacher's red. */
:root{
  --bg:#f1f3f8; --surface:#ffffff; --ink:#162032; --muted:#5a6680; --line:#d5dae6; --grid:#e3e8f2;
  --accent:#2341ab; --accent-soft:#e5eafa; --on-accent:#ffffff;
  --ok:#17784a; --ok-soft:#e1f1e8; --bad:#c12b25; --bad-soft:#f9e4e3; --on-bad:#ffffff;
  --exc:#8a5000; --exc-soft:#fbeed6;
  --heat1:#d3dbf5; --heat2:#a9b8ec; --heat3:#6f86d9; --heat4:#2341ab;
  --f-ui:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-word:"Literata", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f131b; --surface:#171c27; --ink:#e5e8f0; --muted:#98a2b8; --line:#2a3142; --grid:#1f2533;
    --accent:#8fa4ff; --accent-soft:#1e2846; --on-accent:#0c111e;
    --ok:#5cc28d; --ok-soft:#14301f; --bad:#ff7b72; --bad-soft:#3b1a19; --on-bad:#2a0c0a;
    --exc:#efb25a; --exc-soft:#352710;
    --heat1:#1e2846; --heat2:#2c3d72; --heat3:#4d65b8; --heat4:#8fa4ff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f131b; --surface:#171c27; --ink:#e5e8f0; --muted:#98a2b8; --line:#2a3142; --grid:#1f2533;
  --accent:#8fa4ff; --accent-soft:#1e2846; --on-accent:#0c111e;
  --ok:#5cc28d; --ok-soft:#14301f; --bad:#ff7b72; --bad-soft:#3b1a19; --on-bad:#2a0c0a;
  --exc:#efb25a; --exc-soft:#352710;
  --heat1:#1e2846; --heat2:#2c3d72; --heat3:#4d65b8; --heat4:#8fa4ff; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-ui);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.wrap{max-width:660px;margin:0 auto;padding-inline:16px;padding-block:14px 64px}

.hd{display:flex;gap:14px;align-items:center;padding-block:4px 12px}
.hd-num{width:50px;height:50px;flex:none;display:grid;place-items:center;border:2px solid var(--ink);
  border-radius:6px;font:700 1.7rem/1 var(--f-ui);font-variant-numeric:tabular-nums}
.hd h1{margin:0;font:700 1.3rem/1.15 var(--f-ui);text-wrap:balance}
.hd p{margin:3px 0 0;color:var(--muted);font-size:.88rem}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:2px;
  overflow-x:auto;scrollbar-width:none;padding-block:6px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;border-radius:8px;padding:10px 9px;cursor:pointer;
  font-weight:600;font-size:.9rem;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.cnt{display:inline-block;min-width:1.5em;margin-left:5px;padding:2px 6px;border-radius:999px;font-size:.72rem;
  line-height:1.3;text-align:center;background:var(--bad);color:var(--on-bad);font-variant-numeric:tabular-nums}
.cnt[data-zero]{background:var(--grid);color:var(--muted)}

.lbl{font:600 .68rem/1.2 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.lead{margin:0 0 12px;color:var(--muted)}
.note{margin:0;color:var(--muted);font-size:.92rem}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 17px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{padding:8px 12px;font-size:.9rem}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:18px 16px;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px 8px;margin-bottom:14px}
.sec-h{margin:18px 0 8px;font:700 1rem/1.25 var(--f-ui)}

/* ---------- start screen ---------- */
.today{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:11px;margin-bottom:12px}
.trow2{display:flex;justify-content:space-between;gap:6px 14px;align-items:baseline;flex-wrap:wrap}
.trow2 b{font-variant-numeric:tabular-nums}
.goalbar{height:8px;background:var(--grid);border-radius:4px;overflow:hidden}
.goalbar i{display:block;height:100%;background:var(--accent)}
.goalbar i.full{background:var(--ok)}
.week{display:flex;gap:5px;flex-wrap:wrap}
.week span{width:26px;height:26px;border-radius:6px;background:var(--grid);display:grid;place-items:center;font-size:.7rem;color:var(--muted)}
.week span.on{background:var(--accent);color:var(--on-accent)}
.week span.now{box-shadow:0 0 0 1.5px var(--surface),0 0 0 3px var(--accent)}
.queue{color:var(--muted);font-size:.92rem}
.queue b{color:var(--ink);font-variant-numeric:tabular-nums}
.startbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:10px 12px;cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seglbl{color:var(--muted);font-size:.9rem}
.lenpick{display:inline-flex;gap:8px;align-items:center}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
details.algo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 16px;margin-top:4px}
details.algo summary{cursor:pointer;padding:13px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.algo summary::-webkit-details-marker{display:none}
details.algo summary::after{content:"+";color:var(--muted);font-weight:500}
details.algo[open] summary::after{content:"−"}
details.algo ol{margin:0 0 14px;padding-left:1.3em;display:grid;gap:8px}
details.algo li{padding-left:2px}
details.algo li b{font-weight:600}

/* ---------- task card ---------- */
.bar{display:flex;justify-content:space-between;gap:12px;font-size:.88rem;color:var(--muted);margin-bottom:6px}
.bar span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:4px;background:var(--grid);border-radius:2px;overflow:hidden;margin-bottom:12px}
.track i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s ease}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kind{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.kind .src{font:600 .68rem/1.2 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--exc)}
.sheet{padding:12px 8px;border-bottom:1px solid var(--line);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;background-position:-1px -1px}
.sheet svg{display:block;margin:0 auto;max-width:100%;height:auto}
.qt{padding:14px 16px 2px;font:400 1.07rem/1.55 var(--f-word);overflow-wrap:anywhere}
.qt .dano{font:600 .68rem/1.2 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.qt i,.opt i,.stm i,.why i,.trig i,.hintline i,.sol i,.mlist i,.nudge i,.rsq i,.srow i{font-family:var(--f-word);font-style:italic}
sub{font-size:.72em;line-height:0}
.zone{padding:12px 16px 16px;display:grid;gap:10px}
.thinkbox{border:1.5px dashed var(--line);border-radius:10px;padding:11px 13px;color:var(--muted);font-size:.95rem}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--line);
  background:var(--surface);border-radius:10px;padding:11px 13px;cursor:pointer;line-height:1.38;overflow-wrap:anywhere}
.opt .k{font:600 .78rem/1.75 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.nudge{background:var(--exc-soft);border-radius:8px;padding:10px 12px;font-size:.95rem}
.nudge b{color:var(--exc)}
.verdict{font-weight:700;font-size:1.05rem}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.why{margin:0}
.trig{border:1.5px solid var(--accent);border-radius:10px;padding:10px 12px;display:grid;gap:5px}
.trig p{margin:0}
.trig .ttl{font:600 .68rem/1.2 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.tchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.tchip{font-size:.76rem;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:600;line-height:1.35}
.num{border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:9px}
.ansrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ansrow input{width:9em;max-width:100%;font:600 1.1rem/1.1 var(--f-ui);padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.ansrow input.okv{border-color:var(--ok)} .ansrow input.badv{border-color:var(--bad)}
.nfb{font-weight:600}
.nfb.ok{color:var(--ok)} .nfb.bad{color:var(--bad)}
.hintline{font-size:.95rem;padding:8px 12px;border-left:3px solid var(--exc);background:var(--exc-soft);border-radius:0 8px 8px 0}
.sol{font-size:.97rem;padding:9px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
.next{justify-self:start}
.stms{display:grid;gap:8px}
.stm{display:grid;grid-template-columns:22px 1fr;gap:4px 10px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--line);
  background:var(--surface);border-radius:10px;padding:11px 13px;cursor:pointer;line-height:1.38;overflow-wrap:anywhere}
.stm .bx{width:20px;height:20px;border:2px solid var(--muted);border-radius:5px;display:grid;place-items:center;margin-top:1px}
.stm[aria-pressed="true"] .bx{background:var(--accent);border-color:var(--accent)}
.stm[aria-pressed="true"] .bx::after{content:"";width:9px;height:5px;border-left:2.5px solid var(--on-accent);border-bottom:2.5px solid var(--on-accent);transform:translate(0,-1px) rotate(-45deg)}
.stm:disabled{cursor:default}
.stm.good{border-color:var(--ok)}
.stm.badm{border-color:var(--bad);background:var(--bad-soft)}
.stm .tg{grid-column:2;font:700 .66rem/1.2 var(--f-ui);letter-spacing:.07em;text-transform:uppercase}
.stm.good .tg{color:var(--ok)} .stm.badm .tg{color:var(--bad)}
.stm .w{grid-column:2;font-size:.9rem;color:var(--muted)}

.done{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 16px;display:grid;gap:12px}
.done h2{margin:0;font:700 1.6rem/1.1 var(--f-ui);font-variant-numeric:tabular-nums}
.done p{margin:0;color:var(--muted)}
.cmp{font-variant-numeric:tabular-nums}
.cmp b{color:var(--ink)}
.cmp .up{color:var(--ok);font-weight:600} .cmp .down{color:var(--bad);font-weight:600}
.mlist{list-style:none;margin:0;padding:0;display:grid}
.mlist li{display:grid;gap:3px;padding:10px 0;border-top:1px solid var(--line)}
.mlist li:first-child{border-top:0}
.mlist .k2{font:600 .66rem/1.2 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.mlist .s{font-weight:600;line-height:1.3}
.mlist .t{font-size:.92rem}
.mlist .m{font-size:.86rem;color:var(--muted)}
.mlist .m b{color:var(--bad);font-weight:600}
.mlist .m .gd{color:var(--ok);font-weight:600}

/* ---------- №18 ---------- */
.rlist{display:grid;gap:8px}
.ritem{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;text-align:left;width:100%;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.ritem:hover{border-color:var(--accent)}
.ritem .n{font:700 1.05rem/1 var(--f-ui);width:30px;height:30px;border:1.5px solid var(--ink);border-radius:6px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.ritem .tx{min-width:0;font:400 .95rem/1.35 var(--f-word);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ritem .rs{font-size:.8rem;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ritem .rs.ok{color:var(--ok);font-weight:600}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--grid)}
.dots i.cur{background:var(--accent)} .dots i.ok{background:var(--ok)} .dots i.bad{background:var(--bad)}
.rsq{margin:0;font-weight:600;line-height:1.35}
.partlbl{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.plan{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.plan ol{margin:0;padding-left:1.3em;display:grid;gap:5px;font-size:.95rem;line-height:1.38}
.plan li.miss{color:var(--bad)}
.plan li.miss b{color:var(--bad)}
.plan i{font-family:var(--f-word);font-style:italic}

/* ---------- map & stats ---------- */
.topic{border-top:1px solid var(--line)}
.topic:first-child{border-top:0}
.topic > button{display:grid;grid-template-columns:28px 1fr auto;gap:3px 10px;align-items:start;width:100%;background:none;border:0;
  padding:11px 0;text-align:left;cursor:pointer}
.topic .no{font:700 .82rem/1.6 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.topic .nm{font-weight:600;line-height:1.3;min-width:0}
.topic .nm small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.topic .pc{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.topic .pc small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.meter{grid-column:2/-1;height:6px;background:var(--grid);border-radius:3px;overflow:hidden;display:flex}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.mid{background:var(--heat2)}
.meter i.low{background:var(--bad)}
.meter i.good{background:var(--ok)}
.tbody{padding:0 0 12px 38px;display:grid;gap:8px}
.tr{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;font-size:.93rem;line-height:1.35}
.tr .st{width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--grid);border:1.5px solid var(--muted)}
.tr .st.prog{background:var(--heat2);border-color:var(--heat3)}
.tr .st.mast{background:var(--ok);border-color:var(--ok)}
.tr .st.err{background:var(--bad);border-color:var(--bad)}
.tr b{font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin:-4px 0 12px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend .st{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--grid);border:1.5px solid var(--muted)}
.legend .st.prog{background:var(--heat2);border-color:var(--heat3)} .legend .st.mast{background:var(--ok);border-color:var(--ok)} .legend .st.err{background:var(--bad);border-color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.tile b{display:block;font:700 1.35rem/1.1 var(--f-ui);font-variant-numeric:tabular-nums}
.tile b small{font-size:.6em;color:var(--muted);font-weight:600}
.tile span{font-size:.8rem;color:var(--muted)}
.srow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .t{font-weight:600;line-height:1.3;min-width:0}
.srow .t small{display:block;font-weight:400;color:var(--muted);font-size:.84rem}
.srow .pct{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.srow .pct small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.srow .meter{grid-column:1/-1}
.weak{display:inline-block;margin-left:6px;font:700 .64rem/1 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;
  color:var(--bad);border:1.5px solid var(--bad);border-radius:4px;padding:3px 5px;vertical-align:2px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.chart svg{display:block;width:100%;height:auto}
.chart p{margin:6px 0 0;font-size:.86rem;color:var(--muted)}
.heatwrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:grid;gap:8px}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,30px));gap:4px}
.heat span{aspect-ratio:1;border-radius:5px;background:var(--grid)}
.heat span.h1{background:var(--heat1)} .heat span.h2{background:var(--heat2)} .heat span.h3{background:var(--heat3)} .heat span.h4{background:var(--heat4)}
.heat span.fut{background:none;border:1px dashed var(--line)}
.heat .dn{font-size:.68rem;color:var(--muted);text-align:center;aspect-ratio:auto;background:none}
.setrow{display:flex;justify-content:space-between;gap:8px 12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.sync{color:var(--muted);font-size:.86rem;margin:12px 0}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.confirm p{margin:0;width:100%;font-size:.92rem}

/* figure */
.fg .ln{stroke:var(--ink);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fg .cr{stroke:var(--ink);stroke-width:1.35;fill:none}
.fg .dsh{stroke:var(--muted);stroke-width:1.4;fill:none;stroke-dasharray:5 4;stroke-linecap:round}
.fg .thk{stroke:var(--accent);stroke-width:2.8;fill:none;stroke-linecap:round}
.fg .hl{stroke:var(--accent);stroke-width:3.4;fill:none;stroke-linecap:round}
.fg .mk{stroke:var(--ink);stroke-width:1.2;fill:none}
.fg .dot{fill:var(--ink)}
.fg .pl{fill:var(--ink);font:italic 600 15px var(--f-word)}
.fg .vl{fill:var(--accent);font:500 13.5px var(--f-word)}
.fg .vl .it,.fg .pl .it{font-style:italic}
@media (max-width:420px){ .tiles{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>

<div class="wrap">
  <header class="hd">
    <div class="hd-num" aria-hidden="true">18</div>
    <div><h1>Первый ход</h1><p>Планиметрия · задание 18 · темы не подписаны</p></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Разделы">

<script>
const BANK = {"version":1,"topics":{"0":"Опорные факты","1":"Биссектрисы смежных и односторонних углов","2":"Углы между биссектрисами и высотами","3":"Прямоугольный треугольник с высотой","4":"Медиана и биссектриса прямоугольного треугольника","5":"Правильные треугольник и шестиугольник","6":"Высота треугольника и трапеции","7":"Медиана, точка пересечения медиан","8":"Биссектриса треугольника","9":"Площадь треугольника","10":"Площадь трапеции","11":"Площадь по всем сторонам","12":"Площадь через диагонали","13":"Теоремы синусов и косинусов","14":"Радиус вписанной окружности","15":"Радиус описанной окружности","16":"Окружность, описанная около трапеции","17":"Дельтоид","18":"Углы: хорды, секущие, касательные","19":"Отрезки хорд, секущих, касательных","20":"Общая касательная к окружностям","21":"Признаки вписанности четырёхугольника","22":"Средняя линия трапеции","23":"Признаки параллелограмма, Вариньон","24":"Обобщённая теорема Фалеса","25":"Подобие треугольников","26":"Теорема Менелая","27":"Отношение площадей","28":"Отрезки касательных","29":"Вневписанная окружность","30":"Высоты"},"items":[{"id":"t01","type":"p","topics":[1],"q":"В параллелограмме ABCD биссектриса угла A пересекает сторону BC в точке K. AB = 6, KC = 4. Найдите периметр параллелограмма.","fig":{"pts":{"A":[0.0,0.0],"B":[3.0,5.196],"C":[13.0,5.196],"D":[10.0,0.0],"K":[9.0,5.196]},"seg":[["A","B"],["B","C"],["C","D"],["D","A"],["A","K"]],"ang":[["B","A","K",1],["K","A","D",1]],"val":[["A","B","6"],["K","C","4"]]},"opts":["Сравнить углы при параллельных BC и AD: △ABK равнобедренный, BK = AB","Теорема о биссектрисе: BK : KC = AB : AC","Подобие треугольников ABK и DCK","Теорема косинусов в △ABK"],"correct":0,"nudge":"Сравни углы ∠BAK и ∠BKA. Вспомни, что BC ∥ AD.","why":"∠BKA = ∠KAD как накрест лежащие при BC ∥ AD, а ∠KAD = ∠BAK. Значит, △ABK равнобедренный и BK = AB. Теорема о биссектрисе — про треугольник, здесь её не к чему применить.","hints":["Найди BK, затем BC = BK + KC.","BK = AB = 6, значит BC = 10."],"ans":32,"sol":"BK = AB = 6, BC = 6 + 4 = 10, P = 2·(6 + 10) = 32.","see":"Биссектриса угла параллелограмма или трапеции","think":"накрест лежащие углы ⇒ равнобедренный треугольник (BK = AB)"},{"id":"t02","type":"p","topics":[1,4],"q":"Биссектрисы углов A и B трапеции ABCD с основаниями AD и BC пересекаются в точке P. AB = 10. Найдите расстояние от P до середины AB.","fig":{"pts":{"A":[0.0,0.0],"B":[6.0,8.0],"C":[10.0,8.0],"D":[14.0,0.0],"P":[8.0,4.0],"M":[3.0,4.0]},"seg":[["A","B"],["B","C"],["C","D"],["D","A"],["A","P"],["B","P"]],"dash":[["P","M"]],"ang":[["B","A","P",1],["P","A","D",1],["A","B","P",2],["P","B","C",2]],"val":[["A","B","10"]],"lp":{"M":"w","P":"e"}},"opts":["Биссектрисы односторонних углов перпендикулярны ⇒ △APB прямоугольный, PM — медиана к гипотенузе","Теорема о биссектрисе в △ABD","Средняя линия трапеции равна полусумме оснований","Отрезки касательных"],"correct":0,"nudge":"Чему равна сумма углов A и B трапеции? А сумма их половинок?","why":"∠A + ∠B = 180° (односторонние при AD ∥ BC), значит ∠PAB + ∠PBA = 90° и ∠APB = 90°. Медиана прямоугольного треугольника к гипотенузе равна её половине.","hints":["Найди угол APB.","В прямоугольном треугольнике медиана к гипотенузе равна половине гипотенузы."],"ans":5,"sol":"∠APB = 90°, PM — медиана к гипотенузе: PM = AB/2 = 5.","see":"Биссектрисы двух углов при одной боковой стороне трапеции","think":"они перпендикулярны; точка пересечения лежит на средней линии"},{"id":"t03","type":"p","topics":[2],"q":"Биссектрисы углов A и B треугольника ABC пересекаются в точке I, ∠AIB = 118°. Найдите угол C (в градусах).","fig":{"pts":{"A":[0.0,0.0],"B":[8.0,0.0],"C":[4.337,7.511],"I":[4.158,2.401]},"seg":[["A","B"],["B","C"],["C","A"],["A","I"],["B","I"]],"ang":[["B","A","I",1],["I","A","C",1],["A","B","I",2],["I","B","C",2]],"lp":{"I":"n"}},"opts":["∠AIB = 90° + ∠C/2 (сумма углов △AIB)","∠AIB = 180° − ∠C, как для высот","Вписанный угол равен половине центрального","Теорема синусов в △AIB"],"correct":0,"nudge":"В △AIB углы при A и B — половинки углов треугольника. Чему равна их сумма через ∠C?","why":"∠IAB + ∠IBA = (∠A + ∠B)/2 = (180° − ∠C)/2, поэтому ∠AIB = 90° + ∠C/2. Формула 180° − ∠C — для угла между высотами, не путай.","hints":["Запиши ∠AIB через ∠C.","118° = 90° + ∠C/2."],"ans":56,"sol":"90° + ∠C/2 = 118°, отсюда ∠C = 56°.","see":"Две биссектрисы треугольника пересекаются","think":"центр вписанной окружности I; ∠AIB = 90° + ∠C/2"},{"id":"t04","type":"p","topics":[2,30],"q":"В остроугольном треугольнике ABC высоты AA_1 и BB_1 пересекаются в точке H, ∠C = 64°. Найдите угол AHB (в градусах).","fig":{"pts":{"A":[0.0,0.0],"B":[8.0,0.0],"C":[4.31,6.39],"A_1":[6.0,3.464],"B_1":[2.502,3.709],"H":[4.31,2.489]},"seg":[["A","B"],["B","C"],["C","A"],["A","A_1"],["B","B_1"]],"ra":[["C","A_1","A"],["C","B_1","B"]],"lp":{"H":"s"}},"opts":["Четырёхугольник CA_1HB_1: два прямых угла ⇒ ∠A_1HB_1 = 180° − ∠C","∠AHB = 90° + ∠C/2","Теорема о биссектрисе","Угол между касательной и хордой"],"correct":0,"nudge":"Посмотри на четырёхугольник с вершинами C, A_1, H, B_1. Какие его углы тебе известны?","why":"В CA_1HB_1 углы при A_1 и B_1 прямые, сумма углов 360°, поэтому ∠A_1HB_1 = 180° − ∠C. ∠AHB — вертикальный ему. Ещё отсюда: C, A_1, H, B_1 лежат на окружности с диаметром CH.","hints":["Сумма углов четырёхугольника — 360°.","∠AHB = ∠A_1HB_1 как вертикальные."],"ans":116,"sol":"∠AHB = 180° − 64° = 116°.","see":"Две высоты треугольника","think":"четырёхугольник с двумя прямыми углами: угол 180° − ∠C, вписанность, подобие с k = cos C"},{"id":"t05","type":"p","topics":[2,8],"q":"В треугольнике ABC ∠A = 80°, ∠B = 40°. Из вершины C проведены высота CH и биссектриса CL. Найдите угол HCL (в градусах).","fig":{"pts":{"A":[0.0,0.0],"B":[8.0,0.0],"C":[1.031,5.848],"H":[1.031,0.0],"L":[3.159,0.0]},"seg":[["A","B"],["B","C"],["C","A"],["C","H"],["C","L"]],"ra":[["B","H","C"]],"ang":[["A","C","L",1],["L","C","B",1]],"lp":{"H":"s","L":"s"}},"opts":["Угол между высотой и биссектрисой из одной вершины равен |∠A − ∠B|/2","Теорема о биссектрисе AL : LB = AC : BC","∠AIB = 90° + ∠C/2","Вписанный угол"],"correct":0,"nudge":"Найди ∠ACH из прямоугольного △ACH и ∠ACL как половину ∠C.","why":"∠C = 60°. ∠ACH = 90° − 80° = 10°, ∠ACL = 30°, поэтому ∠HCL = 20°. В общем виде угол равен |∠A − ∠B|/2.","hints":["Чему равен ∠ACH?","∠HCL = ∠ACL − ∠ACH."],"ans":20,"sol":"∠ACH = 10°, ∠ACL = 30°, ∠HCL = 20° = (80° − 40°)/2.","see":"Высота и биссектриса из одной вершины","think":"угол между ними |∠A − ∠B|/2 — считай через прямоугольный треугольник"},{"id":"t06","type":"p","topics":[3],"q":"В прямоугольном треугольнике ABC с прямым углом C высота CH делит гипотенузу на отрезки AH = 4 и BH = 9. Найдите CH.","fig":{"pts":{"A":[0.0,0.0],"B":[13.0,0.0],"C":[4.0,6.0],"H":[4.0,0.0]},"seg":[["A","B"],["B","C"],["C","A"],["C","H"]],"ra":[["A","H","C"],["A","C","B"]],"val":[["A","H","4"],["H","B","9"]],"lp":{"H":"s"}},"opts":["△ACH ~ △CBH ⇒ CH² = AH·BH","Медиана к гипотенузе равна её половине","Теорема Пифагора для △ABC","r = (a + b − c)/2"],"correct":0,"nudge":"Найди пару подобных треугольников, в которые входят CH, AH и BH.","why":"△ACH ~ △CBH (по острому углу), поэтому CH/AH = BH/CH и CH² = AH·BH.","hints":["CH² = 4·9."],"ans":6,"sol":"CH = √(4·9) = 6.","see":"Высота из прямого угла и отрезки гипотенузы","think":"три подобных треугольника: h² = a_c·b_c, a² = c·a_c"},{"id":"t07","type":"p","topics":[3],"q":"В прямоугольном треугольнике ABC (∠C = 90°) проведена высота CH. AC = 6, AH = 3,6. Найдите AB.","fig":{"pts":{"A":[0.0,0.0],"B":[10.0,0.0],"C":[3.6,4.8],"H":[3.6,0.0]},"seg":[["A","B"],["B","C"],["C","A"],["C","H"]],"ra":[["A","H","C"],["A","C","B"]],"val":[["A","C","6"],["A","H","3,6"]],"lp":{"H":"s"}},"opts":["△ACH ~ △ABC ⇒ AC² = AB·AH","AC² = AH·HB","Медиана к гипотенузе","Теорема синусов"],"correct":0,"nudge":"Какие треугольники подобны и содержат AC, AH и AB одновременно?","why":"△ACH ~ △ABC (общий острый угол A), поэтому AC/AB = AH/AC и AC² = AB·AH.","hints":["AB = AC²/AH."],"ans":10,"sol":"AB = 36/3,6 = 10.","see":"Катет и его проекция на гипотенузу","think":"катет² = гипотенуза × проекция этого катета"},{"id":"t08","type":"p","topics":[4,22],"q":"Углы при большем основании AD трапеции ABCD равны 30° и 60°, AD = 18, BC = 8. Найдите расстояние между серединами оснований.","fig":{"pts":{"A":[0.0,0.0],"B":[7.5,4.33],"C":[15.5,4.33],"D":[18.0,0.0],"M":[9.0,0.0],"N":[11.5,4.33]},"seg":[["A","B"],["B","C"],["C","D"],["D","A"]],"dash":[["M","N"]],"val":[["A","D","18"],["B","C","8"]],"txt":[[2.2,0.55,"30°"],[16.5,0.8,"60°"]],"lp":{"M":"s","N":"n"}},"opts":["Продлить боковые стороны: угол 90°, затем медианы к гипотенузам","Средняя линия трапеции равна (a + b)/2","Высота равнобедренной трапеции отсекает (a − b)/2","Теорема о биссектрисе"],"correct":0,"nudge":"Сложи углы при основании. Что получится, если продлить боковые стороны до пересечения?","why":"30° + 60° = 90°, значит боковые стороны пересекаются под прямым углом в точке P. PM и PN — медианы к гипотенузам: PM = AD/2 = 9, PN = BC/2 = 4, а P, N, M лежат на одной прямой. Отсюда MN = 9 − 4.","hints":["Найди угол при точке пересечения продолжений боковых сторон.","MN = AD/2 − BC/2."],"ans":5,"sol":"MN = (18 − 8)/2 = 5.","see":"Сумма углов при основании трапеции равна 90°","think":"продли боковые стороны: прямой угол, медианы к гипотенузам, MN = (a − b)/2"},{"id":"t09","type":"p","topics":[4],"q":"Медиана, проведённая к гипотенузе прямоугольного треугольника, равна 6,5, а один из катетов равен 5. Найдите другой катет.","fig":{"pts":{"A":[0.0,5.0],"B":[12.0,0.0],"C":[0.0,0.0],"M":[6.0,2.5]},"seg":[["A","B"],["B","C"],["C","A"],["C","M"]],"ra":[["A","C","B"]],"tick":[["A","M",1],["M","B",1]],"val":[["C","M","6,5"],["C","A","5"]],"lp":{"M":"ne"}},"opts":["Медиана к гипотенузе равна её половине","h² = a_c·b_c","Медиана делит треугольник на два равновеликих","Теорема о биссектрисе"],"correct":0,"nudge":"Где находится центр описанной окружности прямоугольного треугольника?","why":"Центр описанной окружности — середина гипотенузы, поэтому медиана к гипотенузе равна R = c/2. Значит, гипотенуза равна 13.","hints":["Гипотенуза = 2·6,5.","Теорема Пифагора: 13² − 5²."],"ans":12,"sol":"c = 13, второй катет √(169 − 25) = 12.","see":"Медиана к гипотенузе","think":"равна половине гипотенузы (это R); делит треугольник на два равнобедренных"},{"id":"t10","type":"p","topics":[5],"q":"ABCDEF — правильный шестиугольник. Площадь треугольника ACE равна 18. Найдите площадь шестиугольника.","fig":{"pts":{"A":[0.0,2.0],"B":[-1.732,1.0],"C":[-1.732,-1.0],"D":[-0.0,-2.0],"E":[1.732,-1.0],"F":[1.732,1.0]},"seg":[["A","B"],["B","C"],["C","D"],["D","E"],["E","F"],["F","A"]],"thick":[["A","C"],["C","E"],["E","A"]]},"opts":["Шестиугольник — 6 правильных треугольников; сравнить площади по кусочкам","Формула Герона для △ACE","Подобие треугольников ACE и ABC","Теорема синусов"],"correct":0,"nudge":"Разрежь шестиугольник на треугольники с вершиной в центре O. Сколько таких кусочков помещается в △ACE?","why":"Шестиугольник состоит из 6 равных треугольников с вершиной в центре O. △AOC — половина ромба ABCO, то есть один такой треугольник. △ACE = △AOC + △COE + △EOA — три кусочка, шестиугольник — шесть.","hints":["△AOC — половина ромба ABCO.","△ACE = 3 кусочка, шестиугольник = 6."],"ans":36,"sol":"S = 2·18 = 36.","see":"Правильный шестиугольник","think":"6 правильных треугольников со стороной a; большая диагональ 2a; △ACE — половина площади"},{"id":"t11","type":"p","topics":[5,15],"q":"Радиус окружности, описанной около правильного треугольника, равен 8. Найдите радиус вписанной окружности.","fig":{"pts":{"A":[0.0,8.0],"B":[-6.928,-4.0],"C":[6.928,-4.0],"O":[0.0,0.0]},"seg":[["A","B"],["B","C"],["C","A"]],"circ":[{"c":[0.0,0.0],"r":8.0},{"c":[0.0,0.0],"r":4.0,"d":1}],"lp":{"O":"e"}},"opts":["Центр — точка пересечения медиан, она делит их 2 : 1 ⇒ R = 2r","r = (a + b − c)/2, как в прямоугольном","Формула Герона","Отрезки касательных"],"correct":0,"nudge":"Где находятся центры вписанной и описанной окружностей правильного треугольника и как они делят медиану?","why":"В правильном треугольнике все центры совпадают с точкой пересечения медиан, а она делит медиану 2 : 1. Поэтому R = 2/3 высоты, r = 1/3 высоты и R = 2r.","hints":["R : r = 2 : 1."],"ans":4,"sol":"r = 8/2 = 4.","see":"Окружности правильного треугольника","think":"R = 2r = 2/3 высоты; все центры совпадают"},{"id":"t12","type":"p","topics":[6],"q":"Основания равнобедренной трапеции равны 7 и 17, боковая сторона равна 13. Найдите высоту трапеции.","fig":{"pts":{"A":[0.0,0.0],"B":[5.0,12.0],"C":[12.0,12.0],"D":[17.0,0.0],"H":[5.0,0.0]},"seg":[["A","B"],["B","C"],["C","D"],["D","A"]],"dash":[["B","H"]],"ra":[["D","H","B"]],"val":[["A","D","17"],["B","C","7"],["A","B","13"]],"lp":{"H":"s"}},"opts":["Высота из вершины меньшего основания отсекает отрезок (a − b)/2","Средняя линия","h = √(ab), как у описанной трапеции","Теорема синусов"],"correct":0,"nudge":"Опусти высоту из вершины B. Какой кусок большего основания она отсекает?","why":"AH = (17 − 7)/2 = 5 по симметрии, △ABH прямоугольный, h = √(13² − 5²).","hints":["AH = 5.","13² − 5² = 144."],"ans":12,"sol":"h = 12.","see":"Равнобедренная трапеция: нужны высота или проекция","think":"высоты из вершин меньшего основания: куски (a − b)/2 и (a + b)/2"},{"id":"t13","type":"p","topics":[6,11],"q":"Стороны треугольника равны 13, 14 и 15. Найдите высоту, проведённую к стороне 14.","fig":{"pts":{"A":[5.0,12.0],"B":[0.0,0.0],"C":[14.0,0.0],"H":[5.0,0.0]},"seg":[["A","B"],["B","C"],["C","A"]],"dash":[["A","H"]],"ra":[["C","H","A"]],"val":[["A","B","13"],["A","C","15"],["B","C","14"]],"lp":{"H":"s"}},"opts":["Площадь по Герону, затем h = 2S/a","h² = a_c·b_c","Теорема о биссектрисе","Медиана к гипотенузе"],"correct":0,"nudge":"Известны все три стороны. Через что проще всего выйти на высоту?","why":"p = 21, S = √(21·8·7·6) = 84, h = 2·84/14 = 12. Можно и через x: 13² − x² = 15² − (14 − x)².","hints":["p = 21.","S = 84."],"ans":12,"sol":"h = 2S/14 = 12.","see":"Даны три стороны, нужна высота","think":"Герон или «x» из двух теорем Пифагора, затем h = 2S/a; запомни 13–14–15: S = 84"},{"id":"t14","type":"p","topics":[7],"q":"В треугольнике ABC AB = 9, AC = 7, BC = 8. Найдите медиану AM.","fig":{"pts":{"A":[6.0,6.708],"B":[0.0,0.0],"C":[8.0,0.0],"M":[4.0,0.0]},"seg":[["A","B"],["B","C"],["C","A"],["A","M"]],"tick":[["B","M",1],["M","C",1]],"val":[["A","B","9"],["A","C","7"],["B","C","8"]],"lp":{"M":"s"}},"opts":["Удвоить медиану: параллелограмм, d₁² + d₂² = 2(a² + b²)","Медиана к гипотенузе равна её половине","Теорема о биссектрисе","Средняя линия треугольника"],"correct":0,"nudge":"Дострой треугольник до параллелограмма: продли медиану за точку M на её длину.","why":"Продлим AM на MD = AM: ABDC — параллелограмм с диагоналями AD = 2m и BC. (2m)² + 8² = 2(9² + 7²), отсюда m² = 49. Готовая формула: m = ½√(2b² + 2c² − a²).","hints":["4m² + 64 = 2·(81 + 49).","4m² = 196."],"ans":7,"sol":"m = 7.","see":"Нужна медиана, известны стороны","think":"удвой медиану → параллелограмм (или m = ½√(2b² + 2c² − a²))"},{"id":"t15","type":"p","topics":[7],"q":"В треугольнике ABC медианы AA_1 и BB_1 перпендикулярны, BC = 6, AC = 8. Найдите AB².","fig":{"pts":{"A":[6.667,4.422],"B":[6.0,0.0],"C":[0.0,0.0],"A_1":[3.0,0.0],"B_1":[3.333,2.211],"M":[4.222,1.474]},"seg":[["A","B"],["B","C"],["C","A"],["A","A_1"],["B","B_1"]],"ra":[["A","M","B"]],"tick":[["B","A_1",1],["A_1","C",1],["A","B_1",2],["B_1","C",2]],"val":[["B","C","6"],["A","C","8"]],"lp":{"M":"w","A_1":"s"}},"opts":["M делит медианы 2 : 1 ⇒ прямоугольный треугольник AMB","Теорема о биссектрисе","Медиана к гипотенузе","Площадь через ½ab·sin C"],"correct":0,"nudge":"Отметь точку M пересечения медиан. Какой треугольник с прямым углом получился и какие у него катеты?","why":"△AMB прямоугольный, AM = ⅔m_a, BM = ⅔m_b. Подставив формулы медиан, получаем итог: медианы к сторонам a и b перпендикулярны ⇔ a² + b² = 5c².","hints":["a² + b² = 5c², где c = AB.","36 + 64 = 5c²."],"ans":20,"sol":"AB² = 100/5 = 20.","see":"Меди лощадь (через высоту к основанию) и полупериметр.","why":"Высота к основанию √(100 − 36) = 8, S = 48, p = 16, r = 48/16 = 3. Формула (a + b − c)/2 верна только для прямоугольного треугольника.","hints":["S = 48.","p = 16."],"ans":3,"sol":"r = 3.","see":"Радиус вписанной окружности","think":"r = S/p; для прямоугольного ещё r = (a + b − c)/2"},{"id":"t21","type":"p","topics":[10,27],"q":"Диагонали трапеции ABCD с основаниями BC и AD пересекаются в точке O. Площади треугольников BOC и AOD равны 4 и 9. Найдите площадь трапеции.","fig":{"pts":{"A":[0.0,0.0],"B":[1.0,5.0],"C":[5.0,5.0],"D":[6.0,0.0],"O":[3.0,3.0]},"seg":[["A","B"],["B","C"],["C","D"],["D","A"],["A","C"],["B","D"]],"txt":[[3.0,4.483,"4"],[3.0,1.0,"9"]],"lp":{"O":"e"}},"opts":["△BOC ~ △DOA, а S_{AOB} = S_{COD} = √(S_{BOC}·S_{AOD})","S = средняя линия × высота","S = ½d₁d₂·sin φ","Теорема о биссектрисе"],"correct":0,"nudge":"Какие два треугольника подобны и с каким коэффициентом? Как с ними связаны треугольники у боковых сторон?","why":"Площади 4 и 9 ⇒ k = 2 : 3, BO : OD = 2 : 3. У △AOB и △AOD общая высота из A, поэтому S_{AOB} = 9·2/3 = 6; так же S_{COD} = 6. Итого 4 + 9 + 6 + 6.","hints":["S_{AOB} : S_{AOD} = BO : OD = 2 : 3.","S_{AOB} = S_{COD} = 6."],"ans":25,"sol":"S = 25 = (2 + 3)².","see":"Диагонали трапеции и площади четырёх треугольников","think":"при основаниях подобны, при боковых сторонах равновелики; S = (√S₁ + √S₂)²"},{"id":"t22","type":"p","topics":[10],"q":"Точка M — середина боковой стороны CD трапеции ABCD. Площадь треугольника ABM равна 15. Найдите площадь трапеции.","fig":{"pts":{"A":[0.0,0.0],"B":[2.0,4.0],"C":[6.0,4.0],"D":[10.0,0.0],"M":[8.0,2.0]},"seg":[["A","B"],["B","C"],["C","D"],["D","A"],["A","M"],["B","M"]],"tick":[["C","M",1],["M","D",1]],"lp":{"M":"e"}},"opts":["Продлить AM до пересечения с прямой BC: получится треугольник той же площади, BM — его медиана","Высота △ABM, опущенная из M, равна высоте трапеции","Подобие треугольников ABM и DCM","S = ½d₁d₂·sin φ"],"correct":0,"nudge":"Продли AM до пересечения с прямой BC в точке E. Сравни треугольники AMD и EMC.","why":"△AMD = △EMC (M — середина CD, вертикальные углы, накрест лежащие углы), поэтому S_{ABE} = S_{трап} и AM = ME. Тогда BM — медиана △ABE, и S_{ABM} = ½S_{трап}. Другой путь — средняя линия MN: она делит △ABM на два треугольника с высотами h/2, и S_{ABM} = ½·MN·h = ½S_{трап}.","hints":["S_{ABE} = S_{трап}.","Медиана делит площадь пополам."],"ans":30,"sol":"S = 2·15 = 30.","see":"Середина боковой стороны трапеции","think":"продли отрезок через середину: равные треугольники «перекладывают» площадь; S_{ABM} = ½S"},{"id":"t23","type":"p","topics":[11],"q":"Основания трапеции равны 6 и 20, боковые стороны — 13 и 15. Найдите площадь трапеции.","fig":{"pts":{"A":[0.0,0.0],"B":[5.0,12.0],"C":[11.0,12.0],"D":[20.0,0.0]},"seg":[["A","B"],["B","C"],["C","D"],["D","A"]],"val":[["A","D","20"],["B","C","6"],["A","B","13"],["C","D","15"]]},"opts":["Через вершину провести прямую ∥ боковой стороне: получится треугольник 13, 14, 15","Высота отсекает (a − b)/2 = 7","S = средняя линия × боковая сторона","Описанная трапеция: a + b = c + d"],"correct":0,"nudge":"Трапеция не равнобедренная. Как собрать обе боковые стороны в один треугольник?","why":"Перенесём сторону 13 параллельно, чтобы она вышла из вершины C. Получится треугольник со сторонами 13, 15 и 20 − 6 = 14 и той же высотой. Его площадь 84, значит h = 2·84/14 = 12. Отрезок (a − b)/2 работает только в равнобедренной трапеции.","hints":["Треугольник 13, 14, 15: S = 84.","h = 12, S = (6 + 20)/2·12."],"ans":156,"sol":"S = 13·12 = 156.","see":"Трапеция с известными четырьмя сторонами","think":"перенеси боковую сторону: треугольник c, d, a − b с той же высотой"},{"id":"t24","type":"p","topics":[12,23],"q":"Диагонали выпуклого четырёхугольника равны 10 и 12, угол между ними 30°. Найдите площадь четырёхугольника с вершинами в серединах его сторон.","fig":{"pts":{"A":[-4.0,-0.0],"B":[-4.33,-2.5],"C":[6.0,0.0],"D":[6.062,3.5],"K":[-4.165,-1.25],"L":[0.8
