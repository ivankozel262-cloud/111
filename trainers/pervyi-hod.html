,"15"],["B","C","5"]],"txt":[[1.6,0.42,"30°"]]},"opts":["Высота из B — катет против угла 30°: h = AB/2","h = AB·cos 30°","h = AB","Нужна вторая боковая сторона"],"correct":0,"nudge":"Опусти высоту BH. Какой угол у прямоугольного △ABH при вершине A?","why":"В △ABH ∠A = 30°, катет BH лежит против него и равен половине гипотенузы AB: h = 5. S = (15 + 5)/2·5 = 50.","hints":["h = 5."],"ans":50,"sol":"S = 10·5 = 50.","see":"Боковая сторона трапеции и угол при основании","think":"высота = боковая сторона × sin угла (против 30° — половина)"},{"id":"u49","type":"p","topics":[22],"q":"Средняя линия трапеции равна 10, а диагональ делит её на два отрезка, разность которых равна 3. Найдите большее основание трапеции.","fig":{"pts":{"A":[0.0,0.0],"B":[2.0,5.0],"C":[9.0,5.0],"D":[13.0,0.0],"M":[1.0,2.5],"N":[11.0,2.5],"Q":[4.5,2.5]},"seg":[["A","B"],["B","C"],["C","D"],["D","A"],["A","C"]],"thick":[["M","N"]],"hide":["Q"],"lp":{"M":"w","N":"e"}},"opts":["Отрезки средней линии — средние линии △ABC и △ACD: BC/2 и AD/2","Отрезки равны (a + b)/4 и (a − b)/4","Диагональ делит среднюю линию пополам","Нужна высота трапеции"],"correct":0,"nudge":"Средняя линия трапеции проходит через середину диагонали AC. Чем являются её куски для треугольников ABC и ACD?","why":"Кусок у боковой стороны AB — средняя линия △ABC, он равен BC/2. Второй кусок — средняя линия △ACD, он равен AD/2. AD/2 + BC/2 = 10, AD/2 − BC/2 = 3, значит AD/2 = 6,5 и AD = 13.","hints":["AD/2 + BC/2 = 10, AD/2 − BC/2 = 3."],"ans":13,"sol":"AD = 13.","see":"Диагональ делит среднюю линию трапеции","think":"куски средней линии = половины оснований"},{"id":"u50","type":"p","topics":[17,18],"q":"Из точки P к окружности радиуса 5 проведены две касательные, угол между ними равен 60°. Найдите расстояние от P до центра окружности.","fig":{"pts":{"A":[2.5,4.33],"B":[2.5,-4.33],"P":[10.0,0.0],"O":[0.0,0.0]},"seg":[["P","A"],["P","B"]],"circ":[{"c":[0.0,0.0],"r":5.0}],"txt":[[8.85,0.0,"60°"]],"lp":{"P":"e","O":"w"}},"opts":["PO — биссектриса угла P; в прямоугольном △PAO катет OA лежит против угла 30°","PO = 2·PA","PO = R√3","PO = R + PA"],"correct":0,"nudge":"Соедини O с A и с P. Какие углы у треугольника PAO?","why":"OA ⊥ PA, а PO делит угол P пополам: ∠APO = 30°. Катет OA = 5 лежит против угла 30°, поэтому гипотенуза PO = 10.","hints":["∠APO = 30°."],"ans":10,"sol":"PO = 10.","see":"Угол между касательными и радиус","think":"PO — биссектриса угла, △PAO прямоугольный"},{"id":"u51","type":"p","topics":[8,25],"q":"В треугольнике ABC AB = 6, AC = 3, AL — биссектриса. Прямая, проходящая через L параллельно AB, пересекает AC в точке K. Найдите KL.","fig":{"pts":{"A":[0.0,0.0],"B":[6.0,0.0],"C":[1.026,2.819],"L":[2.684,1.879],"K":[0.684,1.879]},"seg":[["A","B"],["B","C"],["C","A"],["A","L"],["K","L"]],"ang":[["B","A","L",1],["L","A","C",1]],"val":[["A","B","6"],["A","C","3"]],"lp":{"K":"w","L":"e"}},"opts":["∠KLA = ∠LAB = ∠KAL ⇒ AK = KL; затем подобие △CKL ~ △CAB","KL — средняя линия: AB/2","KL = AL","Теорема о биссектрисе в △AKL"],"correct":0,"nudge":"KL ∥ AB. Сравни ∠KLA с ∠LAB и ∠KAL.","why":"∠KLA = ∠LAB (накрест лежащие) = ∠KAL, поэтому AK = KL = x. △CKL ~ △CAB: KL/AB = CK/CA, то есть x/6 = (3 − x)/3, x = 2. В общем виде KL = bc/(b + c).","hints":["AK = KL = x.","x/6 = (3 − x)/3."],"ans":2,"sol":"KL = 2.","see":"Биссектриса и прямая, параллельная стороне","think":"параллельная + биссектриса ⇒ равнобедренный треугольник; затем подобие"},{"id":"u54","type":"p","topics":[10,27],"q":"В трапеции ABCD основания BC = 3 и AD = 6, O — точка пересечения диагоналей. Площадь треугольника AOB равна 6. Найдите площадь трапеции.","fig":{"pts":{"A":[0.0,0.0],"B":[1.0,6.0],"C":[4.0,6.0],"D":[6.0,0.0],"O":[2.667,4.0]},"seg":[["A","B"],["B","C"],["C","D"],["D","A"],["A","C"],["B","D"]],"val":[["B","C","3"],["A","D","6"]],"txt":[[1.322,3.333,"S = 6"]],"lp":{"O":"e"}},"opts":["BO : OD = BC : AD = 1 : 2, затем общие высоты: S_{AOD} = 2·S_{AOB}, S_{BOC} = ½·S_{COD}","S = 4·S_{AOB}","S_{AOD} = 4·S_{AOB} по подобию","Нужна высота трапеции"],"correct":0,"nudge":"У △AOB и △AOD общая вершина A, а основания лежат на прямой BD. В каком отношении O делит BD?","why":"BO : OD = BC : AD = 1 : 2. S_{AOD} = 2·6 = 12 (общая высота из A). S_{COD} = S_{AOB} = 6, а S_{BOC} = 6/2 = 3 (общая высота из C). Итого 6 + 12 + 6 + 3 = 27.","hints":["S_{AOD} = 12, S_{COD} = 6.","S_{BOC} = 3."],"ans":27,"sol":"S = 27.","see":"Трапеция: известна площадь треугольника у боковой стороны","think":"BO : OD = b : a; общие высоты; S_{AOB} = S_{COD}"},{"id":"f28","type":"f","topics":[6,16],"q":"В трапеции ABCD (AD ∥ BC) диагонали AC и BD равны.","stmts":[{"t":"Трапеция равнобедренная","ok":true,"why":"Равные диагонали — признак равнобедренной трапеции."},{"t":"Углы при основании AD равны","ok":true,"why":"Так у любой равнобедренной трапеции."},{"t":"Около трапеции можно описать окружность","ok":true,"why":"Описать окружность можно около любой равнобедренной трапеции."},{"t":"Диагонали перпендикулярны","ok":false,"why":"Ниоткуда не следует: это отдельное условие."},{"t":"В трапецию можно вписать окружность","ok":false,"why":"Для этого нужно AD + BC = AB + CD."}],"see":"Диагонали трапеции равны","think":"равнобедренная ⇒ вписанная, равные углы при основании"},{"id":"f29","type":"f","topics":[25,27],"q":"Треугольники ABC и A_1B_1C_1 подобны, коэффициент подобия k = 3.","stmts":[{"t":"Периметры относятся как 3 : 1","ok":true,"why":"Все линейные размеры умножаются на k."},{"t":"Площади относятся как 9 : 1","ok":true,"why":"Площади — как k²."},{"t":"Соответственные медианы относятся как 3 : 1","ok":true,"why":"Медиана — линейный размер."},{"t":"Площади относятся как 3 : 1","ok":false,"why":"Площадь — квадрат линейного размера: 9 : 1."},{"t":"Радиусы вписанных окружностей относятся как 9 : 1","ok":false,"why":"Радиус — линейный размер: 3 : 1."}],"see":"Подобные треугольники","think":"линейные размеры — k, площади — k²"},{"id":"f30","type":"f","topics":[21,18],"q":"Отрезок AB виден из точек C и D, лежащих по одну сторону от прямой AB, под прямым углом.","stmts":[{"t":"A, B, C, D лежат на окружности с диаметром AB","ok":true,"why":"Точки, из которых отрезок виден под 90°, лежат на окружности с этим диаметром."},{"t":"∠ACD = ∠ABD","ok":true,"why":"Вписанные углы опираются на одну дугу AD."},{"t":"Середина AB равноудалена от C и D","ok":true,"why":"Это центр окружности, MC = MD = AB/2."},{"t":"CD = AB","ok":false,"why":"CD — хорда, а AB — диаметр, поэтому CD ≤ AB."},{"t":"ABCD — прямоугольник","ok":false,"why":"Только в частном случае."}],"see":"Отрезок виден из двух точек под прямым углом","think":"окружность на этом отрезке как на диаметре"},{"id":"f31","type":"f","topics":[4,8],"q":"CL — биссектриса прямого угла C треугольника ABC.","stmts":[{"t":"∠ACL = 45°","ok":true,"why":"Половина прямого угла."},{"t":"AL : LB = AC : BC","ok":true,"why":"Теорема о биссектрисе."},{"t":"CL делит пополам угол между высотой CH и медианой CM","ok":true,"why":"∠ACH = ∠BCM = ∠B, поэтому ∠HCL = ∠LCM."},{"t":"CL = AB/2","ok":false,"why":"Половине гипотенузы равна медиана, а не биссектриса."},{"t":"L — середина AB","ok":false,"why":"Только если AC = BC."}],"see":"Биссектриса прямого угла","think":"∠ACL = 45°; делит пополам угол между высотой и медианой"},{"id":"f32","type":"f","topics":[7,27],"q":"AA_1 — медиана треугольника ABC, M — точка пересечения его медиан.","stmts":[{"t":"AM : MA_1 = 2 : 1","ok":true,"why":"Точка пересечения медиан делит каждую в отношении 2 : 1 от вершины."},{"t":"S_{AMB} = ⅓·S_{ABC}","ok":true,"why":"Высота из M — треть высоты из C."},{"t":"S_{BMA_1} = ⅙·S_{ABC}","ok":true,"why":"Медианы делят треугольник на 6 равновеликих частей."},{"t":"AM = MA_1","ok":false,"why":"Отношение 2 : 1, а не 1 : 1."},{"t":"S_{AMB} = ½·S_{ABC}","ok":false,"why":"Половину отсекает медиана, а △AMB — треть."}],"see":"Точка пересечения медиан","think":"делит медианы 2 : 1; шесть равновеликих треугольников"},{"id":"f33","type":"f","topics":[18,15],"q":"Вписанный в окружность радиуса R угол ACB равен 30°.","stmts":[{"t":"AB = R","ok":true,"why":"AB = 2R·sin 30° = R."},{"t":"Центральный угол AOB равен 60°","ok":true,"why":"Центральный угол вдвое больше вписанного."},{"t":"△AOB правильный","ok":true,"why":"OA = OB = R и угол между ними 60°."},{"t":"AB = R√3","ok":false,"why":"Так было бы при вписанном угле 60°."},{"t":"∠AOB = 15°","ok":false,"why":"Центральный угол вдвое больше вписанного, а не вдвое меньше."}],"see":"Вписанный угол 30°","think":"хорда равна радиусу; центральный угол 60°"},{"id":"f34","type":"f","topics":[19,25],"q":"Из точки P вне окружности проведены секущие PAB и PCD (A между P и B, C между P и D).","stmts":[{"t":"PA·PB = PC·PD","ok":true,"why":"Свойство двух секущих (степень точки)."},{"t":"△PAC ~ △PDB","ok":true,"why":"Угол P общий, ∠PAC = ∠PDB (∠PAC смежен с ∠BAC, а ABDC вписанный)."},{"t":"∠P равен полуразности дуг BD и AC","ok":true,"why":"Вершина угла вне круга."},{"t":"PA·AB = PC·CD","ok":false,"why":"Умножается внешняя часть на всю секущую, а не на внутреннюю."},{"t":"AC ∥ BD","ok":false,"why":"В общем случае нет: AC и BD «антипараллельны»."}],"see":"Две секущие из одной точки","think":"PA·PB = PC·PD; подобие △PAC ~ △PDB"},{"id":"f35","type":"f","topics":[6,16],"q":"ABCD — равнобедренная трапеция с основаниями AD > BC, BH — высота.","stmts":[{"t":"AH = (AD − BC)/2","ok":true,"why":"По симметрии с двух сторон отсекаются равные куски."},{"t":"HD = (AD + BC)/2","ok":true,"why":"HD = AD − AH."},{"t":"AC = BD","ok":true,"why":"Диагонали равнобедренной трапеции равны."},{"t":"AH = (AD + BC)/2","ok":false,"why":"Это HD — проекция диагонали BD на основание."},{"t":"BH = AB","ok":false,"why":"Высота короче наклонной боковой стороны."}],"see":"Высота равнобедренной трапеции","think":"куски (a − b)/2 и (a + b)/2"},{"id":"f36","type":"f","topics":[22,24],"q":"Прямая, параллельная основаниям трапеции (AD = a, BC = b), проходит через точку O пересечения диагоналей и пересекает боковые стороны в точках M и N.","stmts":[{"t":"O — середина MN","ok":true,"why":"MO = ON = ab/(a + b) — из подобия."},{"t":"MN = 2ab/(a + b)","ok":true,"why":"Это среднее гармоническое оснований."},{"t":"MN короче средней линии","ok":true,"why":"2ab/(a + b) < (a + b)/2 при a ≠ b."},{"t":"MN = (a + b)/2","ok":false,"why":"Так равна средняя линия — это другой отрезок."},{"t":"MN — средняя линия трапеции","ok":false,"why":"Средняя линия делит пополам боковые стороны, а MN проходит через O."}],"see":"Отрезок через точку пересечения диагоналей трапеции","think":"O делит его пополам; длина 2ab/(a + b)"},{"id":"f37","type":"f","topics":[20,18],"q":"Окружности касаются внешним образом в точке K, AB — их общая внешняя касательная (A и B — точки касания).","stmts":[{"t":"∠AKB = 90°","ok":true,"why":"Касательная в K делит AB пополам: MA = MK = MB."},{"t":"AB = 2√(Rr)","ok":true,"why":"Сдвиг касательной: AB² = (R + r)² − (R − r)² = 4Rr."},{"t":"Общая касательная в точке K проходит через середину AB","ok":true,"why":"MA = MK = MB."},{"t":"AB = R + r","ok":false,"why":"R + r — расстояние между центрами."},{"t":"∠AKB = 60°","ok":false,"why":"Он всегда прямой."}],"see":"Касающиеся окружности и общая внешняя касательная","think":"∠AKB = 90°, AB = 2√(Rr)"},{"id":"f38","type":"f","topics":[28,14],"q":"Окружность вписана в прямоугольный треугольник ABC с прямым углом C (a, b — катеты, c — гипотенуза).","stmts":[{"t":"r = (a + b − c)/2","ok":true,"why":"Отрезки касательных из C равны r."},{"t":"r = p − c","ok":true,"why":"Это та же формула через полупериметр."},{"t":"Центр окружности лежит на биссектрисе угла C","ok":true,"why":"Центр вписанной окружности — на всех биссектрисах."},{"t":"r = c/2","ok":false,"why":"c/2 — радиус описанной окружности."},{"t":"Центр окружности — середина гипотенузы","ok":false,"why":"Середина гипотенузы — центр описанной окружности."}],"see":"Окружность, вписанная в прямоугольный треугольник","think":"r = (a + b − c)/2 = p − c"},{"id":"f39","type":"f","topics":[10,27],"q":"Точка M — середина боковой стороны CD трапеции ABCD (AD ∥ BC).","stmts":[{"t":"S_{ABM} = ½·S_{ABCD}","ok":true,"why":"Продли AM до прямой BC: площадь «перекладывается», BM — медиана."},{"t":"Если продлить AM до прямой BC в точке E, то △AMD = △EMC","ok":true,"why":"CM = MD, вертикальные и накрест лежащие углы."},{"t":"M лежит на средней линии трапеции","ok":true,"why":"Средняя линия соединяет середины боковых сторон."},{"t":"S_{ABM} = ¼·S_{ABCD}","ok":false,"why":"Половина, а не четверть."},{"t":"AM = BM","ok":false,"why":"В общем случае нет."}],"see":"Середина боковой стороны трапеции","think":"продли отрезок через середину; S_{ABM} = ½S"},{"id":"f40","type":"f","topics":[29,28],"q":"Вневписанная окружность треугольника ABC касается стороны BC в точке N, а продолжений сторон AB и AC — в точках P и Q.","stmts":[{"t":"AP = AQ = p (полупериметр)","ok":true,"why":"AP + AQ = AB + BC + CA."},{"t":"BN = p − AB","ok":true,"why":"BN = BP = AP − AB."},{"t":"CN = p − AC","ok":true,"why":"CN = CQ = AQ − AC."},{"t":"AP = AB + AC","ok":false,"why":"AP = p, а не сумма двух сторон."},{"t":"BN = p − BC","ok":false,"why":"p − BC — отрезок касательной из A к вписанной окружности."}],"see":"Вневписанная окружность и точки касания","think":"AP = AQ = p; BN = p − AB"},{"id":"f41","type":"f","topics":[4,21],"q":"В треугольнике ABC медиана BM равна половине стороны AC.","stmts":[{"t":"∠ABC = 90°","ok":true,"why":"MA = MB = MC: B лежит на окружности с диаметром AC."},{"t":"M — центр окружности, описанной около △ABC","ok":true,"why":"M равноудалена от всех трёх вершин."},{"t":"△ABM и △CBM равнобедренные","ok":true,"why":"MA = MB и MC = MB."},{"t":"∠A = ∠C","ok":false,"why":"В общем случае нет."},{"t":"BM ⊥ AC","ok":false,"why":"Перпендикулярна высота, а не медиана."}],"see":"Медиана равна половине стороны","think":"угол при вершине прямой; M — центр описанной окружности"},{"id":"b21","type":"b","topics":[0,21],"q":"Нужно доказать, что две прямые перпендикулярны.","opts":["Найти прямой угол: опирается на диаметр, медиана = половине стороны, биссектрисы смежных углов","Показать, что прямые пересекаются","Найти равные отрезки на прямых","Применить теорему Менелая"],"correct":0,"nudge":"Какие факты планиметрии «выдают» угол 90°?","why":"Типичные источники прямого угла: вписанный угол на диаметр, медиана, равная половине стороны, биссектрисы смежных (или односторонних) углов, радиус в точку касания, сумма двух углов треугольника = 90°.","see":"Доказать перпендикулярность","think":"диаметр, медиана = половине стороны, смежные биссектрисы, касательная ⊥ радиусу"},{"id":"b22","type":"b","topics":[0,25],"q":"Нужно доказать, что точка — середина отрезка.","opts":["Найти пару равных треугольников (часто — вертикальные и накрест лежащие углы)","Показать, что через точку проходит биссектриса","Применить теорему синусов","Найти вписанный угол"],"correct":0,"nudge":"Как обычно получают равенство двух отрезков?","why":"Равные треугольники (по стороне и двум углам — вертикальные и накрест лежащие), медиана равнобедренного треугольника, средняя линия, Фалес. Биссектриса сама по себе середину не даёт.","see":"Доказать, что точка — середина","think":"равные треугольники, Фалес, медиана равнобедренного"},{"id":"b23","type":"b","topics":[24,0],"q":"Нужно доказать, что две прямые параллельны.","opts":["Равные накрест лежащие или соответственные углы, или обратная теорема Фалеса (AM : MB = AN : NC)","Показать, что прямые не пересекаются в пределах чертежа","Найти равные отрезки на прямых","Применить теорему косинусов"],"correct":0,"nudge":"Какие признаки параллельности ты знаешь?","why":"Признаки параллельности: равные накрест лежащие или соответственные углы, сумма односторонних 180°, две прямые ⊥ одной, а для отрезков в треугольнике — равные отношения на сторонах (обратная теорема Фалеса, средняя линия).","see":"Доказать параллельность","think":"углы при секущей или равные отношения (обратный Фалес)"},{"id":"b24","type":"b","topics":[19,17],"q":"Нужно найти длину касательной из точки P к окружности. Известны радиус R и расстояние PO до центра.","opts":["PT² = PO² − R² (радиус в точку касания ⊥ касательной)","PT = PO − R","PT = PO + R","PT = √(PO·R)"],"correct":0,"nudge":"Какой угол между радиусом в точку касания и касательной?","why":"OT ⊥ PT, поэтому △POT прямоугольный с гипотенузой PO: PT² = PO² − R².","see":"Касательная по радиусу и расстоянию до центра","think":"прямоугольный △POT"},{"id":"b25","type":"b","topics":[16,19],"q":"Нужно найти расстояние от центра окружности до хорды. Известны радиус и длина хорды.","opts":["Перпендикуляр из центра делит хорду пополам: d = √(R² − (l/2)²)","d = R − l/2","d = l/2","Теорема синусов"],"correct":0,"nudge":"Где основание перпендикуляра, опущенного из центра на хорду?","why":"Перпендикуляр из центра — серединный перпендикуляр к хорде. В прямоугольном треугольнике «радиус — половина хорды — расстояние» d² = R² − (l/2)².","see":"Расстояние от центра до хорды","think":"перпендикуляр из центра делит хорду пополам"},{"id":"b26","type":"b","topics":[25],"q":"Нужно доказать подобие двух треугольников, у которых есть общий угол.","opts":["Найти ещё одну пару равных углов или показать, что стороны при общем угле пропорциональны","Найти пару равных сторон","Показать, что треугольники равновелики","Найти прямой угол в одном из них"],"correct":0,"nudge":"Сколько условий нужно для подобия, если один угол уже общий?","why":"При общем угле хватает ещё одного равного угла (первый признак) или пропорциональности сторон, прилежащих к общему углу (второй признак).","see":"Подобие при общем угле","think":"ещё один угол или пропорциональные стороны при нём"},{"id":"b27","type":"b","topics":[13],"q":"Нужно найти сторону треугольника, лежащую против угла 120°. Известны две другие стороны.","opts":["Теорема косинусов с cos 120° = −½: c² = a² + b² + ab","c² = a² + b² − ab","c = a + b","Теорема синусов"],"correct":0,"nudge":"Чему равен cos 120°? Какой знак будет у последнего слагаемого?","why":"c² = a² + b² − 2ab·cos 120° = a² + b² + ab. Вариант с «− ab» — это угол 60°.","see":"Сторона против угла 120°","think":"теорема косинусов: c² = a² + b² + ab"},{"id":"b28","type":"b","topics":[27,9],"q":"Нужно найти отношение площадей двух треугольников с общей вершиной, основания которых лежат на одной прямой.","opts":["Отношение оснований: высота общая","Квадрат отношения оснований","Отношение периметров","Формула Герона для каждого"],"correct":0,"nudge":"Что у таких треугольников одинаковое?","why":"Высота из общей вершины на эту прямую общая, поэтому площади относятся как основания. Квадрат отношения — только для подобных треугольников.","see":"Треугольники с общей вершиной и основаниями на одной прямой","think":"площади относятся как основания"},{"id":"b29","type":"b","topics":[14,6],"q":"Нужно найти радиус окружности, вписанной в равнобедренную трапецию. Известны основания a и b.","opts":["Боковая сторона = (a + b)/2, h = √(ab), r = h/2","r = (a − b)/2","r = (a + b)/4","r = ab/(a + b)"],"correct":0,"nudge":"Какое равенство даёт вписанная окружность? Как потом найти высоту?","why":"a + b = 2c, поэтому c = (a + b)/2. Проекция боковой стороны (a − b)/2, h² = c² − ((a − b)/2)² = ab. r = h/2 = √(ab)/2.","see":"Равнобедренная трапеция с вписанной окружностью","think":"c = (a + b)/2, h = √(ab)"},{"id":"b30","type":"b","topics":[22],"q":"Нужно найти отрезок, соединяющий середины диагоналей трапеции. Известны основания a > b.","opts":["(a − b)/2: средняя линия минус два куска по b/2","(a + b)/2","2ab/(a + b)","√(ab)"],"correct":0,"nudge":"Средняя линия проходит через середины диагоналей и делится ими на три куска.","why":"Куски средней линии — b/2, (a − b)/2, b/2 (средние линии треугольников). Средний кусок и соединяет середины диагоналей.","see":"Отрезок между серединами диагоналей трапеции","think":"(a − b)/2"},{"id":"r01","type":"r","topics":[20,28,4],"q":"Две окружности касаются внешним образом в точке K. Прямая касается первой окружности в точке A, а второй — в точке B.\nа) Докажите, что угол AKB прямой.\nб) Найдите AB, если радиусы окружностей равны 4 и 9.","fig":{"pts":{"A":[0.0,0.0],"B":[12.0,0.0],"K":[3.692,5.538],"O_1":[0.0,4.0],"O_2":[12.0,9.0]},"seg":[["A","B"],["A","K"],["B","K"]],"circ":[{"c":[0.0,4.0],"r":4.0},{"c":[12.0,9.0],"r":9.0}],"lp":{"K":"n","A":"s","B":"s","O_1":"w","O_2":"e"}},"steps":[{"part":"а","q":"С чего начать доказательство?","opts":["Провести общую касательную в точке K до пересечения с AB в точке M","Провести высоту KH в △AKB","Применить теорему косинусов к △AKB","Доказать, что △AKB равнобедренный"],"correct":0,"why":"Касательная в точке K общая для обеих окружностей. Из точки M на AB к каждой окружности идут две касательные — это даст равные отрезки. Есть и второй путь: радиусы O_1A ∥ O_2B, равнобедренные △AO_1K и △BO_2K и сумма их углов."},{"part":"а","q":"Что даёт точка M?","opts":["MA = MK и MB = MK — отрезки касательных из одной точки","M — середина O_1O_2","△AMK ~ △BMK","MK ⊥ AB"],"correct":0,"why":"Из M к первой окружности проведены касательные MA и MK, ко второй — MB и MK. Значит, MA = MK = MB."},{"part":"а","q":"Как закончить доказательство?","opts":["KM — медиана △AKB и равна половине AB ⇒ ∠AKB = 90°","△AKB равнобедренный, поэтому ∠AKB = 90°","MK — биссектриса угла AKB","AK = BK, поэтому угол прямой"],"correct":0,"why":"M — середина AB, и MK = AB/2. Медиана, равная половине стороны, ⇒ угол при вершине прямой (K лежит на окружности с диаметром AB)."},{"part":"б","q":"Как найти AB?","opts":["Сдвинуть AB параллельно в центр меньшей окружности: гипотенуза O_1O_2 = 13, катет 9 − 4 = 5","AB = O_1O_2 = 13","AB = 9 − 4","AB = √(9² + 4²)"],"correct":0,"why":"O_1A ⊥ AB и O_2B ⊥ AB, поэтому O_1ABO_2 — прямоугольная трапеция. Прямая через O_1, параллельная AB, даёт прямоугольный треугольник с гипотенузой 4 + 9 = 13 и катетом 9 − 4 = 5. AB² = 169 − 25 = 144."}],"ans":12,"sol":"AB = √(13² − 5²) = 12 = 2√(4·9). Другой путь: MO_1 и MO_2 — биссектрисы смежных углов, ∠O_1MO_2 = 90°, MK — высота: MK² = 4·9, AB = 2·MK = 12.","see":"Две касающиеся окружности и общая внешняя касательная","think":"касательная в точке касания ⇒ MA = MK = MB ⇒ прямой угол; AB = 2√(Rr)"},{"id":"r02","type":"r","topics":[1,10,23],"q":"В трапеции ABCD с основаниями AD и BC биссектрисы углов A и B пересекаются в точке M, лежащей на стороне CD.\nа) Докажите, что AB = AD + BC.\nб) Найдите площадь трапеции, если AM = 8, BM = 6.","fig":{"pts":{"A":[0.0,0.0],"B":[2.8,9.6],"C":[5.8,9.6],"D":[7.0,0.0],"M":[6.4,4.8]},"seg":[["A","B"],["B","C"],["C","D"],["D","A"],["A","M"],["B","M"]],"ang":[["B","A","M",1],["M","A","D",1],["A","B","M",2],["M","B","C",2]],"lp":{"M":"e"}},"steps":[{"part":"а","q":"С чего начать?","opts":["Продлить BM до пересечения с прямой AD в точке E","Провести высоту из вершины B","Провести диагонали трапеции","Применить теорему о биссектрисе в △ABD"],"correct":0,"why":"Биссектриса угла и параллельные основания дают равнобедренный треугольник, но его нужно достроить: продолжить BM до прямой AD. Можно и иначе: провести через M прямую, параллельную основаниям, — получатся два равнобедренных треугольника."},{"part":"а","q":"Какой треугольник получился?","opts":["△ABE равнобедренный: ∠AEB = ∠EBC = ∠ABE ⇒ AB = AE","△ABE прямоугольный с прямым углом A","△ABE равносторонний","△ABE подобен △MCD"],"correct":0,"why":"∠AEB = ∠EBC как накрест лежащие при AD ∥ BC, а ∠EBC = ∠ABE, так как BM — биссектриса. Значит, AB = AE."},{"part":"а","q":"Что даёт биссектриса AM?","opts":["В равнобедренном △ABE биссектриса AM — медиана: BM = ME","AM ⊥ AD","AM = ME","AM — средняя линия трапеции"],"correct":0,"why":"Биссектриса, проведённая к основанию равнобедренного треугольника, — медиана и высота. Отсюда BM = ME (и ∠AMB = 90°)."},{"part":"а","q":"Как получить AB = AD + BC?","opts":["△BMC = △EMD (BM = ME, вертикальные и накрест лежащие углы) ⇒ BC = DE","AD = BC, потому что M — середина CD","△ABM ~ △DEM","AB = AE = 2·AM"],"correct":0,"why":"△BMC = △EMD, поэтому BC = DE (и CM = MD). AB = AE = AD + DE = AD + BC."},{"part":"б","q":"Как найти площадь трапеции?","opts":["∠AMB = 90° и S_{ABCD} = S_{ABE} ⇒ S = 2·S_{ABM}","S = ½·AM·BM","S = 4·S_{ABM}","Нужна высота трапеции — данных не хватает"],"correct":0,"why":"S_{ABCD} = S_{ABMD} + S_{BMC} = S_{ABMD} + S_{EMD} = S_{ABE}. AM — медиана △ABE, поэтому S_{ABE} = 2·S_{ABM} = 2·½·8·6."}],"ans":48,"sol":"S_{ABM} = ½·8·6 = 24, S = 2·24 = 48.","see":"Биссектрисы углов при боковой стороне трапеции встречаются на другой боковой стороне","think":"продли биссектрису до основания: равнобедренный треугольник, равные треугольники, площадь «перекладывается»"},{"id":"r03","type":"r","topics":[30,21,25],"q":"Высоты AA_1 и CC_1 остроугольного треугольника ABC пересекаются в точке H.\nа) Докажите, что треугольник A_1BC_1 подобен треугольнику ABC.\nб) Найдите радиус окружности, описанной около треугольника A_1BC_1, если AC = 10 и cos∠ABC = 0,6.","fig":{"pts":{"A":[0.0,0.0],"B":[3.58,9.837],"C":[10.0,0.0],"A_1":[7.013,4.577],"C_1":[1.17,3.214],"H":[3.58,2.337]},"seg":[["A","B"],["B","C"],["C","A"],["A","A_1"],["C","C_1"]],"dash":[["A_1","C_1"]],"ra":[["C","A_1","A"],["A","C_1","C"]],"val":[["A","C","10"]],"lp":{"H":"s","A_1":"e","C_1":"w"}},"steps":[{"part":"а","q":"С чего начать?","opts":["Заметить: из A_1 и C_1 отрезок AC виден под 90° ⇒ A, C, A_1, C_1 на одной окружности","Доказать, что A_1C_1 ∥ AC","Провести медиану из вершины B","Применить теорему Менелая"],"correct":0,"why":"∠AA_1C = ∠AC_1C = 90°, поэтому A_1 и C_1 лежат на окружности с диаметром AC. Второй путь: BA_1 = AB·cos B и BC_1 = BC·cos B — стороны при общем угле B пропорциональны."},{"part":"а","q":"Какие углы равны?","opts":["∠BA_1C_1 = ∠BAC: внешний угол вписанного четырёхугольника AC_1A_1C","∠BA_1C_1 = ∠BCA","∠BA_1C_1 = 90°","∠BA_1C_1 = ∠ABC"],"correct":0,"why":"В вписанном AC_1A_1C ∠C_1A_1C + ∠C_1AC = 180°, поэтому ∠BA_1C_1 = 180° − ∠C_1A_1C = ∠BAC. Вместе с общим углом B — подобие (A_1 ↔ A, C_1 ↔ C)."},{"part":"б","q":"Чему равен коэффициент подобия?","opts":["k = BA_1/BA = cos B (из прямоугольного △ABA_1)","k = sin B","k = ½","k = A_1C_1/BC"],"correct":0,"why":"В △ABA     if (x < 6 || x > W - 6 || y < 6 || y > H - 6) m -= 6;

  const cen = dots.length ? dots.reduce((a, b) => [a[0] + b[0] / dots.length, a[1] + b[1] / dots.length], [0, 0]) : [W / 2, H / 2];
  shown.forEach((n, i) => {
    const p = dots[i];

    const own = segS.find(g => (g[2][0] === q[0] && g[2][1] === q[1]) || (g[2][0] === q[1] && g[2][1] === q[0])) || null;
    const ticked = (f.tick || []).some(t => (t[0] === q[0] && t[1] === q[1]) || (t[0] === q[1] && t[1] === q[0]));
    let best = -Infinity, pos = null;

  });
  (f.txt || []).forEach(t => out.push(`<text x="${X(t[0]).toFixed(1)}" y="${Y(t[1]).toFixed(1)}" text-anchor="middle" dominant-baseline="central" class="vl">${svgText(t[2])}</text>`));
  dots.forEach(p => out.push(`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.3" class="dot"/>`));
  labels.forEach(([x, y, n]) => out.push(`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="central" class="pl">${labelSvg(n)}</text>`));

}

const clock = { acc: 0, since: 0, on: false };
function clockStart(){ clock.acc = 0; clock.on = true; clock.since = document.visibilityState === 'visible' ? performance.now() : 0; }
function clockRead(){ return Math.min(600, (clock.acc + (clock.since ? performance.now() - clock.since : 0)) / 1000); }

document.addEventListener('visibilitychange', () => {

/* ================= streak & today ================= */
function streak(){
  let n = 0, k = 0;
  const on = off => { const d = S.days[dayKey(dayShift(off).getTime())]; return d && d[0] >= ACTIVE_DAY; };
  if (!on(0)) k = -1;
  while (on(k - n)) n++;
  return n;
}
function bestStreak(){
  const keys = Object.keys(S.days).filter(k => S.days[k][0] >= ACTIVE_DAY).sort();
  let best = 0, run = 0, prev = null;
  for (const k of keys) { const t = new Date(k + 'T12:00:00').getTime(); run = prev && Math.round((t - prev) / DAY) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = t; }

}

document.addEventListener('keydown', e => {

function finishSession(){

/* ================= №18 walkthrough ================= */
const R = { it: null, step: 0, order: [], chosen: null, res: [], phase: '', ansDone: false, hintSol: false };
const rItems = () => ITEMS.filter(i => i.type === 'r');
function renderRList(){

$('rBody').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;

  const act = b.dataset.act;
  if (b.dataset.oi !== undefined) chooseR(+b.dataset.oi);
  else if (act === 'rnext') { R.step++; R.chosen = null; R.phase = 'choose'; R.order = R.step < R.it.steps.length ? shuffle([0, 1, 2, 3]) : []; clockStart(); drawR(true); }
  else if (act === 'rcheck') checkR();
  else if (act === 'rsol') { R.ansDone = 'sol'; finishR(); }
  else if (act === 'rlist') renderRList();
  else if (act === 'ragain') startR(R.it);
});
$('rBody').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'rAns') { e.preventDefault(); checkR(); } });
function startR(it){
  if (!it) return;
  Object.assign(R, { it, step: 0, chosen: null, res: [], phase: 'choose', ansDone: false, order: shuffle([0, 1, 2, 3]) });
  clockStart(); drawR(false); window.scrollTo({ top: 0 });
}
function drawR(scroll){
  const it = R.it, n = it.steps.length, k = Math.min(R.step, n);
  const no = rItems().indexOf(it) + 1;
  let h = `<div class="actions" style="margin-bottom:10px"><button class="btn small" data-act="rlist">← Все задачи</button></div>`;
  h += `<div class="card"><div class="kind"><span class="lbl">Разбор №18 · задача ${no}</span>${it.src === 'sem' ? '<span class="src">с семинара</span>' : ''}</div>`;
  if (it.fig) h += `<div class="sheet">${renderFig(it.fig)}</div>`;
  h += `<div class="qt">${fmt(it.q)}</div><div class="zone" id="rzone">`;
  h += `<div class="dots" aria-hidden="true">${it.steps.map((s, i) => `<i class="${i < R.res.length ? (R.res[i] ? 'ok' : 'bad') : i === k && k < n ? 'cur' : ''}"></i>`).join('')}</div>`;
  if (k < n) {
    const s = it.steps[k];
    h += `<div class="partlbl"><span class="lbl">Шаг ${k + 1} из ${n} · пункт ${s.part})</span></div><p class="rsq">${fmt(s.q)}</p>`;
    const done = R.phase === 'done';
    h += `<div class="opts">` + R.order.map((oi, j) => {
      let cls = 'opt';
      if (done) { if (oi === s.correct) cls += ' right'; else if (oi === R.chosen) cls += ' wrong'; else cls += ' dim'; }
      return `<button class="${cls}" data-oi="${oi}"${done ? ' disabled' : ''}><span class="k">${j + 1}</span><span>${fmt(s.opts[oi])}</span></button>`;
    }).join('') + `</div>`;
    if (done) {
      const ok = R.chosen === s.correct;
      h += `<div class="verdict ${ok ? 'ok' : 'bad'}">${ok ? 'Верный ход' : 'Не тот ход'}</div>` + (s.why ? `<p class="why">${fmt(s.why)}</p>` : '') +
        `<button class="btn primary next" data-act="rnext">${k + 1 < n ? 'Следующий шаг' : 'К ответу пункта б)'}</button>`;
    }
  } else if (!R.ansDone) {
    h += `<div class="lbl">Ответ к пункту б)</div><div class="ansrow"><input id="rAns" inputmode="decimal" autocomplete="off" placeholder="ответ" aria-label="Ответ к пункту б"><button class="btn primary" data-act="rcheck">Проверить</button></div>` +
      `<div class="nfb bad" id="rfb" hidden></div><div class="actions"><button class="btn small" data-act="rsol">Показать решение</button></div>`;
  } else {

      `<p class="note">Верных ходов с первого раза: <b>${okSteps} из ${n}</b>.</p>` +
      `<div class="plan"><span class="lbl">План решения</span><ol>${it.steps.map((s, i) => `<li class="${R.res[i] ? '' : 'miss'}"><b>${s.part})</b> ${fmt(s.opts[s.correct])}</li>`).join('')}</ol></div>` +
      (it.sol ? `<div class="sol"><b>Ответ б).</b> ${fmt(it.sol)}</div>` : '') + trigHTML(it) +
      `<div class="actions"><button class="btn primary" data-act="rlist">К списку задач</button><button class="btn" data-act="ragain">Пройти ещё раз</button></div>`;
  }

}
function chooseR(oi){
  if (R.phase !== 'choose' || R.step >= R.it.steps.length) return;
  const s = R.it.steps[R.step], ok = oi === s.correct, sec = clockStop();
  R.chosen = oi; R.phase = 'done'; R.res.push(ok);
  const ty = S.typ.r || (S.typ.r = [0, 0]); ty[0]++; if (ok) ty[1]++;
  for (const t of R.it.topics) { const a = S.top[t] || (S.top[t] = [0, 0]); a[0]++; if (ok) a[1]++; }
  S.tot.ans++; if (ok) S.tot.ok++;
  bumpDay(ok, sec, null); commit();
  drawR(false);
  const v = $('rzone').querySelector('.verdict'); if (v) v.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

function checkR(){
  const inp = $('rAns'); if (!inp) return;

}
function finishR(){
  const it = R.it, okSteps = R.res.filter(Boolean).length, n = it.steps.length, prev = S.r18[it.id];
  const ansOk = R.ansDone === 'ok' ? 1 : 0;
  const better = !prev || okSteps + ansOk > prev[0] + prev[2];
  S.r18[it.id] = better ? [okSteps, n, ansOk, (prev ? prev[3] : 0) + 1, Date.now()] : [prev[0], prev[1], prev[2], prev[3] + 1, Date.now()];
  commit(); drawR(true);
}

const openTopics = new Set();

  h += `<h3 class="sec-h">По видам заданий</h3><div class="box">${['p', 'f', 'b', 'r'].map(k => { const v = S.typ[k] || [0, 0], p = v[0] ? Math.round(v[1] / v[0] * 100) : null;
    return `<div class="srow"><span class="t">${tname[k]}<small>${v[0]} ${plural(v[0], 'ответ', 'ответа', 'ответов')}</small></span><span class="pct">${p === null ? '—' : p + '%'}</span>` +
      `<span class="meter"><i class="${p !== null && p < 60 ? 'low' : ''}" style="width:${p || 0}%"></i></span></div>`; }).join('')}` +
    `<div class="srow"><span class="t">Вычисления до ответа<small>решено ${tot.numOk} без подсказок из ${tot.num}</small></span><span class="pct">${tot.num ? Math.round(tot.numOk / tot.num * 100) + '%' : '—'}</span></div>` +
    `<div class="srow"><span class="t">Подсказок к ходу<small>чем меньше, тем лучше</small></span><span class="pct">${tot.hints}</span></div></div>`;
  // settings
  h += `<h3 class="sec-h">Настройки</h3><div class="box">` +
    `<div class="setrow"><span>Цель на день</span><span class="seg" role="group" aria-label="Цель на день">${[10, 15, 20, 30].map(n => `<button data-goal="${n}" aria-pressed="${S.set.goal === n}">${n}</button>`).join('')}</span></div>` +
    `<div class="setrow"><span>Варианты хода</span><span class="seg" role="group" aria-label="Варианты хода"><button data-hide="1" aria-pressed="${S.set.hide}">сначала скрыты</button><button data-hide="0" aria-pressed="${!S.set.hide}">сразу</button></span></div>` +
    `<div class="setrow"><span>В тренажёре</span><span class="note">${drillItems().length} заданий и ${rItems().length} разборов №18${EXTRA ? ` · с семинара: ${EXTRA}` : ''}</span></div></div>` +
    `<p class="note">Застрял на задаче на семинаре? Пришли её фото в чат — я разложу её на шаги и добавлю сюда с пометкой «с семинара».</p>`;
  $('statsBody').innerHTML = h;
  setSync();
}
$('statsBody').addEventListener('click', e => {
  const g = e.target.closest('[data-goal]'); if (g) { S.set.goal = +g.dataset.goal; commit(); renderStats(); return; }
  const hd = e.target.closest('[data-hide]'); if (hd) { S.set.hide = hd.dataset.hide === '1'; commit(); renderStats(); return; }
  const tr = e.target.closest('[data-train]'); if (tr) { const t = +tr.dataset.train; startSession({ topic: t }, 'Тема: ' + TOPICS[t]); }
});
$('resetBox').addEventListener('click', e => {
  if (e.target.closest('#reset')) {
    $('resetBox').innerHTML = `<div class="confirm"><p>Удалить всю статистику, повторения и список ошибок?</p>` +
      `<button class="btn small danger" id="resetYes">Да, сбросить</button><button class="btn small" id="resetNo">Отмена</button></div>`;
  } else if (e.target.closest('#resetYes')) { const keep = S.set; S = blank(); S.set = keep; commit(); renderStats(); restoreReset(); }
  else if (e.target.closest('#resetNo')) restoreReset();
});
function restoreReset(){ $('resetBox').innerHTML = '<button class="btn small danger" id="reset">Сбросить прогресс</button>'; }

/* ================= boot ================= */
renderBadges(); setSync(); renderStart();
try { const t = localStorage.getItem(LS_KEY + '-tab'); if (t && t !== 'ser' && $('t-' + t)) showTab(t); } catch (e) {}
initCloud();
</script>

</body></html>
