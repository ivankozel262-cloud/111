△ABC, MN : BC = AM : AB","MN : BC = AM : MB","MN — средняя линия, поэтому BC/2","Теорема о биссектрисе"],"correct":0,"nudge":"Коэффициент подобия — это AM к AB или AM к MB?","why":"△AMN ~ △ABC с k = AM/AB = 2/5, поэтому MN = 15·2/5. Отношение AM : MB = 2 : 3 по Фалесу переносится на AN : NC, но не на MN : BC.","hints":["AM : AB = 2 : 5."],"ans":6,"sol":"MN = 6.","see":"Прямая, параллельная стороне треугольника","think":"отсекает подобный треугольник: k = AM/AB (отсчёт от вершины!)"},{"id":"t47","type":"p","topics":[25],"q":"На стороне AB треугольника ABC взята точка D так, что ∠ACD = ∠ABC. AC = 6, AB = 9. Найдите AD.","fig":{"pts":{"A":[0.0,0.0],"B":[9.0,0.0],"C":[3.857,4.596],"D":[4.0,0.0]},"seg":[["A","B"],["B","C"],["C","A"],["C","D"]],"ang":[["A","C","D",1],["A","B","C",1]],"val":[["A","C","6"],["A","B","9"]],"lp":{"D":"s"}},"opts":["△ACD ~ △ABC (общий угол A и ∠ACD = ∠B) ⇒ AC² = AD·AB","CD — биссектриса, теорема о биссектрисе","Средняя линия","Теорема косинусов"],"correct":0,"nudge":"У треугольников ACD и ABC есть общий угол. Есть ли ещё пара равных углов?","why":"∠A общий и ∠ACD = ∠ABC, поэтому △ACD ~ △ABC (A↔A, C↔B, D↔C) и AC/AB = AD/AC.","hints":["AD = AC²/AB."],"ans":4,"sol":"AD = 36/9 = 4.","see":"Угол при отрезке из вершины равен углу треугольника","think":"общий угол + ещё один ⇒ подобие, AC² = AD·AB"},{"id":"t48","type":"p","topics":[25],"q":"Продолжения боковых сторон AB и CD трапеции ABCD (AD ∥ BC) пересекаются в точке P. BC = 4, AD = 10, PB = 6. Найдите AB.","fig":{"pts":{"A":[-9.0,-12.0],"B":[-3.6,-4.8],"C":[0.4,-4.8],"D":[1.0,-12.0],"P":[0.0,0.0]},"seg":[["A","B"],["B","C"],["C","D"],["D","A"]],"dash":[["B","P"],["C","P"]],"val":[["A","D","10"],["B","C","4"],["P","B","6"]],"lp":{"P":"n"}},"opts":["△PBC ~ △PAD с k = BC/AD","Средняя линия трапеции","PB : BA = BC : AD","Отрезки касательных"],"correct":0,"nudge":"Какие треугольники с вершиной P подобны? Отношение каких отрезков равно 4 : 10?","why":"PB : PA = BC : AD = 2 : 5, поэтому PA = 15 и AB = PA − PB. Отношение BC : AD — это PB : PA, а не PB : BA.","hints":["PA = 6·10/4."],"ans":9,"sol":"AB = 15 − 6 = 9.","see":"Продолжения боковых сторон трапеции","think":"△PBC ~ △PAD, k = b/a (отрезки считай от P!)"},{"id":"t49","type":"p","topics":[26],"q":"В треугольнике ABC AM — медиана, точка K лежит на стороне AC, AK : KC = 1 : 2. Отрезки BK и AM пересекаются в точке P. Найдите отношение BP : PK.","fig":{"pts":{"A":[0.0,0.0],"B":[1.0,2.6],"C":[3.6,0.0],"M":[2.3,1.3],"K":[1.2,0.0],"P":[1.15,0.65]},"seg":[["A","B"],["B","C"],["C","A"],["A","M"],["B","K"]],"tick":[["B","M",1],["M","C",1]],"val":[["A","K","x"],["K","C","2x"]],"lp":{"P":"nw","K":"s"}},"opts":["Теорема Менелая (или прямая через M параллельно BK)","P делит BK пополам","BP : PK = 2 : 1, как у медиан","Теорема о биссектрисе"],"correct":0,"nudge":"Выбери треугольник, у которого BK — сторона, а прямая AM — секущая. Например, △BCK.","why":"Менелай для △BCK и прямой A–P–M: (BM/MC)·(CA/AK)·(KP/PB) = 1, то есть 1·3·(KP/PB) = 1, и BP : PK = 3.","hints":["BM : MC = 1, CA : AK = 3."],"ans":3,"sol":"BP : PK = 3.","see":"Две чевианы пересекаются, нужно отношение","think":"Менелай для треугольника, где искомый отрезок — сторона; или параллельная прямая"},{"id":"t50","type":"p","topics":[26],"q":"На стороне BC треугольника ABC взята точка M, BM : MC = 3 : 1, K — середина AB. Отрезки AM и CK пересекаются в точке P. Найдите отношение AP : PM.","fig":{"pts":{"A":[2.0,6.0],"B":[0.0,0.0],"C":[8.0,0.0],"M":[6.0,0.0],"K":[1.0,3.0],"P":[5.2,1.2]},"seg":[["A","B"],["B","C"],["C","A"],["A","M"],["C","K"]],"tick":[["A","K",1],["K","B",1]],"val":[["B","M","3x"],["M","C","x"]],"lp":{"P":"ne","M":"s"}},"opts":["Менелай для △ABM и прямой KC","AP : PM = BM : MC = 3","P — середина AM","Теорема о биссектрисе"],"correct":0,"nudge":"Искомый отрезок AM — сторона △ABM. Через какие точки на его сторонах (или их продолжениях) проходит прямая CK?","why":"(AK/KB)·(BC/CM)·(MP/PA) = 1, то есть 1·4·(MP/PA) = 1, и AP : PM = 4.","hints":["BC : CM = 4 : 1."],"ans":4,"sol":"AP : PM = 4.","see":"Две чевианы пересекаются, нужно отношение","think":"Менелай для треугольника, где искомый отрезок — сторона; или параллельная прямая"},{"id":"t51","type":"p","topics":[27],"q":"Площадь треугольника ABC равна 30. На сторонах AB и AC взяты точки K и L: AK : KB = 1 : 2, AL : LC = 3 : 2. Найдите площадь треугольника AKL.","fig":{"pts":{"A":[0.0,0.0],"B":[9.0,0.0],"C":[3.0,6.0],"K":[3.0,0.0],"L":[1.8,3.6]},"seg":[["A","B"],["B","C"],["C","A"],["K","L"]],"val":[["A","K","x"],["K","B","2x"],["A","L","3y"],["L","C","2y"]],"lp":{"K":"s","L":"nw"}},"opts":["Общий угол: S₁ : S₂ = (AK·AL) : (AB·AC)","Подобие: S₁ : S₂ = k²","Общая высота: S₁ : S₂ = AK : AB","Медиана делит площадь пополам"],"correct":0,"nudge":"Треугольники AKL и ABC не подобны, но у них общий угол A. Как выглядит площадь через этот угол?","why":"S = ½·AK·AL·sin A, поэтому S_{AKL}/S_{ABC} = (1/3)·(3/5) = 1/5.","hints":["AK/AB = 1/3, AL/AC = 3/5."],"ans":6,"sol":"S = 30/5 = 6.","see":"Треугольник с общим углом внутри большого","think":"S₁/S₂ = отношение произведений сторон при общем угле"},{"id":"t52","type":"p","topics":[27],"q":"Площадь параллелограмма ABCD равна 40. Точка M лежит на стороне BC. Найдите сумму площадей треугольников ABM и CDM.","fig":{"pts":{"A":[0.0,0.0],"B":[2.0,5.0],"C":[10.0,5.0],"D":[8.0,0.0],"M":[5.0,5.0]},"seg":[["A","B"],["B","C"],["C","D"],["D","A"],["A","M"],["D","M"]],"lp":{"M":"n"}},"opts":["△AMD: основание AD и высота параллелограмма ⇒ S_{AMD} = ½S","Ответ зависит от положения M — данных не хватает","Медиана делит площадь пополам","S_{ABM} = S_{CDM}"],"correct":0,"nudge":"Посмотри на треугольник AMD: какое у него основание и какая высота?","why":"S_{AMD} = ½·AD·h = ½S = 20, поэтому S_{ABM} + S_{CDM} = 40 − 20 при любом положении M.","hints":["S_{AMD} = 20."],"ans":20,"sol":"20.","see":"Точка на стороне параллелограмма","think":"треугольник с основанием-стороной и вершиной на противоположной стороне = ½S"},{"id":"t53","type":"p","topics":[28],"q":"Окружность, вписанная в треугольник ABC, касается стороны AB в точке K. AB = 8, BC = 9, AC = 7. Найдите AK.","fig":{"pts":{"A":[0.0,0.0],"B":[8.0,0.0],"C":[2.0,6.708],"K":[3.0,0.0],"I":[3.0,2.236]},"seg":[["A","B"],["B","C"],["C","A"]],"circ":[{"c":[3.0,2.236],"r":2.236}],"val":[["A","B","8"],["B","C","9"],["A","C","7"]],"hide":["I"],"lp":{"K":"s"}},"opts":["Отрезки касательных: AK = p − BC","AK = AB/2","Теорема о биссектрисе: AK : KB = AC : BC","AK = p − AC"],"correct":0,"nudge":"Обозначь отрезки касательных из вершин x, y, z. Какие их суммы равны сторонам?","why":"x + y = 8, y + z = 9, x + z = 7, откуда x = (8 + 7 − 9)/2 = 3 = p − BC. Точка касания — не основание биссектрисы!","hints":["p = 12.","AK = p − BC."],"ans":3,"sol":"AK = 3.","see":"Точки касания вписанной окружности","think":"отрезки касательных («калитки»): от вершины A — p − a"},{"id":"t54","type":"p","topics":[28],"q":"В треугольнике ABC AB = 6, BC = 8, AC = 10. Вписанная окружность касается BC в точке M, а вневписанная окружность, касающаяся стороны BC, — в точке N. Найдите MN.","fig":{"pts":{"A":[0.0,6.0],"B":[0.0,0.0],"C":[8.0,0.0],"M":[2.0,0.0],"N":[6.0,0.0],"I":[2.0,2.0],"J":[6.0,-6.0],"E":[0.0,-6.0],"F":[12.0,-3.0]},"seg":[["A","B"],["B","C"],["C","A"]],"dash":[["B","E"],["C","F"]],"circ":[{"c":[2.0,2.0],"r":2.0},{"c":[6.0,-6.0],"r":6.0}],"val":[["A","B","6"],["A","C","10"]],"hide":["I","J","E","F"],"lp":{"M":"n","N":"n"}},"opts":["BM = p − AC и BN = p − AB ⇒ MN = |AB − AC|","M и N совпадают","MN = r","Теорема о биссектрисе"],"correct":0,"nudge":"Найди BM для вписанной окружности и BN для вневписанной — через полупериметр.","why":"p = 12. BM = p − AC = 2, BN = p − AB = 6, поэтому MN = 4 = |AC − AB|. Точки касания симметричны относительно середины BC.","hints":["BM = 2.","BN = 6."],"ans":4,"sol":"MN = 4.","see":"Вписанная и вневписанная окружности касаются одной стороны","think":"точки касания симметричны относительно середины стороны, MN = |b − c|"},{"id":"t55","type":"p","topics":[29],"q":"Катеты прямоугольного треугольника равны 6 и 8. Найдите радиус вневписанной окружности, касающейся гипотенузы.","fig":{"pts":{"A":[0.0,6.0],"B":[8.0,0.0],"C":[0.0,0.0],"J":[12.0,12.0],"E":[0.0,12.0],"F":[12.0,0.0]},"seg":[["A","B"],["B","C"],["C","A"]],"dash":[["A","E"],["B","F"]],"circ":[{"c":[12.0,12.0],"r":12.0}],"ra":[["A","C","B"]],"val":[["C","A","6"],["C","B","8"]],"hide":["J","E","F"]},"opts":["r_c = S/(p − c)","r = (a + b − c)/2","R = c/2","r_c = S/p"],"correct":0,"nudge":"Формула вневписанного радиуса похожа на r = S/p. Что меняется в знаменателе?","why":"S = 24, p = 12, c = 10: r_c = 24/(12 − 10) = 12. Для гипотенузы всегда r_c = p.","hints":["p − c = 2."],"ans":12,"sol":"r_c = 12.","see":"Вневписанная окружность","think":"r_a = S/(p − a); центр — на биссектрисе угла A и внешних биссектрисах"},{"id":"t56","type":"p","topics":[30],"q":"В остроугольном треугольнике ABC cos A = 0,8, радиус описанной окружности равен 5, H — точка пересечения высот. Найдите AH.","fig":{"pts":{"A":[0.273,4.993],"B":[-3.0,-4.0],"C":[3.0,-4.0],"H":[0.273,-3.007],"O":[0.0,0.0],"A_1":[0.273,-4.0],"B_1":[2.495,-2.334]},"seg":[["A","B"],["B","C"],["C","A"],["A","A_1"],["B","B_1"]],"circ":[{"c":[0.0,0.0],"r":5.0}],"ra":[["C","A_1","A"],["C","B_1","B"]],"hide":["A_1","B_1"],"lp":{"H":"e","O":"w"}},"opts":["AH = 2R·cos A (вдвое больше расстояния от O до BC)","AH = ⅔ высоты","AH = R","AH = 2R·sin A"],"correct":0,"nudge":"Есть формула, связывающая AH с R и углом A. Через какую функцию угла — sin или cos?","why":"AH = 2·OM, где OM — расстояние от центра O до BC. Центральный угол BOC = 2A, поэтому OM = R·cos A. AH = 2·5·0,8.","hints":["OM = R·cos A = 4."],"ans":8,"sol":"AH = 8.","see":"Ортоцентр и описанная окружность","think":"AH = 2R|cos A| = 2·(расстояние от O до BC)"},{"id":"t57","type":"p","topics":[30,19,21],"q":"В остроугольном треугольнике ABC высоты AA_1 и BB_1 пересекаются в точке H. AH = 2, HA_1 = 4, BH = 5. Найдите HB_1.","fig":{"pts":{"A":[0.0,6.0],"B":[-3.0,0.0],"C":[8.0,0.0],"H":[0.0,4.0],"A_1":[0.0,0.0],"B_1":[0.96,5.28]},"seg":[["A","B"],["B","C"],["C","A"],["A","A_1"],["B","B_1"]],"ra":[["C","A_1","A"],["C","B_1","B"]],"val":[["A","H","2"],["H","A_1","4"],["B","H","5"]],"lp":{"H":"e","A_1":"s"}},"opts":["A, B, A_1, B_1 на одной окружности ⇒ для хорд AA_1 и BB_1: AH·HA_1 = BH·HB_1","AH : HA_1 = BH : HB_1","H делит высоты 2 : 1","Теорема о биссектрисе"],"correct":0,"nudge":"Точки A, B, A_1, B_1 лежат на одной окружности (почему?). Тогда AA_1 и BB_1 — её хорды, и они пересекаются в H.","why":"∠AA_1B = ∠AB_1B = 90°, поэтому A, B, A_1, B_1 лежат на окружности с диаметром AB. Для пересекающихся хорд AH·HA_1 = BH·HB_1, то есть 8 = 5·HB_1.","hints":["AH·HA_1 = 8."],"ans":1.6,"sol":"HB_1 = 1,6.","see":"Ортоцентр и отрезки высот","think":"вписанность ABA_1B_1 ⇒ степень точки H: AH·HA_1 = BH·HB_1"},{"id":"f01","type":"f","topics":[8],"q":"CL — биссектриса треугольника ABC (L лежит на AB).","stmts":[{"t":"AL : LB = AC : BC","ok":true,"why":"Теорема о биссектрисе: отношение прилежащих сторон."},{"t":"AL = LB","ok":false,"why":"Так делит сторону медиана, а не биссектриса."},{"t":"∠ACL = ∠LCB","ok":true,"why":"Это определение биссектрисы."},{"t":"CL ⊥ AB","ok":false,"why":"Перпендикулярна только высота; биссектриса совпадает с ней лишь в равнобедренном треугольнике с основанием AB."},{"t":"Центр вписанной окружности лежит на CL","ok":true,"why":"Он лежит на всех трёх биссектрисах."}],"see":"Биссектриса треугольника","think":"равные углы, AL : LB = AC : BC, центр I на ней, продление — середина дуги (трезубец)"},{"id":"f02","type":"f","topics":[1],"q":"ABCD — параллелограмм, биссектриса угла A пересекает сторону BC в точке K.","stmts":[{"t":"AB = BK","ok":true,"why":"△ABK равнобедренный: ∠BKA = ∠KAD = ∠BAK."},{"t":"∠BKA = ∠KAD","ok":true,"why":"Накрест лежащие углы при BC ∥ AD."},{"t":"BK : KC = AB : AD","ok":false,"why":"Теорема о биссектрисе — про треугольник; здесь BK = AB, а KC = AD − AB."},{"t":"AK = KD","ok":false,"why":"В общем случае нет."},{"t":"△ABK равнобедренный","ok":true,"why":"Углы при основании AK равны."}],"see":"Биссектриса угла параллелограмма","think":"накрест лежащие углы ⇒ равнобедренный треугольник"},{"id":"f03","type":"f","topics":[7,9],"q":"AM — медиана треугольника ABC.","stmts":[{"t":"BM = MC","ok":true,"why":"Определение медианы."},{"t":"S_{ABM} = S_{AMC}","ok":true,"why":"Равные основания и общая высота."},{"t":"∠BAM = ∠MAC","ok":false,"why":"Так делит угол биссектриса."},{"t":"Если продлить AM за M на её длину, получится параллелограмм","ok":true,"why":"Диагонали ABDC делятся пополам — это удвоение медианы."},{"t":"AM ⊥ BC","ok":false,"why":"Только в равнобедренном треугольнике с AB = AC."}],"see":"Медиана","think":"делит сторону и площадь пополам; удвой её → параллелограмм"},{"id":"f04","type":"f","topics":[30,21],"q":"AA_1 и BB_1 — высоты остроугольного треугольника ABC.","stmts":[{"t":"A, B, A_1, B_1 лежат на окружности с диаметром AB","ok":true,"why":"Из A_1 и B_1 отрезок AB виден под 90°."},{"t":"△A_1B_1C ~ △ABC","ok":true,"why":"Коэффициент подобия равен cos C."},{"t":"A_1B_1 ∥ AB","ok":false,"why":"В общем случае нет: A_1B_1 «антипараллельна» AB."},{"t":"∠CA_1B_1 = ∠CAB","ok":true,"why":"Внешний угол вписанного четырёхугольника ABA_1B_1 равен противолежащему внутреннему."},{"t":"A_1B_1 = AB/2","ok":false,"why":"A_1B_1 = AB·cos C; половина — только при ∠C = 60°."}],"see":"Две высоты треугольника","think":"окружность на стороне как на диаметре; подобие с k = cos C; ∠AHB = 180° − ∠C"},{"id":"f05","type":"f","topics":[3],"q":"В треугольнике ABC ∠C = 90°, CH — высота.","stmts":[{"t":"△ACH ~ △CBH ~ △ABC","ok":true,"why":"У каждого есть прямой угол и общий острый угол."},{"t":"CH² = AH·HB","ok":true,"why":"Из подобия △ACH и △CBH."},{"t":"CH = AB/2","ok":false,"why":"Половине гипотенузы равна медиана, а не высота."},{"t":"∠ACH = ∠B","ok":true,"why":"Оба дополняют ∠A до 90°."},{"t":"AH = HB","ok":false,"why":"Только в равнобедренном прямоугольном треугольнике."}],"see":"Высота из прямого угла","think":"три подобных треугольника: h² = a_c·b_c, a² = c·a_c"},{"id":"f06","type":"f","topics":[4,15],"q":"В треугольнике ABC ∠C = 90°, M — середина гипотенузы AB.","stmts":[{"t":"CM = AM = BM","ok":true,"why":"Медиана к гипотенузе равна её половине."},{"t":"M — центр описанной окружности","ok":true,"why":"Гипотенуза — диаметр."},{"t":"CM ⊥ AB","ok":false,"why":"Перпендикулярна высота, а не медиана."},{"t":"∠MCB = ∠B","ok":true,"why":"△MCB равнобедренный (MC = MB)."},{"t":"CM — биссектриса угла C","ok":false,"why":"Только в равнобедренном прямоугольном треугольнике."}],"see":"Середина гипотенузы","think":"центр описанной окружности; два равнобедренных треугольника"},{"id":"f07","type":"f","topics":[7,24],"q":"M и N — середины сторон AB и AC треугольника ABC.","stmts":[{"t":"MN ∥ BC","ok":true,"why":"Средняя линия параллельна третьей стороне."},{"t":"MN = BC/2","ok":true,"why":"И равна её половине."},{"t":"S_{AMN} = ¼·S_{ABC}","ok":true,"why":"Подобие с k = ½, площади — k²."},{"t":"S_{AMN} = ½·S_{ABC}","ok":false,"why":"Площадь уменьшается в k² = 4 раза."},{"t":"MN ⊥ AC","ok":false,"why":"Ниоткуда не следует."}],"see":"Две середины сторон треугольника","think":"средняя линия: ∥ стороне, равна её половине, отсекает ¼ площади"},{"id":"f08","type":"f","topics":[10,25,27],"q":"ABCD — трапеция с основаниями AD и BC, O — точка пересечения диагоналей.","stmts":[{"t":"△BOC ~ △DOA","ok":true,"why":"Накрест лежащие углы при BC ∥ AD и вертикальные углы."},{"t":"S_{AOB} = S_{COD}","ok":true,"why":"△ABD и △ACD равновелики, а △AOD у них общий."},{"t":"AO = OC","ok":false,"why":"Диагонали трапеции не делятся пополам (это свойство параллелограмма)."},{"t":"BO : OD = BC : AD","ok":true,"why":"Из подобия △BOC и △DOA."},{"t":"△AOB ~ △COD","ok":false,"why":"Они равновелики, но в общем случае не подобны."}],"see":"Диагонали трапеции","think":"треугольники при основаниях подобны, при боковых сторонах равновелики"},{"id":"f09","type":"f","topics":[16,6],"q":"Трапеция ABCD вписана в окружность.","stmts":[{"t":"Трапеция равнобедренная","ok":true,"why":"Около трапеции можно описать окружность только тогда."},{"t":"Её диагонали равны","ok":true,"why":"Свойство равнобедренной трапеции."},{"t":"В неё можно вписать окружность","ok":false,"why":"Для этого нужно a + b = 2c, это отдельное условие."},{"t":"Сумма противоположных углов равна 180°","ok":true,"why":"Свойство любого вписанного четырёхугольника."},{"t":"Её диагонали перпендикулярны","ok":false,"why":"В общем случае нет."}],"see":"Вписанная трапеция","think":"равнобедренная: равные диагонали и углы при основании; центр на оси симметрии"},{"id":"f10","type":"f","topics":[14,21],"q":"В четырёхугольник ABCD вписана окружность.","stmts":[{"t":"AB + CD = BC + AD","ok":true,"why":"Из равенства отрезков касательных."},{"t":"Центр окружности — точка пересечения биссектрис углов ABCD","ok":true,"why":"Центр равноудалён от всех сторон."},{"t":"∠A + ∠C = 180°","ok":false,"why":"Это признак вписанного четырёхугольника, а не описанного."},{"t":"S = pr (p — полупериметр)","ok":true,"why":"Как у треугольника: разрежь на треугольники с вершиной в центре."},{"t":"Диагонали делятся пополам","ok":false,"why":"Ниоткуда не следует."}],"see":"В четырёхугольник вписана окружность","think":"a + c = b + d; центр — на биссектрисах углов; S = pr"},{"id":"f11","type":"f","topics":[19,17,18],"q":"Прямая PA касается окружности с центром O в точке A.","stmts":[{"t":"OA ⊥ PA","ok":true,"why":"Касательная перпендикулярна радиусу в точке касания."},{"t":"PA² = PO² − OA²","ok":true,"why":"Теорема Пифагора в прямоугольном △PAO."},{"t":"PA = OA","ok":false,"why":"В общем случае нет."},{"t":"Угол между PA и хордой AB равен половине дуги AB, лежащей внутри угла","ok":true,"why":"Теорема об угле между касательной и хордой."},{"t":"PO — биссектриса угла OAP","ok":false,"why":"PO проходит через вершину P, а не A; биссектрисой угла APB она будет при двух касательных."}],"see":"Касательная к окружности","think":"радиус в точку касания ⊥ касательной; угол с хордой = ½ дуги"},{"id":"f12","type":"f","topics":[17,19],"q":"PA и PB — касательные к окружности с центром O (A и B — точки касания).","stmts":[{"t":"PA = PB","ok":true,"why":"Отрезки касательных из одной точки равны."},{"t":"PO ⊥ AB и делит AB пополам","ok":true,"why":"PAOB — дельтоид, PO — его ось симметрии."},{"t":"∠APB + ∠AOB = 180°","ok":true,"why":"В PAOB два прямых угла."},{"t":"∠APB = ∠AOB","ok":false,"why":"Они в сумме дают 180°."},{"t":"AB = PO","ok":false,"why":"В общем случае нет."}],"see":"Две касательные из одной точки","think":"дельтоид PAOB: PA = PB, PO ⊥ AB, ∠P + ∠AOB = 180°"},{"id":"f13","type":"f","topics":[20],"q":"Окружности с центрами O_1 и O_2 касаются внешним образом в точке K.","stmts":[{"t":"O_1, K, O_2 лежат на одной прямой","ok":true,"why":"Точка касания лежит на линии центров."},{"t":"O_1O_2 = R + r","ok":true,"why":"При внешнем касании."},{"t":"Общая касательная в точке K перпендикулярна O_1O_2","ok":true,"why":"Она перпендикулярна обоим радиусам O_1K и O_2K."},{"t":"O_1O_2 = R − r","ok":false,"why":"Так при внутреннем касании."},{"t":"Радиусы окружностей равны","ok":false,"why":"Ниоткуда не следует."}],"see":"Касающиеся окружности","think":"точка касания на линии центров; d = R ± r; общая касательная ⊥ линии центров"},{"id":"f14","type":"f","topics":[21,18],"q":"Четырёхугольник ABCD вписан в окружность.","stmts":[{"t":"∠A + ∠C = 180°","ok":true,"why":"Свойство вписанного четырёхугольника."},{"t":"∠ABD = ∠ACD","ok":true,"why":"Вписанные углы опираются на одну дугу AD."},{"t":"AB + CD = BC + AD","ok":false,"why":"Это свойство описанного четырёхугольника."},{"t":"AC·BD = AB·CD + BC·AD","ok":true,"why":"Теорема Птолемея."},{"t":"Диагонали перпендикулярны","ok":false,"why":"В общем случае нет."}],"see":"Вписанный четырёхугольник","think":"∠A + ∠C = 180°, равные вписанные углы на одну дугу, Птолемей"},{"id":"f15","type":"f","topics":[18,15],"q":"AB — диаметр окружности, C — точка окружности.","stmts":[{"t":"∠ACB = 90°","ok":true,"why":"Вписанный угол, опирающийся на диаметр."},{"t":"Центр окружности — середина AB","ok":true,"why":"Середина диаметра."},{"t":"AC = BC","ok":false,"why":"Только если C — середина полуокружности."},{"t":"Медиана из C в △ABC равна AB/2","ok":true,"why":"Это радиус."},{"t":"∠CAB = 45°","ok":false,"why":"Только при AC = BC."}],"see":"Диаметр и точка на окружности","think":"прямой угол; центр — середина гипотенузы"},{"id":"f16","type":"f","topics":[19,18],"q":"Хорды AB и CD пересекаются в точке P.","stmts":[{"t":"AP·PB = CP·PD","ok":true,"why":"Свойство пересекающихся хорд."},{"t":"△APC ~ △DPB","ok":true,"why":"Вертикальные углы и вписанные углы на одну дугу."},{"t":"AP : PB = CP : PD","ok":false,"why":"Равны произведения, а не отношения."},{"t":"∠APC равен полусумме дуг AC и BD","ok":true,"why":"Угол между хордами."},{"t":"AP = PD","ok":false,"why":"В общем случае нет."}],"see":"Две пересекающиеся хорды","think":"AP·PB = CP·PD; угол = полусумма дуг"},{"id":"f17","type":"f","topics":[0,2],"q":"В треугольнике ABC AB = BC.","stmts":[{"t":"∠A = ∠C","ok":true,"why":"Углы при основании равнобедренного треугольника."},{"t":"Медиана из B — биссектриса и высота","ok":true,"why":"Свойство равнобедренного треугольника."},{"t":"Центр описанной окружности лежит на высоте из B","ok":true,"why":"Эта высота — серединный перпендикуляр к AC."},{"t":"∠B = 60°","ok":false,"why":"Это был бы правильный треугольник."},{"t":"Медиана из A — высота","ok":false,"why":"Только если треугольник правильный."}],"see":"Равнобедренный треугольник","think":"углы при основании равны; медиана = биссектриса = высота к основанию"},{"id":"f18","type":"f","topics":[24,25],"q":"Прямая MN параллельна стороне BC треугольника ABC, M лежит на AB, N — на AC.","stmts":[{"t":"△AMN ~ △ABC","ok":true,"why":"Соответственные углы при MN ∥ BC."},{"t":"AM : MB = AN : NC","ok":true,"why":"Обобщённая теорема Фалеса."},{"t":"MN : BC = AM : MB","ok":false,"why":"MN : BC = AM : AB — отсчитывай от вершины."},{"t":"MN : BC = AM : AB","ok":true,"why":"Коэффициент подобия."},{"t":"MN = BC/2","ok":false,"why":"Только если M — середина AB."}],"see":"Прямая, параллельная стороне треугольника","think":"подобный треугольник с k = AM/AB; Фалес: AM : MB = AN : NC"},{"id":"f19","type":"f","topics":[25],"q":"Точка D лежит на стороне AB треугольника ABC, ∠ACD = ∠ABC.","stmts":[{"t":"△ACD ~ △ABC","ok":true,"why":"Общий угол A и ещё пара равных углов."},{"t":"AC² = AD·AB","ok":true,"why":"Из подобия: AC/AB = AD/AC."},{"t":"CD — биссектриса угла C","ok":false,"why":"Ниоткуда не следует."},{"t":"AC касается окружности, описанной около △BCD","ok":true,"why":"Угол между AC и хордой CD равен вписанному углу CBD — это признак касательной (и AC² = AD·AB — степень точки A)."},{"t":"CD ⊥ AB","ok":false,"why":"В общем случае нет."}],"see":"Угол при отрезке из вершины равен углу треугольника","think":"подобие по общему углу; AC² = AD·AB"},{"id":"f20","type":"f","topics":[28,14],"q":"Вписанная окружность треугольника ABC (центр I) касается сторон AB, BC, CA в точках C_1, A_1, B_1.","stmts":[{"t":"AC_1 = AB_1 = p − BC","ok":true,"why":"Отрезки касательных."},{"t":"IA_1 ⊥ BC","ok":true,"why":"Радиус в точку касания перпендикулярен стороне."},{"t":"AC_1 = C_1B","ok":false,"why":"C_1 — не середина AB (в общем случае)."},{"t":"A, C_1, I, B_1 лежат на одной окружности","ok":true,"why":"Два прямых угла при C_1 и B_1, окружность с диаметром AI."},{"t":"C_1 — основание биссектрисы угла C","ok":false,"why":"Точка касания и основание биссектрисы — разные точки."}],"see":"Точки касания вписанной окружности","think":"отрезки касательных p − a; радиусы ⊥ сторонам; AB_1IC_1 — дельтоид"},{"id":"f21","type":"f","topics":[22,10],"q":"MN — средняя линия трапеции ABCD с основаниями AD = a и BC = b.","stmts":[{"t":"MN = (a + b)/2","ok":true,"why":"Средняя линия равна полусумме оснований."},{"t":"MN ∥ AD","ok":true,"why":"Она параллельна основаниям."},{"t":"MN делит пополам обе диагонали","ok":true,"why":"Как и любой отрезок с концами на основаниях."},{"t":"MN = (a − b)/2","ok":false,"why":"Это отрезок между серединами диагоналей."},{"t":"MN проходит через точку пересечения диагоналей","ok":false,"why":"В общем случае нет: через неё проходит отрезок длины 2ab/(a + b)."}],"see":"Средняя линия трапеции","think":"(a + b)/2; делит пополам высоту и диагонали; куски b/2, (a − b)/2, b/2"},{"id":"f22","type":"f","topics":[2,8,14],"q":"I — точка пересечения биссектрис треугольника ABC.","stmts":[{"t":"I равноудалена от сторон","ok":true,"why":"Каждая точка биссектрисы равноудалена от сторон угла."},{"t":"∠AIB = 90° + ∠C/2","ok":true,"why":"Из суммы углов △AIB."},{"t":"I равноудалена от вершин","ok":false,"why":"Это центр описанной окружности O."},{"t":"I — центр вписанной окружности","ok":true,"why":"По определению."},{"t":"I делит биссектрисы в отношении 2 : 1","ok":false,"why":"Так делит медианы их точка пересечения; I делит биссектрису CL в отношении (a + b) : c."}],"see":"Точка пересечения биссектрис","think":"центр вписанной окружности; ∠AIB = 90° + ∠C/2"},{"id":"f23","type":"f","topics":[30],"q":"H — точка пересечения высот остроугольного треугольника ABC.","stmts":[{"t":"∠AHB = 180° − ∠C","ok":true,"why":"Четырёхугольник с двумя прямыми углами."},{"t":"AH = 2R·cos A","ok":true,"why":"Вдвое больше расстояния от центра описанной окружности до BC."},{"t":"H делит высоты в отношении 2 : 1","ok":false,"why":"Это свойство медиан."},{"t":"Точка, симметричная H относительно BC, лежит на описанной окружности","ok":true,"why":"Известное свойство ортоцентра."},{"t":"H — центр описанной окружности","ok":false,"why":"Центр описанной окружности — точка пересечения серединных перпендикуляров."}],"see":"Ортоцентр","think":"∠AHB = 180° − ∠C; AH = 2R cos A; отражения H лежат на описанной окружности"},{"id":"f24","type":"f","topics":[5],"q":"ABCDEF — правильный шестиугольник со стороной a.","stmts":[{"t":"AD = 2a","ok":true,"why":"Большая диагональ — две стороны правильных треугольников."},{"t":"∠ACD = 90°","ok":true,"why":"Угол опирается на диаметр AD описанной окружности."},{"t":"Радиус описанной окружности равен a","ok":true,"why":"Шестиугольник состоит из правильных треугольников со стороной a."},{"t":"AC = 2a","ok":false,"why":"Малая диагональ равна a√3."},{"t":"Площадь равна 6a²","ok":false,"why":"S = 6·(a²√3/4) = 3√3a²/2."}],"see":"Правильный шестиугольник","think":"6 правильных треугольников; R = a; диагонали 2a и a√3"},{"id":"f25","type":"f","topics":[12,23],"q":"Диагонали четырёхугольника ABCD перпендикулярны.","stmts":[{"t":"S = ½·AC·BD","ok":true,"why":"S = ½d₁d₂·sin φ при φ = 90°."},{"t":"AB² + CD² = BC² + AD²","ok":true,"why":"Пифагор для четырёх прямоугольных треугольников при точке пересечения."},{"t":"ABCD — ромб","ok":false,"why":"Перпендикулярны диагонали и у дельтоида, и у многих других четырёхугольников."},{"t":"Середины сторон образуют прямоугольник","ok":true,"why":"Стороны параллелограмма Вариньона параллельны диагоналям."},{"t":"Около ABCD можно описать окружность","ok":false,"why":"Ниоткуда не следует."}],"see":"Перпендикулярные диагонали","think":"S = ½d₁d₂; AB² + CD² = BC² + AD²; Вариньон — прямоугольник"},{"id":"f26","type":"f","topics":[29],"q":"I_a — центр вневписанной окружности треугольника ABC, касающейся стороны BC.","stmts":[{"t":"I_a лежит на биссектрисе угла A","ok":true,"why":"Окружность вписана в угол A."},{"t":"I_a лежит на биссектрисах внешних углов B и C","ok":true,"why":"Она касается продолжений сторон."},{"t":"r_a = S/(p − a)","ok":true,"why":"Формула радиуса вневписанной окружности."},{"t":"I_a лежит на биссектрисе угла B","ok":false,"why":"На биссектрисе внешнего угла B."},{"t":"r_a = S/p","ok":false,"why":"Это радиус вписанной окружности."}],"see":"Вневписанная окружность","think":"центр на биссектрисе A и внешних биссектрисах B, C; r_a = S/(p − a)"},{"id":"f27","type":"f","topics":[13,0],"q":"В треугольнике ABC выполнено c² > a² + b².","stmts":[{"t":"∠C тупой","ok":true,"why":"По теореме косинусов cos C < 0."},{"t":"Центр описанной окружности лежит вне треугольника","ok":true,"why":"Так у любого тупоугольного треугольника."},{"t":"Высоты из A и B падают на продолжения сторон","ok":true,"why":"Высоты из вершин острых углов тупоугольного треугольника лежат вне него."},{"t":"∠C острый","ok":false,"why":"Острый он при c² < a² + b²."},{"t":"Треугольник прямоугольный","ok":false,"why":"Прямоугольный при c² = a² + b²."}],"see":"Квадрат стороны больше суммы квадратов двух других","think":"угол против неё тупой: высоты и центр O — вне треугольника"},{"id":"b01","type":"b","topics":[13,15],"q":"Нужно найти радиус описанной окружности треугольника. Известны сторона и противолежащий ей угол.","opts":["a/sin A = 2R","R = abc/(4S)","R = c/2","r = S/p"],"correct":0,"nudge":"Какая формула связывает R с одной стороной и одним углом?","why":"Сторона и противолежащий угол — это ровно теорема синусов: R = a/(2 sin A).","see":"Нужен R, есть сторона и противолежащий угол","think":"теорема синусов"},{"id":"b02","type":"b","topics":[15],"q":"Нужно найти радиус описанной окружности. Известны три стороны треугольника.","opts":["R = abc/(4S), площадь — по Герону","R = c/2","R = 2r","R = S/p"],"correct":0,"nudge":"Угла нет, но есть все стороны. Какая формула для R использует стороны и площадь?","why":"R = abc/(4S); площадь находим по Герону. Формула R = c/2 — только для прямоугольного треугольника.","see":"Нужен R, известны три стороны","think":"R = abc/(4S) + Герон"},{"id":"b03","type":"b","topics":[14],"q":"Нужно найти радиус вписанной окружности. Известны три стороны треугольника.","opts":["r = S/p","r = (a + b − c)/2","r = abc/(4S)","r = a√3/6"],"correct":0,"nudge":"Через площадь и полупериметр.","why":"r = S/p, площадь — по Герону. (a + b − c)/2 — только для прямоугольного треугольника.","see":"Нужен r, известны три стороны","think":"r = S/p"},{"id":"b04","type":"b","topics":[26,24],"q":"Нужно найти отношение, в котором точка делит отрезок. В треугольнике пересекаются две чевианы, отношения на сторонах известны.","opts":["Теорема Менелая или параллельная прямая","Теорема косинусов","Степень точки","Площадь через синус"],"correct":0,"nudge":"Нужны отношения отрезков на прямых. Какая теорема связывает отношения на сторонах треугольника?","why":"Менелай: выбери треугольник, где искомый отрезок — сторона, а остальные точки лежат на секущей. Без Менелая — проведи прямую, параллельную одной из чевиан, и переноси отношения по Фалесу.","see":"Две чевианы пересекаются, нужно отношение","think":"Менелай или параллельная прямая"},{"id":"b05","type":"b","topics":[13],"q":"Нужно найти третью сторону треугольника. Известны две стороны и угол между ними.","opts":["Теорема косинусов","Теорема синусов","Теорема Пифагора","Формула Герона"],"correct":0,"nudge":"Угол лежит между известными сторонами.","why":"c² = a² + b² − 2ab·cos C.","see":"Две стороны и угол между ними","think":"теорема косинусов"},{"id":"b06","type":"b","topics":[13],"q":"Нужно найти угол треугольника. Известны три стороны.","opts":["Теорема косинусов: cos C = (a² + b² − c²)/(2ab)","Теорема синусов","Сумма углов треугольника","Свойство вписанного угла"],"correct":0,"nudge":"Нужна формула, где угол выражается только через стороны, причём однозначно.","why":"Косинус находит угол однозначно (и сразу говорит, тупой ли он). Синус для этого не годится: α и 180° − α дают одинаковый синус.","see":"Три стороны, нужен угол","think":"теорема косинусов"},{"id":"b07","type":"b","topics":[19],"q":"Нужно найти отрезок секущей. Из точки вне окружности проведены касательная и секущая.","opts":["PT² = PA·PB (степень точки)","PT = PA + AB","Теорема о биссектрисе","Пифагор в △PTA"],"correct":0,"nudge":"Какая теорема связывает касательную с отрезками секущей из той же точки?","why":"Квадрат касательной равен произведению всей секущей на её внешнюю часть.","see":"Касательная и секущая из одной точки","think":"PT² = PA·PB"},{"id":"b08","type":"b","topics":[21,30],"q":"Нужно доказать, что четыре точки лежат на одной окружности. В треугольнике проведены две высоты.","opts":["Отрезок виден из двух точек под 90° ⇒ они на окружности с этим отрезком как диаметром","AB + CD = BC + AD","Подобие с k = cos C","Теорема Менелая"],"correct":0,"nudge":"Высоты дают прямые углы. Какое ГМТ связано с прямым углом?","why":"Точки, из которых отрезок виден под прямым углом, лежат на окружности с диаметром на этом отрезке. Подобие с cos C — уже следствие, а не способ доказать.","see":"Доказать вписанность, есть прямые углы","think":"окружность на отрезке как на диаметре"},{"id":"b09","type":"b","topics":[21],"q":"Нужно доказать, что ABCD — вписанный четырёхугольник. Известно, что ∠BAC = ∠BDC.","opts":["Отрезок BC виден из A и D под равными углами","∠A + ∠C = 180°","AB + CD = BC + AD","Подобие △ABC и △DBC"],"correct":0,"nudge":"Посмотри, на какой отрезок «смотрят» оба угла.","why":"Если из точек A и D, лежащих по одну сторону от BC, отрезок BC виден под равными углами, то A, B, C, D лежат на одной окружности.","see":"Доказать вписанность, есть равные углы","think":"отрезок виден под равными углами"},{"id":"b10","type":"b","topics":[27,9],"q":"Нужно найти площадь треугольника внутри большого, у которого с большим общий угол. Известны отношения на сторонах.","opts":["S₁/S₂ = (b₁c₁)/(b₂c₂) — произведения сторон при общем угле","S₁/S₂ = k²","Формула Герона","S = pr"],"correct":0,"nudge":"Треугольники не подобны. Что у них общего?","why":"S = ½bc·sin A, а синус общего угла одинаковый — остаётся отношение произведений сторон.","see":"Треугольник с общим углом внутри большого","think":"отношение произведений сторон"},{"id":"b11","type":"b","topics":[8],"q":"Нужно найти длину биссектрисы. Известны две стороны и угол между ними.","opts":["l = 2ab·cos(C/2)/(a + b)","m = ½√(2b² + 2c² − a²)","l = (a + b)/2","Теорема синусов в большом треугольнике"],"correct":0,"nudge":"Разбей площадь на два треугольника по обе стороны биссектрисы.","why":"S = S₁ + S₂: ½ab·sin C = ½(a + b)·l·sin(C/2), откуда l = 2ab·cos(C/2)/(a + b).","see":"Нужна биссектриса, есть две стороны и угол","think":"площадь двумя способами"},{"id":"b12","type":"b","topics":[7],"q":"Нужно найти медиану. Известны три стороны треугольника.","opts":["m_a = ½√(2b² + 2c² − a²) — удвоение медианы","Медиана равна половине стороны","Теорема о биссектрисе","m = 2S/a"],"correct":0,"nudge":"Какую фигуру даёт удвоение медианы?","why":"Удвоенная медиана — диагональ параллелограмма: d₁² + d₂² = 2(a² + b²).","see":"Нужна медиана, известны стороны","think":"удвоение медианы → параллелограмм"},{"id":"b13","type":"b","topics":[20],"q":"Нужно найти длину общей касательной двух окружностей. Известны радиусы и расстояние между центрами.","opts":["Сдвинуть касательную в центр: прямоугольный треугольник","Степень точки","Теорема синусов","L = R + r"],"correct":0,"nudge":"Радиусы в точки касания параллельны. Что получится, если перенести касательную параллельно?","why":"Получится прямоугольный треугольник с гипотенузой d и катетом R − r (внешняя касательная) или R + r (внутренняя).","see":"Общая касательная двух окружностей","think":"сдвинь касательную в центр"},{"id":"b14","type":"b","topics":[3],"q":"Нужно найти высоту из прямого угла. Известны отрезки, на которые она делит гипотенузу.","opts":["h² = a_c·b_c","h = c/2","Теорема Пифагора для большого треугольника","h = r"],"correct":0,"nudge":"Какие треугольники подобны в этой картинке?","why":"△ACH ~ △CBH, поэтому h² равно произведению отрезков гипотенузы.","see":"Высота из прямого угла и отрезки гипотенузы","think":"h² = a_c·b_c"},{"id":"b15","type":"b","topics":[18],"q":"Нужно найти угол между двумя секущими, проведёнными из точки вне окружности. Известны дуги.","opts":["Полуразность дальней и ближней дуг","Полусумма дуг","Половина дальней дуги","Центральный угол на дальнюю дугу"],"correct":0,"nudge":"Вершина угла лежит вне круга.","why":"Вне круга — полуразность, внутри — полусумма.","see":"Угол с вершиной вне круга","think":"полуразность дуг"},{"id":"b16","type":"b","topics":[11,10],"q":"Нужно найти высоту трапеции. Известны все четыре стороны, трапеция не равнобедренная.","opts":["Перенести боковую сторону: треугольник c, d, a − b","Высота отсекает (a − b)/2","h = 2r","h = (a + b)/2"],"correct":0,"nudge":"Как собрать обе боковые стороны в один треугольник с той же высотой?","why":"Прямая через вершину, параллельная боковой стороне, даёт треугольник со сторонами c, d и a − b. Его высота — высота трапеции.","see":"Трапеция по четырём сторонам","think":"треугольник c, d, a − b"},{"id":"b17","type":"b","topics":[14,4],"q":"Нужно найти радиус окружности, вписанной в прямоугольный треугольник. Известны его стороны.","opts":["r = (a + b − c)/2","r = c/2","r = abc/(4S)","r = h/2"],"correct":0,"nudge":"Отрезки касательных из вершины прямого угла равны r.","why":"(a − r) + (b − r) = c, откуда r = (a + b − c)/2.","see":"Вписанная окружность прямоугольного треугольника","think":"r = (a + b − c)/2"},{"id":"b18","type":"b","topics":[2],"q":"Нужно найти угол между биссектрисами двух углов треугольника. Известен третий угол.","opts":["90° + ∠C/2 — через сумму углов","180° − ∠C","Половина дуги","∠C/2"],"correct":0,"nudge":"В треугольнике из двух биссектрис и стороны углы — половинки.","why":"180° − (∠A + ∠B)/2 = 90° + ∠C/2. Угол 180° − ∠C — это угол между высотами.","see":"Угол между биссектрисами","think":"90° + ∠C/2"},{"id":"b19","type":"b","topics":[16],"q":"Нужно найти радиус окружности, описанной около равнобедренной трапеции. Известны её стороны.","opts":["Это окружность △ABD: R = BD/(2 sin A) или abc/(4S)","R — половина большего основания","R равен средней линии","R = h/2"],"correct":0,"nudge":"Окружность трапеции проходит через любые три её вершины.","why":"Описанная окружность трапеции — это окружность треугольника ABD (основание, боковая сторона, диагональ). Половина основания — только если основание — диаметр.","see":"Описанная окружность трапеции","think":"окружность треугольника из трёх вершин"},{"id":"b20","type":"b","topics":[0,6],"q":"Нужно доказать, что треугольник равнобедренный.","opts":["Найти два равных угла или совпадение двух линий из одной вершины","Найти прямой угол","Показать, что медиана равна половине стороны","Найти пару параллельных сторон"],"correct":0,"nudge":"Какие признаки равнобедренного треугольника ты знаешь?","why":"Равнобедренный, если два угла равны или из одной вершины совпали две линии из трёх (медиана, биссектриса, высота). Медиана, равная половине стороны, даёт прямой угол, а не равнобедренность.","see":"Доказать, что треугольник равнобедренный","think":"равные углы или совпавшие медиана/биссектриса/высота"},{"id":"u01","type":"p","topics":[1],"q":"В параллелограмме ABCD биссектрисы углов A и D пересекаются в точке M, лежащей на стороне BC. AB = 5. Найдите периметр параллелограмма.","fig":{"pts":{"A":[0.0,0.0],"B":[2.5,4.33],"C":[12.5,4.33],"D":[10.0,0.0],"M":[7.5,4.33]},"seg":[["A","B"],["B","C"],["C","D"],["D","A"],["A","M"],["D","M"]],"ang":[["B","A","M",1],["M","A","D",1],["A","D","M",2],["M","D","C",2]],"val":[["A","B","5"]],"lp":{"M":"n"}},"opts":["Накрест лежащие углы: △ABM и △DCM равнобедренные ⇒ BM = AB, CM = CD","Теорема о биссектрисе в △ABC","M — точка пересечения диагоналей","Подобие △ABM и △AMD"],"correct":0,"nudge":"Сравни ∠BMA и ∠MAD. Что это говорит о треугольнике ABM?","why":"∠BMA = ∠MAD (накрест лежащие при BC ∥ AD), а ∠MAD = ∠BAM. Значит, △ABM равнобедренный и BM = AB = 5. Точно так же CM = CD = 5, поэтому BC = 10 — вдвое больше AB.","hints":["BM = AB, CM = CD.","BC = 2·AB = 10."],"ans":30,"sol":"BC = 5 + 5 = 10, P = 2·(5 + 10) = 30.","see":"Биссектрисы двух углов параллелограмма пересекаются на стороне","think":"два равнобедренных треугольника ⇒ сторона вдвое больше; сами биссектрисы перпендикулярны"},{"id":"u02","type":"p","topics":[2,15],"q":"В остроугольном треугольнике ABC ∠A = 70°, ∠B = 50°, CH — высота, O — центр описанной окружности. Найдите угол OCH (в градусах).","fig":{"pts":{"A":[0.0,0.0],"B":[8.0,0.0],"C":[2.42,6.65],"H":[2.42,0.0],"O":[4.0,2.309]},"seg":[["A","B"],["B","C"],["C","A"],["C","H"],["C","O"]],"circ":[{"c":[4.0,2.309],"r":4.619}],"ra":[["B","H","C"]],"lp":{"H":"s","O":"e"}},"opts":["∠ACH = ∠BCO = 90° − ∠A: из прямоугольного △ACH и равнобедренного △BOC","CO — биссектриса угла C, поэтому ∠OCH = ∠C/2","∠OCH = 90° − ∠C","O лежит на высоте CH, угол равен 0°"],"correct":0,"nudge":"Центральный угол BOC равен 2∠A. Найди углы при основании равнобедренного △BOC.","why":"∠BOC = 2∠A = 140°, OB = OC, поэтому ∠BCO = 20° = 90° − ∠A. Из △ACH: ∠ACH = 90° − 70° = 20°. Тогда ∠OCH = ∠C − 20° − 20° = 20°. В общем виде ∠OCH = |∠A − ∠B|.","hints":["∠BCO = 90° − ∠A = 20°.","∠OCH = ∠C − ∠ACH − ∠BCO."],"ans":20,"sol":"∠C = 60°, ∠OCH = 60° − 20° − 20° = 20°.","see":"Высота и центр описанной окружности из одной вершины","think":"∠ACH = ∠BCO = 90° − ∠A: высота и радиус симметричны относительно биссектрисы"},{"id":"u03","type":"p","topics":[3,9],"q":"Катеты прямоугольного треугольника равны 15 и 20. Найдите высоту, проведённую к гипотенузе.","fig":{"pts":{"A":[0.0,0.0],"B":[25.0,0.0],"C":[9.0,12.0],"H":[9.0,0.0]},"seg":[["A","B"],["B","C"],["C","A"]],"dash":[["C","H"]],"ra":[["A","C","B"],["A","H","C"]],"val":[["C","A","15"],["C","B","20"]],"lp":{"H":"s"}},"opts":["Площадь двумя способами: ½ab = ½c·h ⇒ h = ab/c","h = √(ab)","h = (a + b − c)/2","h = c/2"],"correct":0,"nudge":"Площадь прямоугольного треугольника можно посчитать через катеты и через гипотенузу с высотой.","why":"c = 25 по теореме Пифагора. ½·15·20 = ½·25·h, отсюда h = 300/25 = 12. Через h² = a_c·b_c тоже можно, но сначала придётся найти проекции.","hints":["c = 25.","h = 15·20/25."],"ans":12,"sol":"h = 300/25 = 12.","see":"Катеты известны, нужна высота к гипотенузе","think":"h = ab/c — площадь двумя способами"},{"id":"u04","type":"p","topics":[3],"q":"Высота прямоугольного треугольника, проведённая к гипотенузе, делит её на отрезки 9 и 16. Найдите меньший катет.","fig":{"pts":{"A":[25.0,0.0],"B":[0.0,0.0],"C":[16.0,12.0],"H":[16.0,0.0]},"seg":[["A","B"],["B","C"],["C","A"],["C","H"]],"ra":[["A","C","B"],["A","H","C"]],"val":[["A","H","9"],["H","B","16"]],"lp":{"H":"s"}},"opts":["Катет² = гипотенуза × его проекция: AC² = 25·9","Катет² = 9·16","Катет = √(9² + 16²)","Катет = (9 + 16)/2"],"correct":0,"nudge":"Какой треугольник подобен всему △ABC и содержит катет AC и отрезок AH?","why":"△ACH ~ △ABC (общий угол A), поэтому AC/AB = AH/AC и AC² = AB·AH = 25·9 = 225. Произведение 9·16 — это квадрат высоты, а не катета.","hints":["Меньший катет прилежит к отрезку 9.","AC² = 25·9."],"ans":15,"sol":"AC = √225 = 15.","see":"Высота делит гипотенузу на известные отрезки, нужен катет","think":"катет² = гипотенуза × проекция; высота² = произведение отрезков"},{"id":"u05","type":"p","topics":[4,3],"q":"В прямоугольном треугольнике угол между высотой и медианой, проведёнными из вершины прямого угла, равен 40°. Найдите больший острый угол треугольника (в градусах).","fig":{"pts":{"A":[0.0,0.0],"B":[10.0,0.0],"C":[1.786,3.83],"H":[1.786,0.0],"M":[5.0,0.0]},"seg":[["A","B"],["B","C"],["C","A"],["C","H"],["C","M"]],"ra":[["A","C","B"],["B","H","C"]],"tick":[["A","M",1],["M","B",1]],"txt":[[2.336,2.78,"40°"]],"lp":{"H":"s","M":"s"}},"opts":["CM = MB ⇒ ∠MCB = ∠B, и ∠ACH = ∠B ⇒ ∠HCM = 90° − 2∠B","Медиана из прямого угла — биссектриса","∠HCM = ∠A/2","CH = CM, △HCM равнобедренный"],"correct":0,"nudge":"Медиана к гипотенузе равна её половине. Какие равнобедренные треугольники это даёт?","why":"CM = MB = MA, поэтому ∠MCB = ∠B. Из △ACH: ∠ACH = 90° − ∠A = ∠B. Значит, ∠HCM = 90° − 2∠B = 40°, ∠B = 25°, ∠A = 65°. В общем виде угол между высотой и медианой равен |∠A − ∠B|.","hints":["90° − 2∠B = 40°.","∠B = 25°."],"ans":65,"sol":"∠B = 25°, больший острый угол ∠A = 65°.","see":"Высота и медиана из вершины прямого угла","think":"∠ACH = ∠B = ∠MCB; угол между ними |∠A − ∠B|"},{"id":"u06","type":"p","topics":[4,7],"q":"В треугольнике ABC точка M — середина стороны AC, BM = AM. AB = 5, BC = 12. Найдите AC.","fig":{"pts":{"A":[0.0,5.0],"B":[0.0,0.0],"C":[12.0,0.0],"M":[6.0,2. 8.25,4.5]},"seg":[["A","B"],["B","C"],["C","D"],["D","A"],["A","C"],["B","D"]],"thick":[["M","N"]],"val":[["A","D","12"],["B","C","4"]],"lp":{"O":"n","M":"w","N":"e"}},"opts":["Подобие: MO/AD = BO/BD = BC/(BC + AD), так же ON ⇒ MN = 2ab/(a + b)","Это средняя линия: (4 + 12)/2","(12 − 4)/2","√(4·12)"],"correct":0,"nudge":"В каком отношении O делит диагональ BD? Посмотри на △ABD и отрезок MO ∥ AD.","why":"BO : OD = BC : AD = 1 : 3, поэтому BO : BD = 1 : 4. В △ABD отрезок MO ∥ AD, MO = ¼·AD = 3. Так же ON = 3, MN = 6 = 2·4·12/(4 + 12). Средняя линия здесь другая — она равна 8.","hints":["BO : BD = 1 : 4.","MO = ON = 3."],"ans":6,"sol":"MN = 3 + 3 = 6.","see":"Отрезок через точку пересечения диагоналей трапеции, параллельный основаниям","think":"O делит его пополам; длина 2ab/(a + b)"},{"id":"u25","type":"p","topics":[23,12],"q":"Диагонали четырёхугольника ABCD перпендикулярны и равны 8. Найдите площадь четырёхугольника, вершины которого — середины сторон ABCD.","fig":{"pts":{"A":[-3.0,0.0],"B":[0.0,2.0],"C":[5.0,0.0],"D":[0.0,-6.0],"K":[-1.5,1.0],"L":[2.5,1.0],"M":[2.5,-3.0],"N":[-1.5,-3.0]},"seg":[["A","B"],["B","C"],["C","D"],["D","A"]],"dash":[["A","C"],["B","D"]],"thick":[["K","L"],["L","M"],["M","N"],["N","K"]],"hide":["K","L","M","N"]},"opts":["Стороны четырёхугольника из середин ∥ диагоналям и равны их половинам ⇒ квадрат со стороной 4","Площадь равна четверти площади ABCD","Это ромб со стороной 8","Площадь равна ½·8·8"],"correct":0,"nudge":"Каждая сторона нового четырёхугольника — средняя линия треугольника, отсечённого диагональю.","why":"KL ∥ AC и KL = AC/2 = 4, LM ∥ BD и LM = 4. Диагонали перпендикулярны, поэтому KLMN — квадрат со стороной 4, площадь 16. Это и есть половина площади ABCD: ½·(½·8·8) = 16.","hints":["Сторона 4, углы прямые."],"ans":16,"sol":"S = 16.","see":"Середины сторон четырёхугольника с равными перпендикулярными диагоналями","think":"параллелограмм Вариньона: стороны = половины диагоналей, углы — как между диагоналями, S = ½S"},{"id":"u26","type":"p","topics":[24],"q":"На стороне AB треугольника ABC взята точка M, AM : MB = 2 : 3. Прямая, проходящая через M параллельно BC, пересекает AC в точке N, AN = 4. Найдите NC.","fig":{"pts":{"A":[2.0,6.0],"B":[0.0,0.0],"C":[10.0,0.0],"M":[1.2,3.6],"N":[5.2,3.6]},"seg":[["A","B"],["B","C"],["C","A"],["M","N"]],"val":[["A","M","2x"],["M","B","3x"],["A","N","4"]],"lp":{"M":"w","N":"e"}},"opts":["Обобщённая теорема Фалеса: AN : NC = AM : MB","NC = AN, ведь MN — средняя линия","AN : NC = AM : AB","NC = BC − MN"],"correct":0,"nudge":"Параллельные прямые отсекают на сторонах угла пропорциональные отрезки.","why":"MN ∥ BC, поэтому AN : NC = AM : MB = 2 : 3 и NC = 4·3/2 = 6. Отношение AM : AB = 2 : 5 — это коэффициент подобия для MN : BC, а не для отрезков стороны.","hints":["AN : NC = 2 : 3."],"ans":6,"sol":"NC = 6.","see":"Параллельная прямая и отрезки сторон","think":"Фалес: отношения отрезков на сторонах угла переносятся"},{"id":"u27","type":"p","topics":[25],"q":"В треугольник ABC вписан квадрат: две его вершины лежат на стороне AC, две другие — на сторонах AB и BC. AC = 12, высота BH = 6. Найдите сторону квадрата.","fig":{"pts":{"A":[0.0,0.0],"B":[4.0,6.0],"C":[12.0,0.0],"H":[4.0,0.0],"K":[2.667,0.0],"L":[2.667,4.0],"M":[6.667,4.0],"N":[6.667,0.0]},"seg":[["A","B"],["B","C"],["C","A"]],"dash":[["B","H"]],"thick":[["K","L"],["L","M"],["M","N"],["N","K"]],"val":[["A","C","12"],["B","H","6"]],"hide":["K","N"],"lp":{"H":"s","L":"w","M":"e"}},"opts":["△BLM ~ △BAC: LM/AC = (6 − x)/6","x = BH/2","x = (AC + BH)/2","x = AC·BH/(AC − BH)"],"correct":0,"nudge":"Верхняя сторона квадрата параллельна AC. Какой треугольник она отсекает и какая у него высота?","why":"LM ∥ AC, поэтому △BLM ~ △BAC, а высота △BLM равна 6 − x. x/12 = (6 − x)/6, x = 4. В общем виде x = ah/(a + h).","hints":["x/12 = (6 − x)/6.","6x = 72 − 12x."],"ans":4,"sol":"x = 4.","see":"Квадрат или прямоугольник, вписанный в треугольник","think":"отсечённый сверху треугольник подобен большому; сравни высоты"},{"id":"u28","type":"p","topics":[25],"q":"На стороне AB треугольника ABC взята точка D так, что ∠BCD = ∠BAC. BC = 8, AB = 16. Найдите BD.","fig":{"pts":{"A":[16.0,0.0],"B":[0.0,0.0],"C":[2.736,7.518],"D":[4.0,0.0]},"seg":[["A","B"],["B","C"],["C","A"],["C","D"]],"ang":[["B","C","D",1],["B","A","C",1]],"val":[["B","C","8"]],"lp":{"D":"s"}},"opts":["△BCD ~ △BAC (общий угол B) ⇒ BC² = BD·BA","CD — биссектриса угла C","BD = BC/2: CD — средняя линия","Теорема косинусов в △BCD"],"correct":0,"nudge":"У треугольников BCD и BAC общий угол B. Сопоставь вершины по равным углам.","why":"∠B общий, ∠BCD = ∠BAC, поэтому △BCD ~ △BAC (B↔B, C↔A, D↔C). BC/BA = BD/BC, BD = 64/16 = 4.","hints":["BD = BC²/BA."],"ans":4,"sol":"BD = 4.","see":"Отрезок из вершины образует угол, равный углу треугольника","think":"общий угол + ещё один равный ⇒ подобие; BC² = BD·BA"},{"id":"u29","type":"p","topics":[26,24],"q":"BK — медиана треугольника ABC, M — середина BK. Прямая AM пересекает сторону BC в точке N. Найдите отношение NC : BN.","fig":{"pts":{"A":[0.0,0.0],"B":[3.0,7.0],"C":[10.0,0.0],"K":[5.0,0.0],"M":[4.0,3.5],"N":[5.333,4.667]},"seg":[["A","B"],["B","C"],["C","A"],["B","K"],["A","N"]],"tick":[["A","K",1],["K","C",1],["B","M",2],["M","K",2]],"lp":{"K":"s","M":"w","N":"ne"}},"opts":["Менелай для △BKC и прямой A–M–N (или прямая через K ∥ AN)","N — середина BC","BN : NC = BM : MK = 1 : 1","Теорема о биссектрисе в △ABC"],"correct":0,"nudge":"Нужен треугольник, у которого BC — сторона, а точки A, M, N лежат на одной прямой. Подойдёт △BKC (A — на продолжении KC).","why":"Менелай для △BKC и прямой A–M–N: (BN/NC)·(CA/AK)·(KM/MB) = 1, то есть (BN/NC)·2·1 = 1 и BN : NC = 1 : 2. Без Менелая: проведи KL ∥ AN (L на BC). Фалес в △BKL: BN = NL, в △CAN: NL = LC. Значит, NC = 2·BN.","hints":["CA : AK = 2.","BN : NC = 1 : 2."],"ans":2,"sol":"NC : BN = 2.","see":"Медиана, её середина и прямая из вершины","think":"Менелай (или параллельная прямая через середину)"},{"id":"u30","type":"p","topics":[27,25],"q":"Точка K лежит на стороне BC параллелограмма ABCD, BK : KC = 1 : 3. Отрезок AK пересекает диагональ BD в точке P. Площадь параллелограмма равна 48. Найдите площадь треугольника ABP.","fig":{"pts":{"A":[0.0,0.0],"B":[2.0,6.0],"C":[10.0,6.0],"D":[8.0,0.0],"K":[4.0,6.0],"P":[3.2,4.8]},"seg":[["A","B"],["B","C"],["C","D"],["D","A"],["A","K"],["B","D"]],"val":[["B","K","x"],["K","C","3x"]],"lp":{"K":"n","P":"e"}},"opts":["△BPK ~ △DPA ⇒ BP : PD = BK : AD, затем общая высота в △ABD","P — середина BD","S_{ABP} = ¼·S_{ABCD}","S_{ABP} = S_{ABK}"],"correct":0,"nudge":"Треугольники BPK и DPA — «бабочка» при параллельных BC и AD. С каким коэффициентом они подобны?","why":"BK = ¼BC = ¼AD, △BPK ~ △DPA с k = ¼, поэтому BP : PD = 1 : 4 и BP = ⅕BD. У △ABP и △ABD общая высота из A: S_{ABP} = ⅕·24 = 4,8.","hints":["BP : BD = 1 : 5.","S_{ABD} = 24."],"ans":4.8,"sol":"S_{ABP} = 4,8.","see":"Отрезок из вершины параллелограмма пересекает диагональ","think":"«бабочка» при параллельных сторонах ⇒ отношение на диагонали ⇒ общая высота"},{"id":"u31","type":"p","topics":[28,17],"q":"Из точки P к окружности проведены касательные PA и PB, PA = 7. Третья касательная касается окружности в точке K, лежащей на меньшей дуге AB, и пересекает отрезки PA и PB в точках M и N. Найдите периметр треугольника PMN.","fig":{"pts":{"A":[1.182,2.757],"B":[1.182,-2.757],"P":[7.616,0.0],"K":[3.0,0.0],"M":[3.0,1.978],"N":[3.0,-1.978],"O":[0.0,0.0]},"seg":[["P","A"],["P","B"],["M","N"]],"circ":[{"c":[0.0,0.0],"r":3.0}],"val":[["P","A","7"]],"hide":["O"],"lp":{"P":"e","M":"n","N":"s"}},"opts":["Отрезки касательных: MK = MA, NK = NB ⇒ периметр = PA + PB","Периметр равен PA","Нужна длина MN — данных не хватает","Периметр равен 3·PA"],"correct":0,"nudge":"MN = MK + KN. С какими отрезками на сторонах PA и PB равны MK и KN?","why":"MK = MA и NK = NB — касательные из точек M и N. PM + MN + NP = PM + MA + NB + PN = PA + PB = 14 при любом положении K.","hints":["MK = MA, KN = NB."],"ans":14,"sol":"P = 7 + 7 = 14.","see":"Третья касательная отсекает треугольник от угла","think":"отрезки касательных ⇒ периметр = 2·PA"},{"id":"u32","type":"p","topics":[29,28],"q":"В треугольнике ABC AB = 5, BC = 7, AC = 8. Вневписанная окружность касается стороны BC и продолжений сторон AB и AC. Найдите длину отрезка касательной, проведённой к этой окружности из вершины A.","fig":{"pts":{"A":[0.0,0.0],"B":[5.0,0.0],"C":[4.0,6.928],"T":[10.0,0.0],"S":[5.0,8.66],"I":[10.0,5.774]},"seg":[["A","B"],["B","C"],["C","A"],["B","T"],["C","S"]],"circ":[{"c":[10.0,5.774],"r":5.774}],"val":[["A","B","5"],["B","C","7"],["A","C","8"]],"hide":["I"],"lp":{"T":"s","S":"nw","B":"s"}},"opts":["Отрезок касательной из A к вневписанной окружности равен полупериметру p","Он равен p − BC","Он равен BC","Он равен радиусу вневписанной окружности"],"correct":0,"nudge":"Обозначь точки касания на продолжениях AB и AC — T и S. AT = AS. Вырази AT + AS через стороны, используя BT = BN и CS = CN (N — касание с BC).","why":"AT + AS = (AB + BN) + (AC + CN) = AB + AC + BC = 2p, а AT = AS, поэтому AT = p = 10. p − BC — это отрезок касательной из A к вписанной окружности.","hints":["2·AT = AB + BC + CA.","p = 10."],"ans":10,"sol":"AT = p = 10.","see":"Касательная из вершины к вневписанной окружности","think":"отрезок касательной из A к вневписанной окружности = p"},{"id":"u33","type":"p","topics":[30,15],"q":"O — центр окружности, описанной около остроугольного треугольника ABC, H — точка пересечения его высот. Расстояние от O до прямой BC равно 3. Найдите AH.","fig":{"pts":{"A":[-1.71,4.698],"B":[-4.0,-3.0],"C":[4.0,-3.0],"O":[0.0,0.0],"H":[-1.71,-1.302],"M":[0.0,-3.0],"A_1":[-1.71,-3.0],"B_1":[1.161,0.828]},"seg":[["A","B"],["B","C"],["C","A"],["A","A_1"],["B","B_1"]],"dash":[["O","M"]],"circ":[{"c":[0.0,0.0],"r":5.0}],"ra":[["O","M","C"]],"val":[["O","M","3"]],"hide":["A_1","B_1"],"lp":{"O":"e","H":"w","M":"s"}},"opts":["AH = 2·OM, где M — середина BC","AH = OM","AH = 3·OM, как отрезки медиан","AH = R, а R неизвестен"],"correct":0,"nudge":"Есть из  ⊥ BD и BH = HD. В прямоугольном △ABC AC = 15 и BH = AB·BC/AC = 108/15 = 7,2. BD = 14,4.","hints":["AC = 15.","BH = 9·12/15."],"ans":14.4,"sol":"BD = 2·7,2 = 14,4.","see":"Четырёхугольник с двумя парами равных соседних сторон","think":"дельтоид: AC — ось симметрии, AC ⊥ BD; с двумя прямыми углами — вписанный"},{"id":"u36","type":"p","topics":[18],"q":"AC — диаметр окружности, точки B и D лежат на окружности по разные стороны от AC. ∠ACB = 35°. Найдите угол BDC (в градусах).","fig":{"pts":{"A":[-4.0,0.0],"B":[-1.368,3.759],"C":[4.0,0.0],"D":[-1.368,-3.759],"O":[0.0,0.0]},"seg":[["A","B"],["B","C"],["C","A"],["B","D"],["D","C"]],"circ":[{"c":[0.0,0.0],"r":4.0}],"txt":[[2.75,0.32,"35°"]],"hide":["O"]},"opts":["∠ABC = 90° (опирается на диаметр), а ∠BDC = ∠BAC — вписанные углы на дугу BC","∠BDC = ∠ACB","∠BDC = 90°, он опирается на диаметр","∠BDC = 2·∠ACB"],"correct":0,"nudge":"На какую дугу опирается ∠BDC? Какой ещё вписанный угол опирается на неё же?","why":"∠BDC и ∠BAC опираются на дугу BC, поэтому равны. ∠ABC = 90°, значит ∠BAC = 90° − 35° = 55°. ∠BDC на диаметр не опирается — на диаметр опирается ∠ADC.","hints":["∠BAC = 55°."],"ans":55,"sol":"∠BDC = 55°.","see":"Диаметр и вписанные углы","think":"угол на диаметр — прямой; углы на одну дугу равны"},{"id":"u37","type":"p","topics":[19],"q":"Через точку P внутри окружности радиуса 7 проведена хорда AB. Расстояние от P до центра O равно 5, AP = 3. Найдите PB.","fig":{"pts":{"A":[6.5,-2.598],"B":[1.0,6.928],"P":[5.0,0.0],"O":[0.0,0.0]},"seg":[["A","B"]],"dash":[["O","P"]],"circ":[{"c":[0.0,0.0],"r":7.0}],"val":[["A","P","3"],["O","P","5"]],"lp":{"P":"e","O":"s"}},"opts":["Провести диаметр через P: AP·PB = (R − OP)(R + OP)","PB = 2R − AP","AP·PB = OP²","PB = √(R² − OP²)"],"correct":0,"nudge":"Через P проходит ещё одна хорда — диаметр. На какие отрезки P делит его?","why":"Диаметр через P делится точкой P на отрезки 7 − 5 = 2 и 7 + 5 = 12. По свойству пересекающихся хорд AP·PB = 2·12 = 24, PB = 8.","hints":["2·12 = 24.","PB = 24/3."],"ans":8,"sol":"PB = 8.","see":"Хорда через точку внутри круга, известно расстояние до центра","think":"степень точки: AP·PB = R² − OP²"},{"id":"u38","type":"p","topics":[14,17],"q":"Сторона ромба равна 10, одна из его диагоналей равна 12. Найдите радиус окружности, вписанной в ромб.","fig":{"pts":{"A":[-8.0,0.0],"B":[0.0,6.0],"C":[8.0,0.0],"D":[0.0,-6.0],"O":[0.0,0.0]},"seg":[["A","B"],["B","C"],["C","D"],["D","A"]],"dash":[["B","D"]],"circ":[{"c":[0.0,0.0],"r":4.8}],"val":[["A","B","10"],["B","D","12"]],"hide":["O"]},"opts":["Центр — точка пересечения диагоналей; r — высота прямоугольного △AOB к гипотенузе AB","r — половина меньшей диагонали","r — половина стороны","r = d₁d₂/a"],"correct":0,"nudge":"Центр вписанной окружности — точка пересечения диагоналей O. Чему равно расстояние от O до стороны AB?","why":"Половины диагоналей — 6 и √(100 − 36) = 8. В прямоугольном △AOB r = OA·OB/AB = 8·6/10 = 4,8. То же самое: высота ромба h = S/a = 96/10 = 9,6 и r = h/2.","hints":["Вторая половина диагонали равна 8.","r = 6·8/10."],"ans":4.8,"sol":"r = 4,8.","see":"Окружность, вписанная в ромб","think":"центр — пересечение диагоналей; r = h/2 = высота △AOB"},{"id":"u39","type":"p","topics":[4,2],"q":"В прямоугольном треугольнике ABC с прямым углом C проведены высота CH, биссектриса CL и медиана CM. ∠HCL = 12°. Найдите угол LCM (в градусах).","fig":{"pts":{"A":[0.0,0.0],"B":[10.0,0.0],"C":[2.966,4.568],"H":[2.966,0.0],"L":[3.937,0.0],"M":[5.0,0.0]},"seg":[["A","B"],["B","C"],["C","A"],["C","L"],["C","M"]],"dash":[["C","H"]],"ra":[["A","C","B"],["B","H","C"]],"lp":{"H":"s","L":"s","M":"s"}},"opts":["∠ACH = ∠BCM (оба равны ∠B) ⇒ CL — биссектриса угла HCM","∠LCM = 45° − 12°","∠LCM = 2·12°","∠LCM = 90° − 2·12°"],"correct":0,"nudge":"Сравни углы ACH и BCM. Чему равен каждый из них?","why":"∠ACH = 90° − ∠A = ∠B, и ∠BCM = ∠B (CM = MB). Биссектриса делит прямой угол пополам, поэтому ∠HCL = 45° − ∠ACH = 45° − ∠BCM = ∠LCM = 12°.","hints":["∠ACH = ∠BCM."],"ans":12,"sol":"∠LCM = 1
