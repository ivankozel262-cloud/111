<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Тренажёр теории планиметрии</title>
<style>
/* Same family as «Первый ход»: one column up to 660px, sticky tab strip, questions set in a book serif,
   Latin letters in italic as in the cheat sheet, mistakes marked in teacher's red. */
:root{
  --bg:#f1f3f8; --surface:#ffffff; --ink:#162032; --muted:#5a6680; --line:#d5dae6; --grid:#e3e8f2;
  --accent:#2341ab; --accent-soft:#e5eafa; --on-accent:#ffffff;
  --ok:#17784a; --ok-soft:#e1f1e8; --bad:#c12b25; --bad-soft:#f9e4e3; --on-bad:#ffffff;
  --exc:#8a5000; --exc-soft:#fbeed6;
  --heat1:#d3dbf5; --heat2:#a9b8ec; --heat3:#6f86d9; --heat4:#2341ab;
  --f-ui:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-word:"Literata", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f131b; --surface:#171c27; --ink:#e5e8f0; --muted:#98a2b8; --line:#2a3142; --grid:#1f2533;
    --accent:#8fa4ff; --accent-soft:#1e2846; --on-accent:#0c111e;
    --ok:#5cc28d; --ok-soft:#14301f; --bad:#ff7b72; --bad-soft:#3b1a19; --on-bad:#2a0c0a;
    --exc:#efb25a; --exc-soft:#352710;
    --heat1:#1e2846; --heat2:#2c3d72; --heat3:#4d65b8; --heat4:#8fa4ff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f131b; --surface:#171c27; --ink:#e5e8f0; --muted:#98a2b8; --line:#2a3142; --grid:#1f2533;
  --accent:#8fa4ff; --accent-soft:#1e2846; --on-accent:#0c111e;
  --ok:#5cc28d; --ok-soft:#14301f; --bad:#ff7b72; --bad-soft:#3b1a19; --on-bad:#2a0c0a;
  --exc:#efb25a; --exc-soft:#352710;
  --heat1:#1e2846; --heat2:#2c3d72; --heat3:#4d65b8; --heat4:#8fa4ff; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-ui);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.wrap{max-width:660px;margin:0 auto;padding-inline:16px;padding-block:14px 64px}

.hd{display:flex;gap:14px;align-items:center;padding-block:4px 12px}
.hd-ico{width:50px;height:50px;flex:none;display:grid;place-items:center;border:2px solid var(--ink);border-radius:6px}
.hd-ico svg{width:40px;height:40px;display:block}
.hd-ico .tri{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.hd-ico .inc{fill:none;stroke:var(--accent);stroke-width:2}
.hd-ico .bis{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-dasharray:2.4 2}
.hd-ico .dt{fill:var(--accent)}
.hd h1{margin:0;font:700 1.3rem/1.15 var(--f-ui);text-wrap:balance}
.hd p{margin:3px 0 0;color:var(--muted);font-size:.88rem}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:2px;
  overflow-x:auto;scrollbar-width:none;padding-block:6px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;border-radius:8px;padding:10px 10px;cursor:pointer;
  font-weight:600;font-size:.9rem;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.cnt{display:inline-block;min-width:1.5em;margin-left:5px;padding:2px 6px;border-radius:999px;font-size:.72rem;
  line-height:1.3;text-align:center;background:var(--bad);color:var(--on-bad);font-variant-numeric:tabular-nums}
.cnt[data-zero]{background:var(--grid);color:var(--muted)}

.lbl{font:600 .68rem/1.2 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.lead{margin:0 0 12px;color:var(--muted)}
.note{margin:0;color:var(--muted);font-size:.92rem}
.note a{color:var(--accent);font-weight:600}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 17px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{padding:8px 12px;font-size:.9rem}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:18px 16px;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px 8px;margin-bottom:14px}
.sec-h{margin:18px 0 8px;font:700 1rem/1.25 var(--f-ui)}

/* ---------- start screen ---------- */
.today{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:11px;margin-bottom:12px}
.trow2{display:flex;justify-content:space-between;gap:6px 14px;align-items:baseline;flex-wrap:wrap}
.trow2 b{font-variant-numeric:tabular-nums}
.goalbar{height:8px;background:var(--grid);border-radius:4px;overflow:hidden}
.goalbar i{display:block;height:100%;background:var(--accent)}
.goalbar i.full{background:var(--ok)}
.week{display:flex;gap:5px;flex-wrap:wrap}
.week span{width:26px;height:26px;border-radius:6px;background:var(--grid);display:grid;place-items:center;font-size:.7rem;color:var(--muted)}
.week span.on{background:var(--accent);color:var(--on-accent)}
.week span.now{box-shadow:0 0 0 1.5px var(--surface),0 0 0 3px var(--accent)}
.queue{color:var(--muted);font-size:.92rem}
.queue b{color:var(--ink);font-variant-numeric:tabular-nums}
.startbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:10px 12px;cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg.wide{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%}
.seg.wide button{padding:10px 4px;font-size:.88rem;min-width:0;white-space:normal}
.seglbl{color:var(--muted);font-size:.9rem}
.lenpick{display:inline-flex;gap:8px;align-items:center}
.mixrow{display:grid;gap:6px;margin-bottom:12px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
details.algo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 16px;margin-bottom:12px}
details.algo summary{cursor:pointer;padding:13px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.algo summary::-webkit-details-marker{display:none}
details.algo summary::after{content:"+";color:var(--muted);font-weight:500}
details.algo[open] summary::after{content:"−"}
details.algo ol{margin:0 0 14px;padding-left:1.3em;display:grid;gap:8px}
details.algo li{padding-left:2px}
details.algo li b{font-weight:600}
details.algo li i,.roots i{font-family:var(--f-word);font-style:italic}
.roots{list-style:none;padding-left:0!important}
.roots li{display:grid;grid-template-columns:34px 1fr;gap:2px 8px;padding-left:0!important}
.roots .kk{font-weight:700;font-variant-numeric:tabular-nums}
.roots .tp{grid-column:2;color:var(--muted);font-size:.86rem}

/* ---------- card ---------- */
.bar{display:flex;justify-content:space-between;gap:12px;font-size:.88rem;color:var(--muted);margin-bottom:6px}
.bar span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:4px;background:var(--grid);border-radius:2px;overflow:hidden;margin-bottom:12px}
.track i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s ease}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kind{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.kind .src{font:600 .68rem/1.2 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--exc)}
.qt{padding:16px 16px 4px;font:400 1.1rem/1.55 var(--f-word);overflow-wrap:anywhere}
.qt i,.opt i,.stm i,.why i,.hintline i,.sol i,.mlist i,.tr i.v,.thinkbox i{font-family:var(--f-word);font-style:italic}
sub{font-size:.72em;line-height:0}
sup{font-size:.72em;line-height:0}
.zone{padding:12px 16px 16px;display:grid;gap:10px}
.thinkbox{border:1.5px dashed var(--line);border-radius:10px;padding:11px 13px;color:var(--muted);font-size:.95rem}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--line);
  background:var(--surface);border-radius:10px;padding:11px 13px;cursor:pointer;line-height:1.38;overflow-wrap:anywhere}
.opt .k{font:600 .78rem/1.75 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tfb{align-items:center;font-weight:600;padding:14px 13px}
.tfb .k{line-height:1.2}
.verdict{font-weight:700;font-size:1.05rem}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.why{margin:0}
.ref{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center}
.tchip{font-size:.78rem;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:600;line-height:1.35}
.ansrow{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.ansrow input{width:9em;max-width:100%;font:600 1.1rem/1.1 var(--f-ui);padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.ansrow input.badv{border-color:var(--bad)}
.nfb{font-weight:600}
.nfb.ok{color:var(--ok)} .nfb.bad{color:var(--bad)}
.hintline{font-size:.97rem;padding:8px 12px;border-left:3px solid var(--exc);background:var(--exc-soft);border-radius:0 8px 8px 0}
.sol{font-size:.97rem;padding:9px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
.next{justify-self:start}
.stms{display:grid;gap:8px}
.stm{display:grid;grid-template-columns:22px 1fr;gap:4px 10px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--line);
  background:var(--surface);border-radius:10px;padding:11px 13px;cursor:pointer;line-height:1.38;overflow-wrap:anywhere}
.stm .bx{width:20px;height:20px;border:2px solid var(--muted);border-radius:5px;display:grid;place-items:center;margin-top:1px}
.stm[aria-pressed="true"] .bx{background:var(--accent);border-color:var(--accent)}
.stm[aria-pressed="true"] .bx::after{content:"";width:9px;height:5px;border-left:2.5px solid var(--on-accent);border-bottom:2.5px solid var(--on-accent);transform:translate(0,-1px) rotate(-45deg)}
.stm:disabled{cursor:default}
.stm.good{border-color:var(--ok)}
.stm.badm{border-color:var(--bad);background:var(--bad-soft)}
.stm.quiet{opacity:.6}
.stm .tg{grid-column:2;font:700 .66rem/1.2 var(--f-ui);letter-spacing:.07em;text-transform:uppercase}
.stm.good .tg{color:var(--ok)} .stm.badm .tg{color:var(--bad)} .stm.quiet .tg{color:var(--muted)}

.done{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 16px;display:grid;gap:12px}
.done h2{margin:0;font:700 1.6rem/1.1 var(--f-ui);font-variant-numeric:tabular-nums}
.done p{margin:0;color:var(--muted)}
.cmp{font-variant-numeric:tabular-nums}
.cmp b{color:var(--ink)}
.cmp .up{color:var(--ok);font-weight:600} .cmp .down{color:var(--bad);font-weight:600}
.mlist{list-style:none;margin:0;padding:0;display:grid}
.mlist li{display:grid;gap:3px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.mlist li:first-child{border-top:0}
.mlist .k2{font:600 .66rem/1.2 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.mlist .s{line-height:1.38;overflow-wrap:anywhere}
.mlist .s b{font-weight:700}
.mlist .m{font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.mlist .m b{color:var(--bad);font-weight:600}
.mlist .m .gd{color:var(--ok);font-weight:600}

/* ---------- topics & stats ---------- */
.topic{border-top:1px solid var(--line)}
.topic:first-child{border-top:0}
.topic > button{display:grid;grid-template-columns:34px 1fr auto;gap:3px 10px;align-items:start;width:100%;background:none;border:0;
  padding:11px 0;text-align:left;cursor:pointer}
.topic .no{font:700 .82rem/1.6 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.topic .nm{font-weight:600;line-height:1.3;min-width:0}
.topic .nm small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.topic .pc{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.meter{grid-column:2/-1;height:6px;background:var(--grid);border-radius:3px;overflow:hidden;display:flex}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.low{background:var(--bad)}
.meter i.good{background:var(--ok)}
.tbody{padding:0 0 14px 44px;display:grid;gap:9px}
.tr{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;font-size:.93rem;line-height:1.4}
.tr > span{min-width:0;overflow-wrap:anywhere}
.tr b{font-weight:700}
.tr small{display:block;color:var(--muted);font-size:.85rem;margin-top:2px}
.tr i{font-family:var(--f-word);font-style:italic}
.st{width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--grid);border:1.5px solid var(--muted);display:inline-block;flex:none}
.st.prog{background:var(--heat2);border-color:var(--heat3)}
.st.mast{background:var(--ok);border-color:var(--ok)}
.st.err{background:var(--bad);border-color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin:0 0 12px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend .st{margin-top:0}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.tile b{display:block;font:700 1.35rem/1.1 var(--f-ui);font-variant-numeric:tabular-nums}
.tile b small{font-size:.6em;color:var(--muted);font-weight:600}
.tile span{font-size:.8rem;color:var(--muted)}
.srow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .t{font-weight:600;line-height:1.3;min-width:0}
.srow .t small{display:block;font-weight:400;color:var(--muted);font-size:.84rem}
.srow .pct{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.srow .pct small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.srow .meter{grid-column:1/-1}
.weak{display:inline-block;margin-left:6px;font:700 .64rem/1 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;
  color:var(--bad);border:1.5px solid var(--bad);border-radius:4px;padding:3px 5px;vertical-align:2px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.chart svg{display:block;width:100%;height:auto}
.chart p{margin:6px 0 0;font-size:.86rem;color:var(--muted)}
.heatwrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:grid;gap:8px}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,30px));gap:4px}
.heat span{aspect-ratio:1;border-radius:5px;background:var(--grid)}
.heat span.h1{background:var(--heat1)} .heat span.h2{background:var(--heat2)} .heat span.h3{background:var(--heat3)} .heat span.h4{background:var(--heat4)}
.heat span.fut{background:none;border:1px dashed var(--line)}
.heat .dn{font-size:.68rem;color:var(--muted);text-align:center;aspect-ratio:auto;background:none}
.setrow{display:flex;justify-content:space-between;gap:8px 12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.sync{color:var(--muted);font-size:.86rem;margin:12px 0}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.confirm p{margin:0;width:100%;font-size:.92rem}
@media (max-width:420px){ .tiles{grid-template-columns:repeat(2,minmax(0,1fr))} .tbody{padding-left:0} .seg.wide{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>

<div class="wrap">
  <header class="hd">
    <div class="hd-ico" aria-hidden="true"><svg viewBox="0 0 50 50"><path class="bis" d="M4 45L31.34 25.29M46 45L10.03 26.92M17 6L23.25 45"/><circle class="inc" cx="21.25" cy="32.56" r="12.44"/><path class="tri" d="M4 45L46 45L17 6Z"/><circle class="dt" cx="21.25" cy="32.56" r="2.1"/></svg></div>
    <div><h1>Формулы и факты</h1><p id="hdSub">Планиметрия · по шпаргалке</p></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Разделы">
    <button role="tab" id="t-ser" data-tab="ser" aria-selected="true">Серия</button>
    <button role="tab" id="t-top" data-tab="top" aria-selected="false">Темы</button>
    <button role="tab" id="t-errs" data-tab="errs" aria-selected="false">Ошибки<span class="cnt" id="errCnt" data-zero>0</span></button>
    <button role="tab" id="t-stats" data-tab="stats" aria-selected="false">Итоги</button>
  </nav>

  <main>
    <section id="p-ser" role="tabpanel" aria-labelledby="t-ser">
      <div id="serStart"></div>
      <div id="serRun" hidden>
        <div class="bar"><span id="sTitle"></span><span id="sProg"></span></div>
        <div class="track"><i id="sTrack"></i></div>
        <div id="sCard"></div>
      </div>
      <div class="done" id="serDone" hidden></div>
    </section>

    <section id="p-top" role="tabpanel" aria-labelledby="t-top" hidden>
      <div id="topBody"></div>
    </section>

    <section id="p-errs" role="tabpanel" aria-labelledby="t-errs" hidden>
      <div id="errsBody"></div>
    </section>

    <section id="p-stats" role="tabpanel" aria-labelledby="t-stats" hidden>
      <div id="statsBody"></div>
      <p class="sync" id="sync"></p>
      <div id="resetBox"><button class="btn small danger" id="reset">Сбросить прогресс</button></div>
    </section>
  </main>

<script>

":"cos 60° = ½."},{"id":"T-07","type":"mc","t":"T","q":"sin 120° = …","opts":["√3/2","−½","−√3/2","½"],"correct":0,"why":"sin 120° = √3/2. Синус тупого угла положителен: sin(180° − α) = sin α."},{"id":"T-08","type":"mc","t":"T","q":"cos 120° = …","opts":["−½","√3/2","½","0"],"correct":0,"why":"cos 120° = −½. Косинус тупого угла отрицателен: cos(180° − α) = −cos α."},{"id":"T-09","type":"mc","t":"T","q":"sin 135° = …","opts":["√2/2","−√2/2","½","0"],"correct":0,"why":"sin 135° = √2/2. Синус тупого угла положителен: sin(180° − α) = sin α."},{"id":"T-10","type":"mc","t":"T","q":"cos 135° = …","opts":["−√2/2","√2/2","½","0"],"correct":0,"why":"cos 135° = −√2/2. Косинус тупого угла отрицателен: cos(180° − α) = −cos α."},{"id":"T-11","type":"mc","t":"T","q":"sin 150° = …","opts":["½","−√3/2","−½","√3/2"],"correct":0,"why":"sin 150° = ½. Синус тупого угла положителен: sin(180° − α) = sin α."},{"id":"T-12","type":"mc","t":"T","q":"cos 150° = …","opts":["−√3/2","½","√3/2","0"],"correct":0,"why":"cos 150° = −√3/2. Косинус тупого угла отрицателен: cos(180° − α) = −cos α."},{"id":"T-13","type":"mc","t":"T","q":"tg 30° = …","opts":["√3/3","−√3/3","1","√3"],"correct":0,"why":"tg 30° = sin/cos = √3/3."},{"id":"T-14","type":"mc","t":"T","q":"tg 60° = …","opts":["√3","−√3","√3/3","1"],"correct":0,"why":"tg 60° = sin/cos = √3."},{"id":"T-15","type":"mc","t":"T","q":"tg 120° = …","opts":["−√3","√3","√3/3","1"],"correct":0,"why":"tg 120° = sin/cos = −√3."},{"id":"T-16","type":"mc","t":"T","q":"tg 150° = …","opts":["−√3/3","√3/3","1","√3"],"correct":0,"why":"tg 150° = sin/cos = −√3/3."},{"id":"T-17","type":"mc","t":"T","q":"sin(180° − α) = …","opts":["sin α","−sin α","cos α","−cos α"],"correct":0,"why":"Смежные углы имеют одинаковый синус — отсюда двузначность угла по синусу.","k":"f"},{"id":"T-18","type":"mc","t":"T","q":"cos(180° − α) = …","opts":["−cos α","cos α","sin α","−sin α"],"correct":0,"why":"Косинусы смежных углов противоположны.","k":"f"},{"id":"T-19","type":"mc","t":"T","q" одолжения высот."},{"id":"0-05","type":"mc","t":"0","q":"Центр вневписанной окружности, касающейся стороны BC, — пересечение…","opts":["биссектрисы угла A и биссектрис внешних углов B и C","биссектрис внешних углов A, B и C","биссектрис углов B и C","серединных перпендикуляров к AB и AC"],"correct":0,"why":"Окружность вписана в угол A и касается продолжений сторон."},{"id":"0-06","type":"mc","t":"0","q":"Где лежит центр описанной окружности тупоугольного треугольника?","opts":["вне треугольника","внутри треугольника","на середине большей стороны","в вершине тупого угла"],"correct":0,"why":"Внутри — у остроугольного, на середине гипотенузы — у прямоугольного."},{"id":"0-07","type":"mc","t":"0","q":"Где лежит ортоцентр прямоугольного треугольника?","opts":["в вершине прямого угла","на середине гипотенузы","вне треугольника","внутри треугольника"],"correct":0,"why":"Катеты сами являются высотами."},{"id":"0-08","type":"ms","t":"0","q":"Отметь точки, которые лежат внутри любого треугольника.","stmts":[{"t":"центр вписанной окружности I","ok":true},{"t":"точка пересечения медиан M","ok":true},{"t":"центр описанной окружности O","ok":false},{"t":"ортоцентр H","ok":false},{"t":"центр вневписанной окружности I_a","ok":false}],"why":"O и H выходят наружу у тупоугольного треугольника, I_a всегда снаружи."},{"id":"0-09","type":"mc","t":"0","q":"Точки, равноудалённые от сторон угла, лежат на…","opts":["биссектрисе угла","серединном перпендикуляре","окружности с центром в вершине","медиане"],"correct":0,"why":"Это ГМТ."},{"id":"0-10","type":"mc","t":"0","q":"Точки, равноудалённые от концов отрезка AB, лежат на…","opts":["серединном перпендикуляре к AB","биссектрисе угла","окружности с диаметром AB","прямой, параллельной AB"],"correct":0,"why":"Это ГМТ."},{"id":"0-11","type":"mc","t":"0","q":"Точки, из которых отрезок AB виден под прямым углом, лежат на…","opts":["окружности с диаметром AB (кроме A и B)","серединном перпендикуляре к AB","прямой, параллельной AB","окружности с цен "q":"Площадь сегмента (α — центральный угол в радианах) равна…","opts":["½R²(α − sin α)","½R²(α + sin α)","½R²α","R²(α − sin α)"],"correct":0,"why":"Сектор ½R²α минус треугольник ½R² sin α.","k":"f"},{"id":"0-20","type":"tf","t":"0","q":"Две стороны и угол, лежащий против одной из них, — признак равенства треугольников.","ok":false,"why":"Не признак: углы против другой стороны либо равны, либо дают в сумме 180°."},{"id":"0-21","type":"tf","t":"0","q":"Прямоугольные треугольники равны по гипотенузе и катету.","ok":true,"why":"Это признак равенства прямоугольных треугольников."},{"id":"0-22","type":"tf","t":"0","q":"Треугольник со сторонами 3, 4 и 8 существует.","ok":false,"why":"8 > 3 + 4 — нарушено неравенство треугольника."},{"id":"0-23","type":"tf","t":"0","q":"Если две медианы треугольника равны, он равнобедренный.","ok":true,"why":"Обратное свойство равнобедренного треугольника; так же для двух высот и двух биссектрис."},{"id":"0-24","type":"tf","t":"0","q":"Если из одной вершины треугольника совпали биссектриса и высота, он равнобедренный.","ok":true,"why":"Совпадение двух из трёх линий (медиана, биссектриса, высота) из одной вершины ⇒ равнобедренный."},{"id":"0-25","type":"tf","t":"0","q":"В равнобедренном треугольнике центры вписанной и описанной окружностей, точка пересечения медиан и ортоцентр лежат на одной прямой.","ok":true,"why":"Все они на высоте к основанию — оси симметрии."},{"id":"0-26","type":"tf","t":"0","q":"Центр вписанной окружности может лежать вне треугольника.","ok":false,"why":"Центр вписанной окружности всегда внутри."},{"id":"0-27","type":"tf","t":"0","q":"Против большей стороны треугольника лежит больший угол.","ok":true,"why":"И наоборот: против большего угла — большая сторона."},{"id":"0-28","type":"num","t":"0","q":"Найдите сумму углов выпуклого шестиугольника (в градусах).","ans":720,"hint":"180°(n − 2).","sol":"180°·4 = 720°."},{"id":"0-29","type":"num","t":"0","q":"Сколько сторон у выпуклого многоугольника, сумма углов которого 144 рону на x и y. Тогда…","opts":["r² = xy","r = x + y","r² = x² + y²","r = (x + y)/2"],"correct":0,"why":"Боковая сторона видна из центра под 90°, r — высота прямоугольного треугольника.","k":"f"},{"id":"14-06","type":"mc","t":"14","q":"Равнобедренная трапеция с вписанной окружностью: боковая сторона c = …","opts":["(a + b)/2","(a − b)/2","√(ab)","a + b"],"correct":0,"why":"a + b = 2c.","k":"f"},{"id":"14-07","type":"mc","t":"14","q":"Равнобедренная трапеция с основаниями a и b описана около окружности. Её высота h = …","opts":["√(ab)","(a + b)/2","(a − b)/2","2√(ab)"],"correct":0,"why":"h² = c² − ((a − b)/2)² = ab.","k":"f"},{"id":"14-08","type":"ms","t":"14","q":"Отметь четырёхугольники, в которые ВСЕГДА можно вписать окружность.","stmts":[{"t":"ромб","ok":true},{"t":"квадрат","ok":true},{"t":"дельтоид","ok":true},{"t":"прямоугольник, не являющийся квадратом","ok":false},{"t":"равнобедренная трапеция","ok":false},{"t":"параллелограмм","ok":false}],"why":"Нужно a + c = b + d: у ромба и дельтоида это выполнено всегда."},{"id":"14-09","type":"tf","t":"14","q":"Центр вписанной окружности многоугольника — точка пересечения биссектрис его углов.","ok":true,"why":"Он равноудалён от всех сторон."},{"id":"14-10","type":"tf","t":"14","q":"В описанной трапеции высота равна диаметру вписанной окружности.","ok":true,"why":"Окружность касается двух параллельных оснований: h = 2r."},{"id":"14-11","type":"tf","t":"14","q":"Из центра вписанной окружности боковая сторона описанной трапеции видна под прямым углом.","ok":true,"why":"Биссектрисы односторонних углов перпендикулярны."},{"id":"14-12","type":"num","t":"14","q":"Стороны треугольника 13, 14, 15. Найдите радиус вписанной окружности.","ans":4,"hint":"r = S/p.","sol":"84/21 = 4."},{"id":"14-13","type":"num","t":"14","q":"Основания равнобедренной трапеции с вписанной окружностью 2 и 8. Найдите r.","ans":2,"hint":"h = √(ab) = 2r.","sol":"h = 4, r = 2."},{"id":"14-14","type":"num","t":"14","q":"Сторона правильного треугольника 6√3. Найдите радиус вписанной окружности.","ans":3,"hint":"r = a√3/6.","sol":"6√3·√3/6 = 3."},{"id":"14-15","type":"num","t":"14","q":"Окружность радиуса 3 вписана в угол 60°. Найдите расстояние от вершины угла до центра.","ans":6,"hint":"r/sin(α/2).","sol":"3/sin 30° = 6."},{"id":"15-01","type":"mc","t":"15","q":"R = a/…","opts":["(2 sin A)","sin A","(2 cos A)","(4 sin A)"],"correct":0,"why":"Теорема синусов.","k":"f"},{"id":"15-02","type":"mc","t":"15","q":"R = abc/…","opts":["(4S)","(2S)","S","(4p)"],"correct":0,"why":"Из S = abc/(4R).","k":"f"},{"id":"15-03","type":"mc","t":"15","q":"R равнобедренного треугольника (боковая сторона b, высота к основанию h)…","opts":["b²/(2h)","b²/h","h²/(2b)","b/(2h)"],"correct":0,"why":"R = b/(2 sin β), sin β = h/b.","k":"f"},{"id":"15-04","type":"mc","t":"15","q":"Расстояние от центра описанной окружности O до стороны BC…","opts":["R·|cos A|","R·sin A","R·|cos B|","R/2"],"correct":0,"why":"∠BOM = ∠A, M — середина BC.","k":"f"},{"id":"15-05","type":"mc","t":"15","q":"Формула Эйлера: OI² = …","opts":["R² − 2Rr","R² + 2Rr","R² − r²","(R − r)²"],"correct":0,"why":"Отсюда R ≥ 2r.","k":"f"},{"id":"15-06","type":"mc","t":"15","q":"Около какой из фигур в общем случае НЕЛЬЗЯ описать окружность?","opts":["ромб","прямоугольник","квадрат","равнобедренная трапеция"],"correct":0,"why":"У ромба общего вида противоположные углы в сумме не 180°."},{"id":"15-07","type":"mc","t":"15","q":"Центральный угол BOC (∠A острый) равен…","opts":["2∠A","∠A","180° − ∠A","∠A/2"],"correct":0,"why":"Центральный угол вдвое больше вписанного.","k":"f"},{"id":"15-08","type":"tf","t":"15","q":"Для любого треугольника R ≥ 2r.","ok":true,"why":"Равенство только у правильного."},{"id":"15-09","type":"tf","t":"15","q":"Центр описанной окружности остроугольного треугольника лежит внутри него.","ok":true,"why":"У прямоугольного — на гипотенузе, у тупоугольного — снаружи."},{"id":"15-10","type":"tf","t":"15","q":"Любая хорда окружности не длиннее её диаметра.","ok":true,"why":"Хорда ≤ 2R — удобная проверка ответа."},{"id":"15-11","type":"tf","t":"15","q":"Около параллелограмма общего вида можно описать окружность.","ok":false,"why":"Вписанный параллелограмм — только прямоугольник."},{"id":"15-12","type":"num","t":"15","q":"Стороны треугольника 5, 5, 6. Найдите радиус описанной окружности.","ans":3.125,"hint":"R = b²/(2h).","sol":"h = 4, R = 25/8 = 3,125."},{"id":"15-13","type":"num","t":"15","q":"Катеты прямоугольного треугольника 7 и 24. Найдите R.","ans":12.5,"hint":"R = c/2.","sol":"c = 25, R = 12,5."},{"id":"15-14","type":"num","t":"15","q":"BC = 8, ∠A = 150°. Найдите R.","ans":8,"hint":"R = a/(2 sin A).","sol":"8/(2·½) = 8."},{"id":"15-15","type":"num","t":"15","q":"R = 10, ∠A = 60°. Найдите расстояние от центра описанной окружности до BC.","ans":5,"hint":"R·cos A.","sol":"10·½ = 5."},{"id":"16-01","type":"mc","t":"16","q":"Около трапеции можно описать окружность ⇔ …","opts":["она равнобедренная","она прямоугольная","в неё можно вписать окружность","её диагонали перпендикулярны"],"correct":0,"why":"Углы при основании равны, сумма противоположных — 180°."},{"id":"16-02","type":"mc","t":"16","q":"Центр окружности, описанной около трапеции, лежит…","opts":["на оси симметрии — прямой через середины оснований","на большем основании","на средней линии","в точке пересечения диагоналей"],"correct":0,"why":"Серединные перпендикуляры к основаниям совпадают."},{"id":"16-03","type":"mc","t":"16","q":"R трапеции через диагональ d и угол α при основании…","opts":["d/(2 sin α)","d/sin α","d/(2 cos α)","2d sin α"],"correct":0,"why":"Окружность трапеции — окружность △ABD.","k":"f"},{"id":"16-04","type":"mc","t":"16","q":"R трапеции через боковую сторону c, диагональ d и высоту h…","opts":["cd/(2h)","cd/h","ch/(2d)","dh/(2c)"],"correct":0,"why":"R = abc/(4S) для △ABD, S_{ABD} = ½ah.","k":"f"},{"id":"16-05","type":"mc","t":"16","q":"Большее основание AD трапеции — диаметр описанной окружности. Тогда…","opts":["∠ABD = ∠ACD = 90°","∠ABC = 90°","трапец сегда можно вписать окружность.","ok":true,"why":"AB + CD = AD + BC выполнено."},{"id":"17-07","type":"tf","t":"17","q":"Если PA и PB — касательные из точки P, то ∠APB + ∠AOB = 180°.","ok":true,"why":"В PAOB два прямых угла."},{"id":"17-08","type":"tf","t":"17","q":"Ромб — частный случай дельтоида.","ok":true,"why":"Все четыре стороны равны."},{"id":"17-09","type":"num","t":"17","q":"Из точки P проведена касательная PA = 12 к окружности радиуса 5. Найдите PO.","ans":13,"hint":"OA ⊥ PA.","sol":"√(144 + 25) = 13."},{"id":"17-10","type":"num","t":"17","q":"Касательные PA и PB, PA = 4, r = 3. Найдите AB.","ans":4.8,"hint":"AB = 2·PA·r/PO.","sol":"PO = 5, AB = 24/5 = 4,8."},{"id":"18-01","type":"mc","t":"18","q":"Вписанный угол равен…","opts":["половине дуги, на которую опирается","дуге, на которую опирается","удвоенной дуге","180° минус дуга"],"correct":0,"why":"Центральный угол равен дуге, вписанный — её половине."},{"id":"18-02","type":"mc","t":"18","q":"Угол между касательной и хордой, проведённой в точку касания, равен…","opts":["половине дуги, заключённой между ними","дуге между ними","180° минус половина дуги","удвоенной дуге"],"correct":0,"why":"Он равен вписанному углу, опирающемуся на эту хорду с другой стороны."},{"id":"18-03","type":"mc","t":"18","q":"Угол между хордами, пересекающимися внутри круга, равен…","opts":["полусумме дуг, на которые опираются он и вертикальный ему","полуразности этих дуг","сумме этих дуг","половине большей из дуг"],"correct":0,"why":"Внешний угол треугольника и два вписанных угла."},{"id":"18-04","type":"mc","t":"18","q":"Угол между секущими с вершиной вне круга равен…","opts":["полуразности дальней и ближней дуг","полусумме дуг","разности дуг","половине дальней дуги"],"correct":0,"why":"Так же для касательной и секущей и для двух касательных."},{"id":"18-05","type":"mc","t":"18","q":"Угол между двумя касательными, проведёнными из точки P, равен…","opts":["180° минус меньшая дуга между точками касания","половине меньшей дуги","меньшей дуге","90° минус половина меньшей дуги"],"correct":0,"why":"∠P + ∠AOB = 180°."},{"id":"18-06","type":"mc","t":"18","q":"Вписанные углы, опирающиеся на одну хорду с разных сторон от неё, …","opts":["в сумме дают 180°","равны","в сумме дают 90°","отличаются на 90°"],"correct":0,"why":"Вместе их дуги составляют всю окружность."},{"id":"18-07","type":"mc","t":"18","q":"Из точки внутри круга (не на окружности) диаметр виден под…","opts":["тупым углом","прямым углом","острым углом","углом 60°"],"correct":0,"why":"С окружности — под прямым, снаружи — под острым."},{"id":"18-08","type":"tf","t":"18","q":"Прямой вписанный угол опирается на диаметр.","ok":true,"why":"Он опирается на дугу 180°."},{"id":"18-09","type":"tf","t":"18","q":"Равные хорды стягивают равные дуги.","ok":true,"why":"И наоборот."},{"id":"18-10","type":"tf","t":"18","q":"Диаметр виден из точек вне круга под тупым углом.","ok":false,"why":"Снаружи — под острым."},{"id":"18-11","type":"num","t":"18","q":"Хорды AB и CD пересекаются. Угол APC опирается на дугу 70°, вертикальный ему — на дугу 110°. Найдите ∠APC (в градусах).","ans":90,"hint":"Полусумма дуг.","sol":"(70° + 110°)/2 = 90°."},{"id":"18-12","type":"num","t":"18","q":"Меньшая дуга между точками касания двух касательных равна 110°. Найдите угол между касательными (в градусах).","ans":70,"hint":"180° − меньшая дуга.","sol":"180° − 110° = 70°."},{"id":"18-13","type":"num","t":"18","q":"Хорда стягивает дугу 80°. Найдите острый угол между хордой и касательной в её конце (в градусах).","ans":40,"hint":"Половина дуги.","sol":"80°/2 = 40°."},{"id":"18-14","type":"num","t":"18","q":"Две секущие из точки вне круга: дальняя дуга 150°, ближняя 40°. Найдите угол между секущими (в градусах).","ans":55,"hint":"Полуразность дуг.","sol":"(150° − 40°)/2 = 55°."},{"id":"19-01","type":"mc","t":"19","q":"Хорды AB и CD пересекаются в точке P. Тогда…","opts":["AP·PB = CP·PD","AP·PC = BP·PD","AP + PB = CP + PD","AP : PB = CP : PD"],"correct":0,"why":"△APC ~ △DPB.","k":"f"},{"id":"19-02","type":"mc","t":"19","q":"Секущие PAB и PCD из внешней точки P. Тогда…","opts":["PA·PB = PC·PD","PA·AB = PC·CD","PA + PB = PC + PD","PA : PB = PC : PD"],"correct":0,"why":"Внешняя часть × вся секущая.","k":"f"},{"id":"19-03","type":"mc","t":"19","q":"Касательная PT и секущая PAB. Тогда…","opts":["PT² = PA·PB","PT² = PA·AB","PT = PA + AB","PT² = PA² + PB²"],"correct":0,"why":"△PTA ~ △PBT.","k":"f"},{"id":"19-04","type":"mc","t":"19","q":"Степень точки P относительно окружности (центр O, радиус R) — произведение отрезков равно…","opts":["|PO² − R²|","PO² + R²","PO·R","(PO − R)²"],"correct":0,"why":"Проведи прямую через центр.","k":"f"},{"id":"19-05","type":"mc","t":"19","q":"Хорда на расстоянии d от центра окружности радиуса R равна…","opts":["2√(R² − d²)","√(R² − d²)","2√(R² + d²)","2(R − d)"],"correct":0,"why":"Перпендикуляр из центра делит хорду пополам.","k":"f"},{"id":"19-06","type":"mc","t":"19","q":"Диаметр, перпендикулярный хорде, …","opts":["делит её и обе стягиваемые ею дуги пополам","равен ей","делит её в отношении 1 : 2","касается её"],"correct":0,"why":"Центр лежит на серединном перпендикуляре к хорде."},{"id":"19-07","type":"mc","t":"19","q":"Касательная, параллельная хорде, касается окружности…","opts":["в середине дуги, стягиваемой хордой","в конце хорды","в любой точке дуги","в точке на продолжении хорды"],"correct":0,"why":"Радиус в точку касания ⊥ касательной, а значит, и хорде."},{"id":"19-08","type":"tf","t":"19","q":"Равные хорды равноудалены от центра.","ok":true,"why":"И наоборот."},{"id":"19-09","type":"tf","t":"19","q":"Дуги, заключённые между параллельными хордами, равны.","ok":true,"why":"Из симметрии относительно перпендикулярного диаметра."},{"id":"19-10","type":"tf","t":"19","q":"Любая прямая, проходящая через середину хорды, перпендикулярна ей.","ok":false,"why":"Перпендикулярен ей диаметр через её середину (если хорда — не диаметр)."},{"id":"19-11","type":"num","t":"19","q":"Хорды AB и CD пересекаются в P: AP = 6, PB = 4, CP = 3. Найдите PD.","ans":8,"hint":"AP·PB = CP·PD.","sol":"24/3 = 8."},{"id":"19-12","type":"num","t":"19","q":"Из точки P проведены секущая (PA = 5, PB = 20) и касательная PT. Найдите PT.","ans":10,"hint":"PT² = PA·PB.","sol":"√100 = 10."},{"id":"19-13","type":"num","t":"19","q":"R = 13, расстояние от центра до хорды 5. Найдите хорду.","ans":24,"hint":"2√(R² − d²).","sol":"2·12 = 24."},{"id":"19-14","type":"num","t":"19","q":"Вписанный угол, опирающийся на хорду, равен 30°, R = 7. Найдите хорду.","ans":7,"hint":"Хорда = 2R sin α.","sol":"14·½ = 7."},{"id":"19-15","type":"num","t":"19","q":"Точка P внутри окружности радиуса 10, PO = 6. Найдите произведение отрезков любой хорды, проходящей через P.","ans":64,"hint":"R² − PO².","sol":"100 − 36 = 64."},{"id":"20-01","type":"mc","t":"20","q":"Длина общей внешней касательной (радиусы R > r, расстояние между центрами d)…","opts":["√(d² − (R − r)²)","√(d² − (R + r)²)","√(d² + (R − r)²)","d − R + r"],"correct":0,"why":"Сдвинь касательную в центр меньшей окружности.","k":"f"},{"id":"20-02","type":"mc","t":"20","q":"Длина общей внутренней касательной…","opts":["√(d² − (R + r)²)","√(d² − (R − r)²)","d − R − r","√(d² + (R + r)²)"],"correct":0,"why":"Радиусы в точки касания смотрят в разные стороны: катет R + r.","k":"f"},{"id":"20-03","type":"mc","t":"20","q":"Окружности касаются внешним образом. Длина общей внешней касательной…","opts":["2√(Rr)","√(Rr)","R + r","2(R + r)"],"correct":0,"why":"(R + r)² − (R − r)² = 4Rr.","k":"f"},{"id":"20-04","type":"mc","t":"20","q":"Сколько общих касательных у окружностей, касающихся внешним образом?","opts":["3","4","2","1"],"correct":0,"why":"Две внешние и одна в точке касания."},{"id":"20-05","type":"mc","t":"20","q":"Сколько общих касательных у двух пересекающихся окружностей?","opts":["2","1","3","4"],"correct":0,"why":"Только две внешние."},{"id":"20-06","type":"mc","t":"20","q":"Окружности касаются внутренним образом. Расстояние между центрами…","opts":["R − r","R + r","√(R² − r²)","2√(Rr)"],"correct":0,"why":"Точка касания лежит на линии центров.","k":"f"},{"id":"20-07","type":"mc","t":"20","q":"Окружности касаются внешне, α — угол между общей внешней касательной и линией центров. sin α = …","opts":["(R − r)/(R + r)","(R + r)/(R − r)","r/R","2√(Rr)/(R + r)"],"correct":0,"why":"Прямоугольный треугольник с гипотенузой R + r и катетом R − r.","k":"f"},{"id":"20-08","type":"tf","t":"20","q":"Точка касания двух окружностей лежит на линии их центров.","ok":true,"why":"Общая касательная в ней перпендикулярна линии центров."},{"id":"20-09","type":"tf","t":"20","q":"Две общие внешние касательные двух окружностей разного радиуса пересекаются на линии центров.","ok":true,"why":"Из симметрии относительно линии центров. При равных радиусах они параллельны."},{"id":"20-10","type":"tf","t":"20","q":"Общая хорда двух пересекающихся окружностей перпендикулярна линии центров и делится ею пополам.","ok":true,"why":"Центры и точки пересечения — вершины дельтоида."},{"id":"20-11","type":"tf","t":"20","q":"Окружности касаются внешне в точке K, AB — их общая внешняя касательная. Тогда ∠AKB = 60°.","ok":false,"why":"∠AKB = 90°: MA = MK = MB."},{"id":"20-12","type":"num","t":"20","q":"Окружности радиусов 9 и 1 касаются внешним образом. Найдите отрезок общей внешней касательной.","ans":6,"hint":"2√(Rr).","sol":"2·3 = 6."},{"id":"20-13","type":"num","t":"20","q":"d = 10, R = 4, r = 2. Найдите отрезок общей внутренней касательной.","ans":8,"hint":"√(d² − (R + r)²).","sol":"√(100 − 36) = 8."},{"id":"20-14","type":"num","t":"20","q":"d = 13, R = 8, r = 3. Найдите отрезок общей внешней касательной.","ans":12,"hint":"√(d² − (R − r)²).","sol":"√(169 − 25) = 12."},{"id":"21-01","type":"ms","t":"21","q":"Отметь условия, каждое из которых гарантирует, что четырёхугольник ABCD вписанный.","stmts":[{"t":"∠A + ∠C = 180°","ok":true},{"t":"∠ABD = ∠ACD, причём B и C по одну сторону от AD","ok":true},{"t":"AP·PB = CP·PD, где P — пересечение прямых AB и CD (на обоих отрезках или на продолжениях обоих)","ok":true},{"t":"AB + CD = BC + AD","ok":false},{"t":"диагонали перпендикулярны","ok":false},{"t":"диагонали равны","ok":false}],"why":"AB + CD = BC + AD — признак описанного четырёхугольника."},{"id":"21-02","type":"mc","t":"21","q":"Теорема Птолемея для вписанного ABCD: AC·BD = …","opts":["AB·CD + BC·AD","AB·BC + CD·AD","AB·AD + BC·CD","AB² + CD²"],"correct":0,"why":"Произведение диагоналей = сумма произведений противоположных сторон.","k":"f"},{"id":"21-03","type":"mc","t":"21","q":"Во вписанном четырёхугольнике внешний угол при вершине равен…","opts":["внутреннему углу при противоположной вершине","внутреннему углу при той же вершине","половине противоположного угла","сумме двух соседних углов"],"correct":0,"why":"Он смежен с ∠A, а ∠A + ∠C = 180°."},{"id":"21-04","type":"mc","t":"21","q":"Вписанный параллелограмм — это…","opts":["прямоугольник","ромб","квадрат","любой параллелограмм"],"correct":0,"why":"Противоположные углы равны и в сумме 180°."},{"id":"21-05","type":"mc","t":"21","q":"Вписанный четырёхугольник с перпендикулярными диагоналями: AB² + CD² = …","opts":["4R²","2R²","R²","AC·BD"],"correct":0,"why":"Расстояние от центра до стороны равно половине противоположной стороны.","k":"f"},{"id":"21-06","type":"mc","t":"21","q":"Отрезок AB виден из точек C и D под прямым углом. Тогда точки A, B, C, D…","opts":["лежат на окружности с диаметром AB","образуют прямоугольник","лежат на одной прямой","образуют ромб"],"correct":0,"why":"ГМТ, из которых отрезок виден под 90°."},{"id":"21-07","type":"tf","t":"21","q":"В четырёхугольник можно вписать окружность ⇔ AB + CD = BC + AD.","ok":true,"why":"Признак описанного четырёхугольника."},{"id":"21-08","type":"tf","t":"21","q":"Вписанная трапеция — равнобедренная.","ok":true,"why":"Иначе сумма противоположных углов не 180°."},{"id":"21-09","type":"tf","t":"21","q":"Около любого дельтоида можно описать окружность.","ok":false,"why":"Только если ∠B = ∠D = 90°."},{"id":"21-10","type":"num","t":"21","q":"ABCD — вписанный четырёхугольник, ∠A = 105°. Найдите ∠C (в градусах).","ans":75,"hint":"∠A + ∠C = 180°.","sol":"180° − 105° = 75°."},{"id":"21-11","type":"num","t":"21","q":"Вписанный ABCD: AB = 3, BC = 4, CD = 5, DA = 6. Найдите произведение диагоналей AC·BD.","ans":39,"hint":"Птолемей.","sol":"3·5 + 4·6 = 39."},{"id":"22-01","type":"mc","t":"22","q":"Средняя линия трапеции…","opts":["(a + b)/2","(a − b)/2","√(ab)","2ab/(a + b)"],"correct":0,"why":"Полусумма оснований.","k":"f"},{"id":"22-02","type":"mc","t":"22","q":"Диагонали делят среднюю линию трапеции на части…","opts":["b/2, (a − b)/2, b/2","a/2, (a − b)/2, a/2","(a + b)/6 каждая","b/2, (a + b)/2, b/2"],"correct":0,"why":"Средние линии треугольников ABC, BCD и ABD.","k":"f"},{"id":"22-03","type":"mc","t":"22","q":"Отрезок между серединами диагоналей трапеции…","opts":["(a − b)/2","(a + b)/2","a − b","b/2"],"correct":0,"why":"Средний кусок средней линии.","k":"f"},{"id":"22-04","type":"mc","t":"22","q":"Отрезок через точку пересечения диагоналей, параллельный основаниям…","opts":["2ab/(a + b)","(a + b)/2","√(ab)","√((a² + b²)/2)"],"correct":0,"why":"Точка O делит его пополам.","k":"f"},{"id":"22-05","type":"mc","t":"22","q":"Отрезок, параллельный основаниям и делящий трапецию на две подобные…","opts":["√(ab)","2ab/(a + b)","(a + b)/2","√((a² + b²)/2)"],"correct":0,"why":"x/b = a/x.","k":"f"},{"id":"22-06","type":"mc","t":"22","q":"Отрезок, параллельный основаниям и делящий трапецию на две равновеликие…","opts":["√((a² + b²)/2)","√(ab)","(a + b)/2","2ab/(a + b)"],"correct":0,"why":"Среднее квадратическое оснований.","k":"f"},{"id":"22-07","type":"mc","t":"22","q":"Какие четыре точки трапеции лежат на одной прямой?","opts":["середины оснований, точка пересечения диагоналей и точка пересечения продолжений боковых сторон","середины боковых сторон и середины диагоналей и вершина A","середины диагоналей и вершины A и D","центр описанной окружности, середины боковых сторон и вершина B"],"correct":0,"why":"«Замечательное свойство трапеции»."},{"id":"22-08","type":"tf","t":"22","q":"Средняя линия трапеции делит пополам любой отрезок с концами на основаниях.","ok":true,"why":"Обобщённая теорема Фалеса."},{"id":"22-09","type":"tf","t":"22","q":"Если диагонали трапеции перпендикулярны, отрезок между серединами оснований равен средней линии.","ok":true,"why":"Медианы к гипотенузам прямоугольных треугольников AOD и BOC."},{"id":"22-10","type":"num","t":"22","q":"Основания трапеции 5 и 15. Найдите отрезок между серединами диагоналей.","ans":5,"hint":"(a − b)/2.","sol":"(15 − 5)/2 = 5."},{"id":"22-11","type":"num","t":"22","q":"Основания трапеции 3 и 6. Найдите отрезок, проходящий через точку пересечения диагоналей параллельно основаниям.","ans":4,"hint":"2ab/(a + b).","sol":"36/9 = 4."},{"id":"22-12","type":"num","t":"22","q":"Основания трапеции 4 и 9. Найдите отрезок, параллельный основаниям и делящий её на две подобные трапеции.","ans":6,"hint":"√(ab).","sol":"√36 = 6."},{"id":"22-13","type":"num","t":"22","q":"Основания трапеции 1 и 7. Найдите отрезок, параллельный основаниям и делящий её на две равновеликие части.","ans":5,"hint":"√((a² + b²)/2).","sol":"√25 = 5."},{"id":"23-01","type":"ms","t":"23","q":"Отметь признаки параллелограмма.","stmts":[{"t":"две противоположные стороны равны и параллельны","ok":true},{"t":"противоположные стороны попарно равны","ok":true},{"t":"диагонали точкой пересечения делятся пополам","ok":true},{"t":"противоположные углы попарно равны","ok":true},{"t":"две противоположные стороны равны, а две другие параллельны","ok":false},{"t":"диагонали равны","ok":false}],"why":"«Две стороны равны, две другие параллельны» бывает и у равнобедренной трапеции."},{"id":"23-02","type":"mc","t":"23","q":"Параллелограмм с равными диагоналями — это…","opts":["прямоугольник","ромб","квадрат","дельтоид"],"correct":0,"why":"Признак прямоугольника."},{"id":"23-03","type":"mc","t":"23","q":"Параллелограмм с перпендикулярными диагоналями — это…","opts":["ромб","прямоугольник const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function fmt(s){
  s = String(s); let out = '', i = 0;
  while (i < s.length) {
    const ch = s[i];
    if (ch === '\n') { out += '<br>'; i++; continue; }
    if (ch === '_') {
      const nx = s[i + 1] || '';
      if (nx === '{') { const j = s.indexOf('}', i + 2); if (j > 0) { out += '<sub>' + fmt(s.slice(i + 2, j)) + '</sub>'; i = j + 1; continue; } }
      if (/[а-яё]/i.test(nx)) { let j = i + 1; while (j < s.length && /[а-яё]/i.test(s[j])) j++; out += '<sub>' + esc(s.slice(i + 1, j)) + '</sub>'; i = j; continue; }
      if (/[a-z]/i.test(nx)) { out += '<sub><i>' + nx + '</i></sub>'; i += 2; continue; }
      if (/[0-9△]/.test(nx)) { out += '<sub>' + nx + '</sub>'; i += 2; continue; }
    }
    if (ch === '^' && /[0-9]/.test(s[i + 1] || '')) { out += '<sup>' + s[i + 1] + '</sup>'; i += 2; continue; }
    if (/[A-Za-z]/.test(ch)) { let j = i; while (j < s.length && /[A-Za-z]/.test(s[j])) j++; const w = s.slice(i, j);
      out += FN.has(w) ? w : '<i>' + w + '</i>'; i = j; continue; }
    out += esc(ch); i++;
  }
  return out;
}
const terminating = y => Math.abs(Math.round(y * 1000) - y * 1000) < 1e-6;
function fmtNum(x){
  let s = null;
  if (!terminating(x)) for (let d = 2; d <= 12 && !s; d++) { const n = Math.round(x * d); if (Math.abs(n / d - x) < 1e-9) s = n + '/' + d; }
  if (!s) s = String(Math.round(x * 1000) / 1000).replace('.', ',');
  return s.replace('-', '−');
}
function parseNum(s){
  s = String(s).trim().replace(/\s+/g, '').replace(/[−–—]/g, '-').replace(/°$/, '').replace(/,/g, '.');
  const m = /^(-?\d+(?:\.\d+)?)[\/:](-?\d+(?:\.\d+)?)$/.exec(s);
  if (m) { const a = +m[1], b = +m[2]; return b ? a / b : NaN; }
  if (/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return Number(s);
  return NaN;
}

/* the user's own answer for the error list */
function answerLine(it){
  if (it.type === 'mc') {
    const a = `<b>${fmt(it.opts[it.correct])}</b>`, q = it.q.trim(), k = q.lastIndexOf('…');
    if (k >= 0) {
      const pre = q.slice(0, k), post = q.slice(k + 1);
      return fmt(pre) + (/[\p{L}\p{N})}]$/u.test(pre) ? ' ' : '') + a + (/^[\p{L}\p{N}(]/u.test(post) ? ' ' : '') + fmt(post);
    }
    if (/[—:]$/.test(q)) return fmt(q) + ' ' + a;
    return fmt(q) + ' → ' + a;
  }
  if (it.type === 'tf') return `<b>${it.ok ? 'Верно' : 'Неверно'}:</b> ${fmt(it.q)}`;
  if (it.type === 'num') return `${fmt(it.q)} → <b>${fmtNum(it.ans)}</b>`;
  return `${fmt(it.q)} → <b>${it.stmts.filter(s => s.ok).map(s => fmt(s.t)).join('; ')}</b>`;
}
function yourAnswer(it, ch){
  if (ch === 'idk') return 'не знаю';
  if (it.type === 'mc') return Number.isInteger(ch) && it.opts[ch] !== undefined ? fmt(it.opts[ch]) : '';
  if (it.type === 'tf') return ch === 1 ? '«верно»' : ch === 0 ? '«неверно»' : '';
  if (it.type === 'num') return typeof ch === 'string' && ch ? esc(ch) : 'не решил';
  if (it.type === 'ms' && Array.isArray(ch)) return ch.filter(si => it.stmts[si]).map(si => `«${fmt(it.stmts[si].t)}» — ${it.stmts[si].ok ? 'пропустил' : 'лишнее'}`).join('; ');
  return '';
}

/* ================= progress: this device + (for the owner) the account ================= */
const LS_KEY = 'planim-theory-v1';
const GOALS = [20, 30, 50, 80], LENS = [10, 20, 30];
const blank = () => ({ v: 1, upd: 0, it: {}, errs: {}, days: {}, sess: [], top: {}, typ: {},
  tot: { ans: 0, ok: 0, help: 0, hint: 0, sec: 0 }, set: { goal: 30, len: 20, recall: true, mix: 'all' } });
function sanitize(o){
  const b = blank();
  if (!o || typeof o !== 'object') return b;
  const obj = x => x && typeof x === 'object' && !Array.isArray(x);
  for (const k of ['it', 'errs', 'days', 'top', 'typ']) if (obj(o[k])) b[k] = JSON.parse(JSON.stringify(o[k]));
  if (Array.isArray(o.sess)) b.sess = JSON.parse(JSON.stringify(o.sess.filter(Array.isArray).slice(-40)));
  if (obj(o.tot)) for (const k in b.tot) b.tot[k] = +o.tot[k] || 0;
  if (obj(o.set)) {
    if (GOALS.includes(+o.set.goal)) b.set.goal = +o.set.goal;
    if (LENS.includes(+o.set.len)) b.set.len = +o.set.len;
    if (typeof o.set.recall === 'boolean') b.set.recall = o.set.recall;
    if (MIXES.some(m => m[0] === o.set.mix)) b.set.mix = o.set.mix;
  }
  for (const id in b.it) if (!Array.isArray(b.it[id]) || b.it[id].length < 5) delete b.it[id];
  for (const id in b.errs) if (!Array.isArray(b.errs[id]) || b.errs[id].length < 4) delete b.errs[id];
  for (const k in b.days) if (!Array.isArray(b.days[k])) delete b.days[k];
  b.upd = +o.upd || 0;
  return b;
}
let S = blank();
try { const raw = localStorage.getItem(LS_KEY); if (raw) S = sanitize(JSON.parse(raw)); } catch (e) {}
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} }
function commit(){ S.upd = Date.now(); saveLocal(); schedulePush(1500); renderBadges(); }

const cloud = { ref: null, ok: false, pushing: false, again: false, timer: null, retries: 0 };
function setSync(){
  const el = $('sync'); if (!el) return;
  el.textContent = cloud.ok
    ? 'Прогресс сохраняется в твоём аккаунте: он общий для телефона и компьютера.'
    : 'Прогресс сохраняется в этом браузере.';
}
function schedulePush(ms){ if (!cloud.ok) return; clearTimeout(cloud.timer); cloud.timer = setTimeout(push, ms); }
async function push(){
  if (!cloud.ok) return;
  if (cloud.pushing) { cloud.again = true; return; }
  cloud.pushing = true; cloud.timer = null;
  try { await cloud.ref.set(JSON.parse(JSON.stringify(S))); cloud.retries = 0; }
  catch (e) {
    if (e && e.code === 'unavailable' && cloud.retries < 2) { cloud.retries++; setTimeout(() => schedulePush(0), 2500 + Math.random() * 2500); }
    else if (!(e && e.code === 'resource_exhausted')) { cloud.ok = false; setSync(); }
  }
  cloud.pushing = false;
  if (cloud.again) { cloud.again = false; schedulePush(400); }
}
async function initCloud(){
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    if (!(await user.isOwner())) return;
    const ref = db.doc('progress/theory');
    const snap = await ref.get();
    cloud.ref = ref; cloud.ok = true;
    const remote = snap.exists ? snap.data() : null;
    if (remote && (+remote.upd || 0) > S.upd) { S = sanitize(remote); saveLocal(); refreshAll(); }
    else if (S.upd > ((remote && +remote.upd) || 0)) schedulePush(0);
    loadExtra(db);
  } catch (e) { cloud.ok = false; }
  setSync();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && cloud.ok && cloud.timer) { clearTimeout(cloud.timer); push(); }
});

/* Cards Claude adds later (after looking at the error list) live in the `bank` collection. */
function validItem(o, docId){
  if (!o || typeof o !== 'object') return null;
  const str = x => typeof x === 'string' && x.trim().length > 0 && x.length < 2000;
  const opt = x => str(x) ? x : '';
  const id = 'x-' + String(o.id || docId).replace(/[^\w-]/g, '').slice(0, 40);
  const t = TOPICS[String(o.t)] !== undefined ? String(o.t) : '0';
  const base = { id, t, src: 'add', why: opt(o.why) };
  if (o.type === 'mc' && str(o.q) && Array.isArray(o.opts) && o.opts.length === 4 && o.opts.every(str) && new Set(o.opts).size === 4
      && Number.isInteger(o.correct) && o.correct >= 0 && o.correct < 4)
    return { ...base, type: 'mc', q: o.q, opts: o.opts.slice(), correct: o.correct, ...(o.k === 'f' ? { k: 'f' } : {}) };
  if (o.type === 'tf' && str(o.q) && typeof o.ok === 'boolean') return { ...base, type: 'tf', q: o.q, ok: o.ok };
  if (o.type === 'num' && str(o.q) && Number.isFinite(o.ans)) return { ...base, type: 'num', q: o.q, ans: o.ans, hint: opt(o.hint), sol: opt(o.sol) };
  if (o.type === 'ms' && str(o.q) && Array.isArray(o.stmts) && o.stmts.length >= 3 && o.stmts.length <= 7
      && o.stmts.every(s => s && str(s.t) && typeof s.ok === 'boolean') && o.stmts.some(s => s.ok) && o.stmts.some(s => !s.ok))
    return { ...base, type: 'ms', q: o.q, stmts: o.stmts.map(s => ({ t: s.t, ok: s.ok })) };
  return null;
}
async function loadExtra(db){
  try {
    const qs = await db.collection('bank').get();
    let added = 0;
    for (const d of qs.docs) { const it = validItem(d.data(), d.id); if (it && !BYID[it.id]) { ITEMS.push(it); added++; } }
    if (added) { EXTRA = added; reindex(); refreshAll(); }
  } catch (e) {}
}

/* ================= spaced repetition ================= */
const st = id => S.it[id] || [0, 0, 0, 0, 0]; // [box, due, seen, ok, last]
function pruneDays(){ const keys = Object.keys(S.days).sort(); while (keys.length > 120) delete S.days[keys.shift()]; }
function bumpDay(clean, sec){
  const k = dayKey(Date.now()), d = S.days[k] || (S.days[k] = [0, 0, 0]);
  d[0]++; if (clean) d[1]++; d[2] += sec; S.tot.sec += sec; pruneDays();
}
/* res: {ok, help, sec, chosen, retry}. Clean = right on the first try without a hint. */
function record(it, res){
  const now = Date.now(), k = kindOf(it);
  let [box, , seen, okc] = st(it.id);
  const first = seen === 0, clean = res.ok && !res.help && !res.retry;
  seen++; if (res.ok) okc++;
  if (clean) box = first && res.sec <= FAST[k] ? 2 : Math.min(box + 1, 5);
  else if (res.ok) box = 1;
  else box = 0;
  S.it[it.id] = [box, now + INTERVALS[box], seen, okc, now];
  const e = S.errs[it.id];
  if (!res.ok) S.errs[it.id] = [(e ? e[0] : 0) + 1, 0, res.chosen === undefined ? null : res.chosen, now];
  else if (e && !res.retry) { if (clean) { e[1]++; if (e[1] >= 2) delete S.errs[it.id]; } else e[1] = 0; }
  if (!res.retry) {
    S.tot.ans++; if (clean) S.tot.ok++; else if (res.ok) S.tot.help++;
    const a = S.top[it.t] || (S.top[it.t] = [0, 0]); a[0]++; if (clean) a[1]++;
    const ty = S.typ[k] || (S.typ[k] = [0, 0]); ty[0]++; if (clean) ty[1]++;
  }
  bumpDay(clean, res.sec || 0);
}
const topicSeen = t => (S.top[t] || [0])[0];
function pickFresh(fresh, n){
  const pool = shuffle(fresh.slice()), out = [], used = {};
  while (out.length < n && pool.length) {
    let bi = 0, bs = Infinity;
    pool.forEach((it, j) => { const sc = (used[it.t] || 0) * 4 + Math.min(topicSeen(it.t), 40) * 0.08 + Math.random(); if (sc < bs) { bs = sc; bi = j; } });
    const it = pool.splice(bi, 1)[0]; out.push(it); used[it.t] = (used[it.t] || 0) + 1;
  }
  return out;
}
function interleave(list){
  const rest = list.slice(), out = [];
  while (rest.length) {
    const a = out[out.length - 1], b = out[out.length - 2];
    let bi = 0, bs = Infinity;
    rest.forEach((it, j) => {
      let sc = Math.random() * 0.5;
      if (a && a.t === it.t) sc += 3;
      if (b && b.t === it.t) sc += 1;
      if (a && b && kindOf(a) === kindOf(it) && kindOf(b) === kindOf(it)) sc += 2;
      if (sc < bs) { bs = sc; bi = j; }
    });
    out.push(rest.splice(bi, 1)[0]);
  }
  return out;
}
function buildSession(len, opt){
  const now = Date.now();
  let pool = ITEMS.slice();
  if (opt.errs) pool = pool.filter(i => S.errs[i.id]);
  else if (opt.topic != null) pool = pool.filter(i => i.t === opt.topic);
  else if (opt.mix && opt.mix !== 'all') pool = pool.filter(i => inMix(i, opt.mix));
  if (opt.errs || opt.topic != null) {
    const pr = i => S.errs[i.id] ? 0 : st(i.id)[2] > 0 && st(i.id)[1] <= now ? 1 : st(i.id)[2] === 0 ? 2 : 3;
    const sorted = shuffle(pool.slice()).sort((x, y) => pr(x) - pr(y) || st(x.id)[0] - st(y.id)[0] || st(x.id)[4] - st(y.id)[4]);
    return interleave(sorted.slice(0, len));
  }
  const seen = pool.filter(i => st(i.id)[2] > 0), fresh = pool.filter(i => st(i.id)[2] === 0);
  const due = seen.filter(i => st(i.id)[1] <= now).sort((x, y) => st(x.id)[0] - st(y.id)[0] || st(x.id)[1] - st(y.id)[1]);
  const out = due.slice(0, Math.min(due.length, fresh.length ? Math.ceil(len * 0.6) : len));
  out.push(...pickFresh(fresh, len - out.length));
  if (out.length < len) {
    const later = seen.filter(i => !out.includes(i)).sort((x, y) => st(x.id)[1] - st(y.id)[1]);
    for (const i of later) { if (out.length >= len) break; out.push(i); }
  }
  return interleave(out);
}
function queueInfo(mix){
  const now = Date.now(), pool = ITEMS.filter(i => inMix(i, mix || 'all'));
  return { due: pool.filter(i => st(i.id)[2] > 0 && st(i.id)[1] <= now).length, fresh: pool.filter(i => st(i.id)[2] === 0).length,
    seen: pool.filter(i => st(i.id)[2] > 0).length, mastered: pool.filter(i => st(i.id)[0] >= 3).length, total: pool.length };
}

/* ================= active-time clock ================= */
const clock = { acc: 0, since: 0, on: false };
function clockStart(){ clock.acc = 0; clock.on = true; clock.since = document.visibilityState === 'visible' ? performance.now() : 0; }
function clockRead(){ return (clock.acc + (clock.since ? performance.now() - clock.since : 0)) / 1000; }
function clockStop(){ const t = clockRead(); clock.on = false; clock.since = 0; clock.acc = 0; return Math.round(Math.min(t, 180) * 10) / 10; }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { if (clock.since) { clock.acc += performance.now() - clock.since; clock.since = 0; } }
  else if (clock.on && !clock.since) clock.since = performance.now();
});

/* ================= streak ================= */
function streak(){
  let n = 0, k = 0;
  const on = off => { const d = S.days[dayKey(dayShift(off).getTime())]; return d && d[0] >= ACTIVE_DAY; };
  if (!on(0)) k = -1;
  while (on(k - n)) n++;
  return n;
}
function bestStreak(){
  const keys = Object.keys(S.days).filter(k => S.days[k][0] >= ACTIVE_DAY).sort();
  let best = 0, run = 0, prev = null;
  for (const k of keys) { const t = new Date(k + 'T12:00:00').getTime(); run = prev && Math.round((t - prev) / DAY) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = t; }
  return best;
}

/* ================= series: one card ================= */
const C = { it: null, phase: '', order: [], chosen: null, ok: null, help: false, idk: false, retry: false, picks: new Set(), tries: 0, hint: false, wrongIn: '', recorded: false, sec: 0 };
function updateBar(doneN){

const nextBtn = () => `<button class="btn primary next" data-act="next">${SE.i + 1 >= SE.list.length ? 'Итог серии' : 'Дальше'}</button>`;

function afterHTML(){

  return (it.why ? `<p class="why">${fmt(it.why)}</p>` : '') +
    `<div class="ref"><span class="lbl">В шпаргалке</span><span class="tchip">${esc(tRef(it.t))}</span></div>` + nextBtn();

const idkBtn = () => `<div class="actions"><button class="linkbtn" data-act="idk">Не знаю</button></div>`;
function zoneHTML(){
  const it = C.it;

      `<text x="${xp(vals.length - 1).toFixed(1)}" y="${(yp(vals[vals.length - 1]) - 9).toFixed(1)}" text-anchor="end" font-size="11" font-weight="600" fill="var(--ink)">${Math.round(vals[vals.length - 1])} с</text>` +
      `<text x="${pl}" y="${Hc - 3}" font-size="10" fill="var(--muted)">старые</text><text x="${Wc - pr}" y="${Hc - 3}" text-anchor="end" font-size="10" fill="var(--muted)">последняя</text></svg>` +
      `<p>Среднее время от появления карточки до ответа. Факт, который знаешь наизусть, вспоминается за несколько секунд.</p>`;
  } else h += `<p>График появится после двух серий: по нему видно, как формулы и факты переходят на автомат.</p>`;
  h += `</div>`;
  const start = dayShift(-((new Date().getDay() + 6) % 7) - 28);
  let cells = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].map(d => `<span class="dn">${d}</span>`).join('');
  const todayKey = dayKey(Date.now());
  for (let k = 0; k < 35; k++) {
    const d = new Date(start); d.setDate(start.getDate() + k);
    const key = dayKey(d.getTime()), r = S.days[key], n = r ? r[0] : 0, fut = key > todayKey;
    const lv = fut ? 'fut' : n === 0 ? '' : n < ACTIVE_DAY ? 'h1' : n < S.set.goal ? 'h2' : n < S.set.goal * 2 ? 'h3' : 'h4';
    cells += `<span class="${lv}" title="${key}: ${n}"></span>`;
  }
  h += `<h3 class="sec-h">Активность за 5 недель</h3><div class="heatwrap"><div class="heat">${cells}</div><p class="note">Чем темнее клетка, тем больше карточек в этот день. День засчитывается в серию с ${ACTIVE_DAY} ответов.</p></div>`;
  const rows = ORDER.map(t => ({ t, v: S.top[t] || [0, 0] })).filter(x => x.v[0] >= 5);
  const weak = rows.filter(x => x.v[1] / x.v[0] < 0.75).sort((a, b) => a.v[1] / a.v[0] - b.v[1] / b.v[0]).slice(0, 6);
  h += `<h3 class="sec-h">Слабые места</h3>`;
  if (weak.length) h += `<div class="box">${weak.map(({ t, v }) => { const p = Math.round(v[1] / v[0] * 100);
      return `<div class="srow"><span class="t">${t === 'T' || t === 'D' ? '' : t + '. '}${esc(TOPICS[t])}<span class="weak">слабое место</span><small>${v[0]} ${plural(v[0], 'ответ', 'ответа', 'ответов')}</small></span>` +
        `<span class="pct">${p}%<small><button class="btn small" data-train="${esc(t)}" style="margin-top:4px">Тренировать</button></small></span>` +
        `<span class="meter"><i class="low" style="width:${p}%"></i></span></div>`; }).join('')}</div>`;
  else h += `<div class="empty">${rows.length ? 'Слабых тем нет: по всем темам, где было хотя бы 5 ответов, правильно с первого раза от 75%.' : 'Появятся, когда по темам накопится хотя бы 5 ответов.'}</div>`;
  h += `<h3 class="sec-h">По видам карточек</h3><div class="box">${KSTAT.map(([k, name]) => { const v = S.typ[k] || [0, 0], p = v[0] ? Math.round(v[1] / v[0] * 100) : null;
    return `<div class="srow"><span class="t">${name}<small>${v[0]} ${plural(v[0], 'ответ', 'ответа', 'ответов')}</small></span><span class="pct">${p === null ? '—' : p + '%'}</span>` +
      `<span class="meter"><i class="${p !== null && p < 60 ? 'low' : ''}" style="width:${p || 0}%"></i></span></div>`; }).join('')}` +
    `<div class="srow"><span class="t">Подсказок в вычислениях<small>чем меньше, тем лучше</small></span><span class="pct">${tot.hint}</span></div></div>`;
  const cnt = k => ITEMS.filter(i => inMix(i, k)).length;
  h += `<h3 class="sec-h">Настройки</h3><div class="box">` +
    `<div class="setrow"><span>Цель на день</span><span class="seg" role="group" aria-label="Цель на день">${GOALS.map(n => `<button data-goal="${n}" aria-pressed="${S.set.goal === n}">${n}</button>`).join('')}</span></div>` +
    `<div class="setrow"><span>Варианты в формулах</span><span class="seg" role="group" aria-label="Варианты в формулах"><button data-recall="1" aria-pressed="${S.set.recall}">сначала скрыты</button><button data-recall="0" aria-pressed="${!S.set.recall}">сразу</button></span></div>` +
    `<div class="setrow"><span>В тренажёре</span><span class="note">формул ${cnt('f')} · фактов ${cnt('facts')} · вычислений ${cnt('num')}${EXTRA ? ` · дополнительных: ${EXTRA}` : ''}</span></div></div>` +
    `<p class="note">Нашёл ошибку в карточке или факт из шпаргалки, которого здесь нет? Напиши в чат — исправлю или добавлю. Задачи на первый ход — в соседнем тренажёре «<a href="../index.html#t=pervyi-hod" target="_top">Первый ход</a>».</p>`;
  $('statsBody').innerHTML = h;
  setSync();
}
$('statsBody').addEventListener('click', e => {
  const g = e.target.closest('[data-goal]'); if (g) { S.set.goal = +g.dataset.goal; commit(); renderStats(); return; }
  const rc = e.target.closest('[data-recall]'); if (rc) { S.set.recall = rc.dataset.recall === '1'; commit(); renderStats(); return; }
  const tr = e.target.closest('[data-train]'); if (tr) { const t = tr.dataset.train; startSession({ topic: t }, t === 'T' || t === 'D' ? TOPICS[t] : `Тема ${t}: ${TOPICS[t]}`); }
});
$('resetBox').addEventListener('click', e => {
  if (e.target.closest('#reset')) {
    $('resetBox').innerHTML = `<div class="confirm"><p>Удалить всю статистику, повторения и список ошибок?</p>` +
      `<button class="btn small danger" id="resetYes">Да, сбросить</button><button class="btn small" id="resetNo">Отмена</button></div>`;
  } else if (e.target.closest('#resetYes')) { const keep = S.set; S = blank(); S.set = keep; commit(); renderStats(); restoreReset(); }
  else if (e.target.closest('#resetNo')) restoreReset();
});
function restoreReset(){ $('resetBox').innerHTML = '<button class="btn small danger" id="reset">Сбросить прогресс</button>'; }

/* ================= boot ================= */
renderHeader(); renderBadges(); setSync(); renderStart();
try { const t = localStorage.getItem(LS_KEY + '-tab'); if (t && t !== 'ser' && TABS.includes(t)) showTab(t); } catch (e) {}
initCloud();
</script>
