<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Орфография ЕГЭ 9–15</title>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: one column up to 660px. Sticky tab strip. The word sits on a squared exercise-book sheet;
   mistakes are corrected in "teacher's red", the EGE mode copies the KIM row list and answer-form cells. */
:root{
  --bg:#f1f3f8; --surface:#ffffff; --ink:#162032; --muted:#5a6680; --line:#d5dae6; --grid:#e3e8f2;
  --accent:#2341ab; --accent-soft:#e5eafa; --on-accent:#ffffff;
  --ok:#17784a; --ok-soft:#e1f1e8; --bad:#c12b25; --bad-soft:#f9e4e3; --on-bad:#ffffff;
  --exc:#8a5000; --exc-soft:#fbeed6;
  --f-ui:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-word:"Literata", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f131b; --surface:#171c27; --ink:#e5e8f0; --muted:#98a2b8; --line:#2a3142; --grid:#1f2533;
    --accent:#8fa4ff; --accent-soft:#1e2846; --on-accent:#0c111e;
    --ok:#5cc28d; --ok-soft:#14301f; --bad:#ff7b72; --bad-soft:#3b1a19; --on-bad:#2a0c0a;
    --exc:#efb25a; --exc-soft:#352710; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f131b; --surface:#171c27; --ink:#e5e8f0; --muted:#98a2b8; --line:#2a3142; --grid:#1f2533;
  --accent:#8fa4ff; --accent-soft:#1e2846; --on-accent:#0c111e;
  --ok:#5cc28d; --ok-soft:#14301f; --bad:#ff7b72; --bad-soft:#3b1a19; --on-bad:#2a0c0a;
  --exc:#efb25a; --exc-soft:#352710; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-ui);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
button:focus-visible,.chip:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.wrap{max-width:660px;margin:0 auto;padding-inline:16px;padding-block:14px 64px}

.hd{display:flex;gap:14px;align-items:center;padding-block:4px 12px}
.hd-num{width:50px;height:50px;flex:none;display:grid;place-items:center;border:2px solid var(--ink);
  border-radius:6px;font:700 1.7rem/1 var(--f-ui);font-variant-numeric:tabular-nums}
.hd h1{margin:0;font:700 1.3rem/1.15 var(--f-ui);text-wrap:balance}
.hd p{margin:3px 0 0;color:var(--muted);font-size:.88rem}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:2px;
  overflow-x:auto;scrollbar-width:none;padding-block:6px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;border-radius:8px;padding:10px 9px;cursor:pointer;
  font-weight:600;font-size:.9rem;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.cnt{display:inline-block;min-width:1.5em;margin-left:5px;padding:2px 6px;border-radius:999px;font-size:.72rem;
  line-height:1.3;text-align:center;background:var(--bad);color:var(--on-bad);font-variant-numeric:tabular-nums}
.cnt[data-zero]{background:var(--grid);color:var(--muted)}

/* ---------- drill ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 11px;
  font-size:.86rem;font-weight:500;cursor:pointer;white-space:nowrap}
.chip b{font-weight:600;color:var(--muted);margin-right:5px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.75}
.bar{display:flex;justify-content:space-between;gap:12px;font-size:.88rem;color:var(--muted);margin-bottom:6px}
.bar span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:4px;background:var(--grid);border-radius:2px;overflow:hidden;margin-bottom:12px}
.track i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s ease}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sheet{padding:30px 16px 26px;text-align:center;border-bottom:1px solid var(--line);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;background-position:-1px -1px}
.word{font:400 clamp(1.9rem,8.6vw,2.7rem)/1.25 var(--f-word);overflow-wrap:anywhere}
.ctx{margin-top:6px;color:var(--muted);font:italic 1.05rem/1.3 var(--f-word)}
.gap{display:inline-block;min-width:.95em;border-bottom:3px solid var(--accent);
  color:var(--accent);line-height:1.05;text-align:center}
.gap.ok,.gap.fix,.gap.on,.gap.gw{min-width:0}
.gap.gw{border-bottom-width:2px;padding-inline:.08em}
.word.long{font-size:clamp(1.25rem,5.4vw,1.6rem);line-height:1.5}
.mc{font-size:.85em;color:var(--muted)}
.ch.wide{font:600 1.05rem/1.1 var(--f-ui);min-width:120px;min-height:56px}
.pk button.wide{width:auto;min-width:46px;padding:0 11px;font:600 .9rem/1 var(--f-ui)}
body.sentmode .word{font-size:clamp(1.25rem,5.4vw,1.6rem);line-height:1.55;text-align:left}
body.sentmode .sheet{text-align:left}
body.sentmode .ctx{text-align:left}
body.sentmode .wl{grid-template-columns:1fr}
body.sentmode .wt{font-size:1.14rem;line-height:1.45}
body.sentmode .mlist .w{font-size:1.02rem;line-height:1.45}
.cells.words span{width:auto;min-width:130px;padding:0 12px;font:600 1.05rem/1.2 var(--f-word);height:auto;min-height:42px}
.gap .dots{color:var(--muted);letter-spacing:-.05em}
.gap.ok{color:var(--accent);border-color:var(--ok)}
.gap.fix{color:var(--bad);border-color:var(--bad)}
.was{display:inline-block;margin-left:.35em;font:500 .42em/1 var(--f-ui);color:var(--bad);vertical-align:middle;
  border:1.5px solid var(--bad);border-radius:5px;padding:.3em .45em}
.was s{font-family:var(--f-word);font-size:1.25em}

.choices{display:flex;gap:12px;justify-content:center;padding:18px 16px}
.ch{min-width:86px;min-height:62px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;
  cursor:pointer;font:400 2rem/1 var(--f-word);display:grid;place-items:center;gap:2px;padding:6px 10px}
.ch small{font:500 .68rem/1 var(--f-ui);color:var(--muted)}
.ch:hover:not(:disabled){border-color:var(--accent)}
.ch:disabled{cursor:default}
.ch.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.ch.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}

.fb{border-top:1px solid var(--line);padding:14px 16px 16px;display:grid;gap:10px}
.verdict{font-weight:700;font-size:1.05rem}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.verdict span{font-weight:500;color:var(--ink)}
.orth{display:flex;gap:10px;align-items:flex-start}
.ref{flex:none;font:600 .78rem/1 var(--f-ui);font-variant-numeric:tabular-nums;padding:5px 7px;border:1.5px solid var(--accent);
  border-radius:6px;color:var(--accent);white-space:nowrap}
.lbl{font:600 .68rem/1.2 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ttl{font-weight:600;line-height:1.3}
.why{margin:0}
.exc{background:var(--exc-soft);border-radius:8px;padding:10px 12px}
.badge{display:inline-block;font:700 .7rem/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--exc);
  border:1.5px solid var(--exc);border-radius:4px;padding:4px 6px;margin-bottom:6px}
.exc p{margin:0}
.note{margin:0;color:var(--muted);font-size:.93rem}
.note b{color:var(--ink);font-weight:600}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:13px 18px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{padding:9px 13px;font-size:.92rem}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.next{justify-self:start}

.done{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 16px;display:grid;gap:12px}
.done h2{margin:0;font:700 1.6rem/1.1 var(--f-ui);font-variant-numeric:tabular-nums}
.done p{margin:0;color:var(--muted)}
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.mlist li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.mlist .w{font:400 1.2rem/1.3 var(--f-word);min-width:0;overflow-wrap:anywhere}
.mlist .w b{color:var(--bad);font-weight:600}
.mlist .m{grid-column:1/-1;font-size:.86rem;color:var(--muted)}
.mlist .x{font:700 .66rem/1 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--exc);margin-left:6px}

/* ---------- EGE ---------- */
.kim{margin:0 0 12px;font-size:.98rem}
.kim b{font-variant-numeric:tabular-nums}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.row{display:grid;grid-template-columns:30px 1fr;gap:6px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:8px 12px 8px 10px}
.rn{font:700 1.05rem/1 var(--f-ui);padding-top:16px;font-variant-numeric:tabular-nums}
.row.good{border-color:var(--ok)} .row.good .rn{color:var(--ok)}
.row.badr{border-color:var(--bad)} .row.badr .rn{color:var(--bad)}
.rws{min-width:0}
.wl{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px;padding:7px 0;border-top:1px dashed var(--line)}
.wl:first-child{border-top:0}
.wt{font:400 1.32rem/1.3 var(--f-word);min-width:0;overflow-wrap:anywhere}
.wt i{font-size:.8em;color:var(--muted)}
.wt .gap{border-bottom-width:2.5px}
.pk{display:flex;gap:6px}
.pk button{width:46px;height:46px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);
  font:400 1.35rem/1 var(--f-word);cursor:pointer}
.pk button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pk button:disabled{cursor:default}
.pk button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.pk button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.wfb{grid-column:1/-1;font-size:.9rem;display:grid;gap:6px}
.wfb .orth{gap:8px}
.wfb .exc{padding:8px 10px}
.answer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.answer > span{font-weight:600}
.cells{display:flex}
.cells span{width:34px;height:42px;display:grid;place-items:center;border:1.5px solid var(--ink);margin-left:-1.5px;
  background:var(--surface);font:600 1.25rem/1 var(--f-ui);font-variant-numeric:tabular-nums}
.cells span:first-child{margin-left:0}
.hint{margin:8px 0 12px;color:var(--muted);font-size:.9rem;min-height:1.3em}
.eres{margin-top:14px;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;gap:8px}
.eres.full{border-color:var(--ok)} .eres.zero{border-color:var(--bad)}
.score{font:700 1.25rem/1.2 var(--f-ui)}
.eres.full .score{color:var(--ok)} .eres.zero .score{color:var(--bad)}
.eres p{margin:0}
.eres .cells span{width:30px;height:36px;font-size:1.05rem}
.cells.words{max-width:100%}
.cells.words span,.eres .cells.words span{width:auto;height:auto;min-height:40px;max-width:100%;padding:8px 12px;
  font:600 1.05rem/1.3 var(--f-word);overflow-wrap:anywhere;text-align:left}

/* ---------- lists & stats ---------- */
.lead{margin:0 0 12px;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:18px 16px;color:var(--muted)}
.srow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .t{font-weight:600;line-height:1.3;min-width:0}
.srow .t small{display:block;font-weight:400;color:var(--muted);font-size:.84rem}
.srow .pct{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.srow .pct small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.meter{grid-column:2/-1;height:6px;background:var(--grid);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.low{background:var(--bad)}
.weak{display:inline-block;margin-left:6px;font:700 .64rem/1 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;
  color:var(--bad);border:1.5px solid var(--bad);border-radius:4px;padding:3px 5px;vertical-align:2px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px 8px;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile b{display:block;font:700 1.35rem/1.1 var(--f-ui);font-variant-numeric:tabular-nums}
.tile span{font-size:.8rem;color:var(--muted)}
.sync{color:var(--muted);font-size:.86rem;margin:12px 0}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.confirm p{margin:0;width:100%;font-size:.92rem}
@media (max-width:420px){ .tiles{grid-template-columns:repeat(2,minmax(0,1fr))} .ch{min-width:76px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

.top{padding-block:4px 2px}
.brand{margin:0 0 10px;font:600 .74rem/1.2 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tasks{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:12px}
.tk{position:relative;display:grid;justify-items:center;gap:3px;min-width:0;padding:8px 2px 7px;border:2px solid var(--line);
  border-radius:8px;background:var(--surface);cursor:pointer}
.tk b{font:700 1.25rem/1 var(--f-ui);font-variant-numeric:tabular-nums}
.tk span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.6rem;color:var(--muted)}
.tk[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.tk[aria-pressed="true"] span{color:inherit;opacity:.8}
.tk i{position:absolute;top:-7px;right:-5px;min-width:1.5em;padding:1px 4px;border-radius:999px;background:var(--bad);
  color:var(--on-bad);font:700 .62rem/1.35 var(--f-ui);font-style:normal;text-align:center}
.hd{padding-block:0 10px}

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <p class="brand">Орфография ЕГЭ · задания 9–15 · офлайн</p>
    <nav class="tasks" id="tasks" aria-label="Задание"></nav>
    <div class="hd"><div><h1 id="hdTitle"></h1><p id="hdSub"></p></div></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Режимы">
    <button role="tab" id="t-drill" data-tab="drill" aria-selected="true">Правила</button>
    <button role="tab" id="t-ege" data-tab="ege" aria-selected="false">Как на ЕГЭ</button>
    <button role="tab" id="t-errs" data-tab="errs" aria-selected="false">Ошибки<span class="cnt" id="errCnt" data-zero>0</span></button>
    <button role="tab" id="t-stats" data-tab="stats" aria-selected="false">Итоги</button>
  </nav>

  <main>
    <section id="p-drill" role="tabpanel" aria-labelledby="t-drill">
      <div class="chips" id="chips" role="group" aria-label="Правило"></div>
      <div class="bar"><span id="dTitle"></span><span id="dProg"></span></div>
      <div class="track"><i id="dTrack"></i></div>
      <div class="card" id="dCard">
        <div class="sheet">
          <div class="word" id="dWord" aria-live="polite"></div>
          <div class="ctx" id="dCtx"></div>
        </div>
        <div class="choices" id="dChoices"></div>
        <div class="fb" id="dFb" hidden></div>
      </div>
      <div class="done" id="dDone" hidden></div>
    </section>

    <section id="p-ege" role="tabpanel" aria-labelledby="t-ege" hidden>
      <p class="kim" id="eTask"></p>
      <ol class="rows" id="eRows"></ol>
      <div class="answer"><span>Ответ:</span><div class="cells" id="eCells"></div></div>
      <p class="hint" id="eHint"></p>
      <div class="actions"><button class="btn primary" id="eCheck">Проверить</button><button class="btn" id="eNew">Новый вариант</button></div>
      <div class="eres" id="eRes" hidden></div>
    </section>

    <section id="p-errs" role="tabpanel" aria-labelledby="t-errs" hidden>
      <div id="errsBody"></div>
    </section>

    <section id="p-stats" role="tabpanel" aria-labelledby="t-stats" hidden>
      <div id="statsBody"></div>
      <p class="sync" id="sync"></p>
      <div id="resetBox"><button class="btn small danger" id="reset">Сбросить прогресс</button></div>
    </section>
  </main>
</div>

<script>

function fullWord(it){ return esc(it.p) + '<b>' + esc(lab(it, it.a)) + '</b>' + esc(it.s); }
function wasHTML(it, l){ return `<span class="was">ты: <s>${esc(lab(it, l))}</s></span>`; }
const ctxHTML = it => it.c ? ` <i>(${esc(it.c)})</i>` : '';
function explainHTML(it, compact){
  const R = RULE[it.r];
  let h = `<div class="orth"><span class="ref">${esc(R.ref)}</span><div><div class="lbl">Орфограмма</div><div class="ttl">${esc(R.title)}</div></div></div>`;
  if (!compact) h += `<p class="why">${esc(it.e)}</p>`;
  if (it.x) h += `<div class="exc"><span class="badge">Исключение</span><p>${esc(it.x.replace(/^Исключени[ея] к/, 'К'))}</p></div>`;
  if (it.n && !compact) h += `<p class="note"><b>Обрати внимание.</b> ${esc(it.n)}</p>`;
  return h;
}

/* ================= tabs ================= */
let current = 'drill';
function showTab(name){
  current = name;
  for (const t of ['drill', 'ege', 'errs', 'stats']) {
    $('t-' + t).setAttribute('aria-selected', String(t === name));
    $('p-' + t).hidden = t !== name;
  }
  if (name === 'errs') renderErrs();
  if (name === 'stats') renderStats();
  if (name === 'ege' && !E.rows) newEge();
  try { localStorage.setItem('ege-offline-tab', name); } catch (e) {}
}
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) showTab(b.dataset.tab); });
function renderBadges(){
  const n = Object.keys(S.errs).length, c = $('errCnt');
  c.textContent = n; if (n) c.removeAttribute('data-zero'); else c.setAttribute('data-zero', '');
}

/* ================= drill ================= */
const makeFilters = () => [
  { id: 'all', ref: '', label: 'Все правила', fn: () => true },
  { id: 'exc', ref: '', label: 'Только исключения', fn: it => !!it.x },
  ...RULES.map(r => ({ id: 'r_' + r.id, ref: r.ref, label: r.short, title: r.title, fn: it => it.r === r.id })),
];
const D = { filter: null, list: [], i: 0, answered: false, res: [] };
function renderChips(){
  $('chips').innerHTML = FILTERS.map(f =>
    `<button class="chip" data-f="${f.id}" aria-pressed="${D.filter.id === f.id}">${f.ref ? `<b>${esc(f.ref)}</b>` : ''}${esc(f.label)}</button>`).join('');
}
$('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; startDrill(FILTERS.find(f => f.id === b.dataset.f)); });

function buildSession(filter){
  const pool = filter.id === 'errs' ? Object.keys(S.errs).map(id => BYID[id]).filter(Boolean) : ITEMS.filter(filter.fn);
  const n = Math.min(TASK.sessionLen, pool.length), out = [];
  if (filter.id === 'all') {
    const by = {}; pool.forEach(it => (by[it.r] = by[it.r] || []).push(it));
    while (out.length < n) {
      const ids = Object.keys(by).filter(k => by[k].length); if (!ids.length) break;
      const list = by[ids[pickIndex(ids, k => (TASK.ruleWeight || {})[k] || 1)]];
      out.push(list.splice(pickIndex(list, wordWeight), 1)[0]);
    }
  } else {
    const list = pool.slice();
    while (out.length < n && list.length) out.push(list.splice(pickIndex(list, wordWeight), 1)[0]);
  }
  return out;
}
function startDrill(filter){
  D.filter = filter; D.list = buildSession(filter); D.i = 0; D.res = [];
  renderChips();
  $('dTitle').textContent = filter.id === 'errs' ? 'Работа над ошибками' : (filter.title || filter.label);
  $('dDone').hidden = true; $('dCard').hidden = false;
  if (!D.list.length) { $('dCard').hidden = true; $('dDone').hidden = false;
    $('dDone').innerHTML = '<p>Здесь пока нет слов.</p>'; $('dProg').textContent = ''; return; }
  renderCard();
}
function renderCard(){
  const it = D.list[D.i]; D.answered = false;
  $('dProg').textContent = `${D.i + 1} / ${D.list.length}`;
  $('dTrack').style.width = (D.i / D.list.length * 100) + '%';
  $('dWord').innerHTML = wordHTML(it, null);
  $('dWord').classList.toggle('long', !TASK.sentence && (it.p + it.s).length > 16);
  $('dCtx').textContent = it.c ? `(${it.c})` : '';
  $('dChoices').innerHTML = it.o.map((l, k) =>
    `<button class="ch${l.length > 1 ? ' wide' : ''}" data-l="${esc(l)}" aria-label="Вариант ${esc(l)}">${esc(l)}<small>${k + 1}</small></button>`).join('');
  $('dFb').hidden = true; $('dFb').innerHTML = '';
}
$('dChoices').addEventListener('click', e => { const b = e.target.closest('.ch'); if (b && !D.answered) answer(b.dataset.l); });
function answer(l){
  const it = D.list[D.i]; if (D.answered) return; D.answered = true;
  const ok = l === it.a;
  record(it, ok); commit();
  D.res.push({ id: it.id, ok });
  $('dWord').innerHTML = wordHTML(it, it.a, ok ? 'ok' : 'fix') + (ok ? '' : wasHTML(it, l));
  for (const b of $('dChoices').querySelectorAll('.ch')) {
    b.disabled = true;
    if (b.dataset.l === it.a) b.classList.add('right'); else if (b.dataset.l === l) b.classList.add('wrong');
  }
  const last = D.i + 1 >= D.list.length;
  $('dFb').innerHTML =
    `<div class="verdict ${ok ? 'ok' : 'bad'}">${ok ? 'Верно' : 'Ошибка'}${ok ? '' : ` <span>— правильно «${esc(lab(it, it.a))}»</span>`}</div>` +
    explainHTML(it, ok && !it.x) +
    `<button class="btn primary next" id="dNext">${last ? 'Итог серии' : 'Дальше'}</button>`;
  $('dFb').hidden = false;
  $('dTrack').style.width = ((D.i + 1) / D.list.length * 100) + '%';
  $('dNext').focus({ preventScroll: true });
  $('dNext').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
$('dFb').addEventListener('click', e => { if (e.target.closest('#dNext')) nextCard(); });
function nextCard(){ if (D.i + 1 >= D.list.length) return finishDrill(); D.i++; renderCard(); window.scrollTo({ top: Math.min(window.scrollY, $('chips').offsetTop - 70) }); }
function finishDrill(){
  const okN = D.res.filter(r => r.ok).length, bad = D.res.filter(r => !r.ok).map(r => BYID[r.id]);
  $('dCard').hidden = true; $('dDone').hidden = false;
  $('dProg').textContent = `${D.list.length} / ${D.list.length}`;
  $('dDone').innerHTML =
    `<h2>${okN} из ${D.list.length}</h2>` +
    (bad.length ? `<p>Ошибки в этой серии (они уже в списке «Ошибки»):</p><ul class="mlist">${bad.map(missLi).join('')}</ul>`
                : '<p>Без ошибок.</p>') +
    `<div class="actions"><button class="btn primary" id="dAgain">Ещё серия</button>` +
    (Object.keys(S.errs).length ? `<button class="btn" id="dErr">Повторить ошибки</button>` : '') + `</div>`;
}
function missLi(it){
  const R = RULE[it.r];
  return `<li><span class="w">${fullWord(it)}${it.c ? ` <i class="mc">(${esc(it.c)})</i>` : ''}</span>` +
    `<span class="ref">${esc(R.ref)}</span><span class="m">${esc(R.title)}${it.x ? '<span class="x">исключение</span>' : ''}</span></li>`;
}
$('dDone').addEventListener('click', e => {
  if (e.target.closest('#dAgain')) startDrill(D.filter.id === 'errs' ? FILTERS[0] : D.filter);
  if (e.target.closest('#dErr')) startDrill({ id: 'errs', label: 'Ошибки', fn: () => true });
});
document.addEventListener('keydown', e => {
  if (current !== 'drill' || e.ctrlKey || e.metaKey || e.altKey) return;
  if ($('dCard').hidden) return;
  const it = D.list[D.i]; if (!it) return;
  if (!D.answered) {
    const k = e.key.toLowerCase();
    if (/^[1-9]$/.test(k) && it.o[+k - 1]) { e.preventDefault(); answer(it.o[+k - 1]); }
    else if (it.o.includes(k)) { e.preventDefault(); answer(k); }
  } else if (e.key === 'Enter' || e.key === ' ') {
    if (document.activeElement && document.activeElement.classList.contains('chip')) return;
    e.preventDefault(); nextCard();
  }
});

/* ================= EGE mode ================= */
const E = { rows: null, picks: null, checked: false };
const rowHit = picks => G.mode === 'same' ? picks.every(x => x !== null && x === picks[0]) : picks.every(x => x === G.target);
function genEge(){
  const pool = ITEMS.filter(G.pool), used = new Set();
  const nOk = G.nTarget[0] + Math.floor(Math.random() * (G.nTarget[1] - G.nTarget[0] + 1));
  const flags = shuffle([...Array(G.rows)].map((_, i) => i < nOk));
  return flags.map(hit => {
    for (let attempt = 0; attempt < 60; attempt++) {
      let seq;
      if (G.mode === 'same') {
        const fam = G.families[pickIndex(G.families, f => f.w)];
        const L = fam.letters[Math.floor(Math.random() * 2)], M = fam.letters[1 - fam.letters.indexOf(L)];
        if (hit) seq = Array(G.rowLen).fill((fam.rare && Math.random() < 0.08) ? fam.rare : L);
        else {
          seq = shuffle([...Array(G.rowLen - 1).fill(L), M]);
          if (fam.rare && Math.random() < 0.22) seq[Math.floor(Math.random() * G.rowLen)] = fam.rare;
          if (seq.every(x => x === seq[0])) continue;
        }
      } else {
        const k = hit ? 0 : 1 + Math.floor(Math.random() * G.rowLen);
        seq = shuffle([...Array(k).fill(null), ...Array(G.rowLen - k).fill(G.target)]);
      }
      const words = [], rr = new Set(); let fail = false;
      for (const l of seq) {
        const cand = pool.filter(it => (l === null ? it.a !== G.target : it.a === l) && !used.has(it.id) && !words.includes(it));
        if (!cand.length) { fail = true; break; }
        const it = cand[pickIndex(cand, x => wordWeight(x) * (rr.has(x.r) ? 0.3 : 1))];
        words.push(it); rr.add(it.r);
      }
      if (fail) continue;
      words.forEach(w => used.add(w.id));
      return { words, hit: rowHit(words.map(w => w.a)) };
    }
    return null;
  }).filter(Boolean);
}
function pkHTML(it, ri, wi){
  return `<span class="pk">${it.o.map(l => `<button class="${l.length > 1 ? 'wide' : ''}" data-r="${ri}" data-w="${wi}" data-l="${esc(l)}" aria-pressed="false" aria-label="Ряд ${ri + 1}, слово ${wi + 1}: ${esc(l)}">${esc(l)}</button>`).join('')}</span>`;
}
function newEge(){
  E.rows = genEge(); E.picks = E.rows.map(r => r.words.map(() => null)); E.checked = false;
  $('eTask').innerHTML = `<b>${TASK.num}.</b> ${esc(G.text)}`;
  $('eRows').innerHTML = E.rows.map((row, ri) =>
    `<li class="row" id="row${ri}"><span class="rn">${ri + 1})</span><div class="rws">` +
    row.words.map((it, wi) =>
      `<div class="wl"><span class="wt" id="wt${ri}_${wi}">${wordHTML(it, null)}${ctxHTML(it)}</span>` + pkHTML(it, ri, wi) +
      `<div class="wfb" id="fb${ri}_${wi}" hidden></div></div>`).join('') +
    `</div></li>`).join('');
  $('eRes').hidden = true; $('eRes').innerHTML = '';
  $('eCheck').disabled = false;
  updateEge();
}
function userRows(){ return E.picks.map((p, i) => rowHit(p) ? i + 1 : null).filter(Boolean); }
function answerHTML(rowsIdx, picksOf){
  if (G.answer === 'words') {
    const w = rowsIdx.map(n => E.rows[n - 1].words.map((it, wi) => lab(it, picksOf(n - 1, wi))).join(', ')).join(' | ');
    return `<div class="cells words"><span>${esc(w || ' ')}</span></div>`;
  }
  const n = Math.max(5, G.rows), d = rowsIdx.slice(0, n); while (d.length < n) d.push('');
  return `<div class="cells">${d.map(x => `<span>${x}</span>`).join('')}</div>`;
}
function updateEge(){
  $('eCells').outerHTML = answerHTML(userRows(), (r, w) => E.picks[r][w]).replace('<div class="cells', '<div id="eCells" class="cells');
  const total = E.picks.flat().length, filled = E.picks.flat().filter(x => x !== null).length;
  if (!E.checked) $('eHint').textContent = filled < total
    ? `Заполни все пропуски: ${filled} из ${total}. ${G.hint}`
    : 'Всё заполнено. Ответ собран из твоих выборов — можно проверять.';
}
$('eRows').addEventListener('click', e => {
  const b = e.target.closest('.pk button'); if (!b || E.checked) return;
  const ri = +b.dataset.r, wi = +b.dataset.w, it = E.rows[ri].words[wi];
  E.picks[ri][wi] = b.dataset.l;
  for (const x of b.parentNode.children) x.setAttribute('aria-pressed', String(x === b));
  $('wt' + ri + '_' + wi).innerHTML = wordHTML(it, b.dataset.l, 'on') + ctxHTML(it);
  updateEge();
});
$('eNew').addEventListener('click', () => { newEge(); window.scrollTo({ top: 0 }); });
$('eCheck').addEventListener('click', () => {
  if (E.checked) return;
  const left = E.picks.flat().filter(x => x === null).length;
  if (left) { $('eHint').textContent = `Осталось заполнить ${left} ${plural(left, 'пропуск', 'пропуска', 'пропусков')}.`; return; }
  E.checked = true; $('eCheck').disabled = true;
  let wrongWords = 0; const total = E.picks.flat().length;
  E.rows.forEach((row, ri) => {
    row.words.forEach((it, wi) => {
      const l = E.picks[ri][wi], ok = l === it.a;
      if (!ok) wrongWords++;
      record(it, ok);
      $('wt' + ri + '_' + wi).innerHTML = wordHTML(it, it.a, ok ? 'ok' : 'fix') + (ok ? '' : wasHTML(it, l)) + ctxHTML(it);
      const btns = document.querySelectorAll(`.pk button[data-r="${ri}"][data-w="${wi}"]`);
      btns.forEach(x => { x.disabled = true; if (x.dataset.l === it.a) x.classList.add('right'); else if (x.dataset.l === l) x.classList.add('wrong'); });
      const fb = $('fb' + ri + '_' + wi); fb.innerHTML = explainHTML(it, ok && !it.x); fb.hidden = false;
    });
    $('row' + ri).classList.add(rowHit(E.picks[ri]) === row.hit ? 'good' : 'badr');
  });
  const right = E.rows.map((r, i) => r.hit ? i + 1 : null).filter(Boolean), mine = userRows();
  const full = right.join() === mine.join();
  S.ege.sets++; if (full) S.ege.full++;
  commit();
  const res = $('eRes');
  res.className = 'eres ' + (full ? 'full' : 'zero'); res.hidden = false;
  res.innerHTML = `<div class="score">${full ? '1 балл из 1' : '0 баллов из 1'}</div>` +
    `<p>Твой ответ:</p>${answerHTML(mine, (r, w) => E.picks[r][w])}` +
    `<p>Верный ответ:</p>${answerHTML(right, (r, w) => E.rows[r].words[w].a)}` +
    `<p>${wrongWords ? `Ошибок: ${wrongWords} из ${total}. Под каждым словом — орфограмма и правило.` : 'Все ответы в словах верные.'}</p>` +
    `<p class="mc">${esc(G.note)}</p>`;
  $('eHint').textContent = '';
  res.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
});

/* ================= errors ================= */
function renderErrs(){
  const ids = Object.keys(S.errs).filter(id => BYID[id]).sort((a, b) => S.errs[b][0] - S.errs[a][0]);
  if (!ids.length) { $('errsBody').innerHTML = '<div class="empty">Ошибок пока нет. Сюда попадает каждое слово, в котором ты ошибся, и уходит после двух верных ответов подряд.</div>'; return; }
  $('errsBody').innerHTML =
    `<p class="lead">${ids.length} ${plural(ids.length, 'слово', 'слова', 'слов')}. Слово уходит из списка после двух верных ответов подряд.</p>` +
    `<div class="actions" style="margin-bottom:12px"><button class="btn primary" id="errTrain">Тренировать ошибки</button></div>` +
    `<div class="box"><ul class="mlist">${ids.map(id => {
      const it = BYID[id], m = S.errs[id];
      return missLi(it).replace('</span></li>', ` · ошибок: ${m[0]}${m[1] ? `, верно подряд: ${m[1]}` : ''}</span></li>`);
    }).join('')}</ul></div>`;
}
$('errsBody').addEventListener('click', e => { if (e.target.closest('#errTrain')) { showTab('drill'); startDrill({ id: 'errs', label: 'Ошибки', fn: () => true }); } });

/* ================= stats ================= */
function renderStats(){
  let n = 0, ok = 0;
  for (const k in S.rules) { n += S.rules[k][0]; ok += S.rules[k][1]; }
  const seen = Object.keys(S.words).length;
  const rows = RULES.map(r => ({ r, v: S.rules[r.id] || [0, 0], total: ITEMS.filter(i => i.r === r.id).length }));
  const cand = rows.filter(x => x.v[0] >= 8).sort((a, b) => a.v[1] / a.v[0] - b.v[1] / b.v[0])[0];
  const weakId = cand && cand.v[1] / cand.v[0] < 0.8 ? cand.r.id : null;
  $('statsBody').innerHTML =
    `<div class="tiles">` +
    `<div class="tile"><b>${n}</b><span>${plural(n, 'ответ', 'ответа', 'ответов')}</span></div>` +
    `<div class="tile"><b>${n ? Math.round(ok / n * 100) + '%' : '—'}</b><span>верно</span></div>` +
    `<div class="tile"><b>${seen}<small style="font-size:.6em;color:var(--muted)">/${ITEMS.length}</small></b><span>слов встречено</span></div>` +
    `<div class="tile"><b>${S.ege.sets}</b><span>${plural(S.ege.sets, 'вариант', 'варианта', 'вариантов')} ЕГЭ</span></div>` +
    `<div class="tile"><b>${S.ege.full}</b><span>из них на 1 балл</span></div>` +
    `<div class="tile"><b>${Object.keys(S.errs).length}</b><span>в списке ошибок</span></div>` +
    `</div>` +
    `<div class="box">${rows.map(({ r, v, total }) => {
      const p = v[0] ? Math.round(v[1] / v[0] * 100) : null;
      return `<div class="srow"><span class="ref">${esc(r.ref)}</span>` +
        `<span class="t">${esc(r.title)}${r.id === weakId ? '<span class="weak">слабое место</span>' : ''}<small>${total} ${plural(total, 'слово', 'слова', 'слов')} в тренажёре</small></span>` +
        `<span class="pct">${p === null ? '—' : p + '%'}<small>${v[0]} ${plural(v[0], 'ответ', 'ответа', 'ответов')}</small></span>` +
        `<div class="meter"><i class="${p !== null && p < 70 ? 'low' : ''}" style="width:${p || 0}%"></i></div></div>`;
    }).join('')}</div>`;
  setSync();
}
$('resetBox').addEventListener('click', e => {
  if (e.target.closest('#reset')) {
    $('resetBox').innerHTML = `<div class="confirm"><p>Удалить всю статистику и список ошибок по заданию ${TASK.num}?</p>` +
      `<button class="btn small danger" id="resetYes">Да, сбросить</button><button class="btn small" id="resetNo">Отмена</button></div>`;
  } else if (e.target.closest('#resetYes')) {
    S = blank(); commit(); renderStats(); restoreReset();
  } else if (e.target.closest('#resetNo')) restoreReset();
});
function restoreReset(){ $('resetBox').innerHTML = '<button class="btn small danger" id="reset">Сбросить прогресс</button>'; }

/* ================= tasks ================= */
function renderTasks(){
  $('tasks').innerHTML = ALL.map(x => {
    let n = 0;
    try {
      const o = x.task.key === TASK.key ? S : JSON.parse(localStorage.getItem('ege-offline-' + x.task.key) || 'null');
      n = o && o.errs ? Object.keys(o.errs).length : 0;
    } catch (e) {}
    return `<button class="tk" data-k="${x.task.key}" aria-pressed="${x.task.key === TASK.key}" ` +
      `aria-label="Задание ${x.task.num}: ${esc(x.task.title)}"><b>${x.task.num}</b><span>${esc(x.task.short)}</span>` +
      (n ? `<i title="слов в списке ошибок">${n}</i>` : '') + `</button>`;
  }).join('');
}
$('tasks').addEventListener('click', e => {
  const b = e.target.closest('.tk');
  if (b && b.dataset.k !== TASK.key) { loadTask(b.dataset.k); window.scrollTo({ top: 0 }); }
});
function loadTask(key){
  const x = ALL.find(a => a.task.key === key) || ALL[0];
  DATA = x.data; TASK = x.task; RULES = DATA.rules; RULE = Object.fromEntries(RULES.map(r => [r.id, r]));
  ITEMS = DATA.items; BYID = Object.fromEntries(ITEMS.map(i => [i.id, i])); G = TASK.ege;
  LS_KEY = 'ege-offline-' + TASK.key;
  FILTERS = makeFilters();
  S = loadState();
  E.rows = null; E.picks = null; E.checked = false;
  document.body.classList.toggle('sentmode', !!TASK.sentence);
  document.title = 'Орфография ЕГЭ — задание ' + TASK.num;
  $('hdTitle').textContent = TASK.title;
  $('hdSub').textContent = TASK.sub;
  try { localStorage.setItem('ege-offline-task', TASK.key); } catch (e) {}
  restoreReset(); renderTasks(); renderBadges(); setSync();
  startDrill(FILTERS[0]);
  if (current === 'ege') newEge(); else if (current === 'errs') renderErrs(); else if (current === 'stats') renderStats();
}

/* ================= boot ================= */
let startKey = 't9', startTab = 'drill';
try { startKey = localStorage.getItem('ege-offline-task') || 't9'; startTab = localStorage.getItem('ege-offline-tab') || 'drill'; } catch (e) {}
loadTask(startKey);
if (startTab !== 'drill' && $('t-' + startTab)) showTab(startTab);
</script>
